[pytest]
addopts = --import-mode=importlib -p no:cacheprovider
norecursedirs = .codex tmp_pytest global_tests qualification phase_qualification node_modules
testpaths =
    tools/tests
    tests
    extensions/p3_mcp_addendum
    phase_00_zero_trust/phase_00_zero_trust_guardian_agent_package_RC4_1/tests
    phase_01_ingestion/phase_01_ingestion_agent_package_RC4_1/tests
    phase_02_extracted/phase_02_quality_pit_agent_package_RC4_1/tests
    phase_03_extracted/phase_03_agents_rag_memory_agent_package_RC4_1/tests
    phase_04_extracted/phase_04_feature_base_agent_package_RC4_1/tests
    phase_05_extracted/phase_05_underlying_forecasts_agent_package_RC4_1/tests
    phase_06_extracted/phase_06_candidate_generation_agent_package_RC4_1/tests
    phase_07_extracted/phase_07_ranking_agent_package_RC4_1/tests
    phase_08_extracted/phase_08_portfolio_backtest_agent_package_RC4_1/tests
    phase_09_extracted/phase_09_audit_learning_agent_package_RC4_1/tests
markers =
    phase_qualification: phase-level operational qualification suites
    qualification_p1: MASTER_P1_COLD_START_DATA_RECONSTRUCTION
    qualification_p2: MASTER_P2_POINT_IN_TIME_RESEARCH_READINESS
    temporal_integrity: reusable temporal invariant qualification checks
    critical_mutation: deliberately defective variants that must be rejected
    integration: integration-level test
    unit: unit-level test
