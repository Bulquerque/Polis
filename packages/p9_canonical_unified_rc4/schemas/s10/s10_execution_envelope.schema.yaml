$defs:
  ArtifactReference:
    additionalProperties: false
    properties:
      artifact_id:
        maxLength: 160
        minLength: 1
        title: Artifact Id
        type: string
      artifact_role:
        maxLength: 256
        minLength: 1
        title: Artifact Role
        type: string
      available_at:
        format: date-time
        title: Available At
        type: string
      cycle:
        $ref: '#/$defs/CycleRef'
      location:
        maxLength: 256
        minLength: 1
        title: Location
        type: string
      payload_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Payload Sha256
        type: string
      producer_module_id:
        maxLength: 256
        minLength: 1
        title: Producer Module Id
        type: string
      run_id:
        maxLength: 256
        minLength: 1
        title: Run Id
        type: string
      schema_name:
        maxLength: 256
        minLength: 1
        title: Schema Name
        type: string
      schema_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Schema Sha256
        type: string
      schema_version:
        maxLength: 256
        minLength: 1
        title: Schema Version
        type: string
    required:
    - artifact_id
    - artifact_role
    - schema_name
    - schema_version
    - schema_sha256
    - payload_sha256
    - producer_module_id
    - run_id
    - cycle
    - available_at
    - location
    title: ArtifactReference
    type: object
  BuildEnvironment:
    additionalProperties: false
    properties:
      dependency_lock_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Dependency Lock Sha256
        type: string
      platform:
        maxLength: 256
        minLength: 1
        title: Platform
        type: string
      pydantic_version:
        maxLength: 256
        minLength: 1
        title: Pydantic Version
        type: string
      python_version:
        maxLength: 256
        minLength: 1
        title: Python Version
        type: string
      s10_distribution_version:
        maxLength: 256
        minLength: 1
        title: S10 Distribution Version
        type: string
      s9_distribution_version:
        maxLength: 256
        minLength: 1
        title: S9 Distribution Version
        type: string
    required:
    - python_version
    - platform
    - pydantic_version
    - s9_distribution_version
    - s10_distribution_version
    - dependency_lock_sha256
    title: BuildEnvironment
    type: object
  CausalStatus:
    enum:
    - ASSOCIATION
    - ATTRIBUTED
    - CAUSAL
    - UNKNOWN
    title: CausalStatus
    type: string
  ConsumerReceiptReference:
    additionalProperties: false
    properties:
      accepted_count:
        minimum: 0
        title: Accepted Count
        type: integer
      consumer_id:
        maxLength: 256
        minLength: 1
        title: Consumer Id
        type: string
      receipt_ref:
        $ref: '#/$defs/ArtifactReference'
      rejected_count:
        minimum: 0
        title: Rejected Count
        type: integer
      reserved_count:
        minimum: 0
        title: Reserved Count
        type: integer
      source_contract_name:
        maxLength: 256
        minLength: 1
        title: Source Contract Name
        type: string
      source_contract_version:
        maxLength: 256
        minLength: 1
        title: Source Contract Version
        type: string
    required:
    - consumer_id
    - source_contract_name
    - source_contract_version
    - receipt_ref
    - accepted_count
    - rejected_count
    - reserved_count
    title: ConsumerReceiptReference
    type: object
  CycleRef:
    additionalProperties: false
    properties:
      cycle_id:
        maxLength: 256
        minLength: 1
        title: Cycle Id
        type: string
      ordinal:
        minimum: 0
        title: Ordinal
        type: integer
    required:
    - cycle_id
    - ordinal
    title: CycleRef
    type: object
  EvidenceQuality:
    enum:
    - FACTUAL_EXECUTED
    - FACTUAL_OBSERVED
    - OBSERVABLE_COUNTERFACTUAL
    - MODEL_BASED_COUNTERFACTUAL
    - CENSORED
    - UNAVAILABLE
    title: EvidenceQuality
    type: string
  EvidenceReference:
    additionalProperties: false
    properties:
      artifact_ref:
        $ref: '#/$defs/ArtifactReference'
      evidence_id:
        maxLength: 256
        minLength: 1
        title: Evidence Id
        type: string
      quality:
        $ref: '#/$defs/EvidenceQuality'
      summary:
        maxLength: 4000
        minLength: 1
        title: Summary
        type: string
    required:
    - evidence_id
    - artifact_ref
    - quality
    - summary
    title: EvidenceReference
    type: object
  FeedbackDistributionManifest:
    additionalProperties: false
    properties:
      accepted_feedback_ids:
        items:
          maxLength: 256
          minLength: 1
          type: string
        title: Accepted Feedback Ids
        type: array
      activated_feedback_ids:
        default: []
        items:
          maxLength: 256
          minLength: 1
          type: string
        title: Activated Feedback Ids
        type: array
      rejected_feedback_ids:
        items:
          maxLength: 256
          minLength: 1
          type: string
        title: Rejected Feedback Ids
        type: array
      reserved_feedback_ids:
        items:
          maxLength: 256
          minLength: 1
          type: string
        title: Reserved Feedback Ids
        type: array
    required:
    - accepted_feedback_ids
    - rejected_feedback_ids
    - reserved_feedback_ids
    title: FeedbackDistributionManifest
    type: object
  FeedbackEffectivenessAssessment:
    additionalProperties: false
    properties:
      confidence_lower:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Confidence Lower
      confidence_upper:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Confidence Upper
      confounded:
        default: false
        title: Confounded
        type: boolean
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      feedback_id:
        maxLength: 192
        minLength: 1
        title: Feedback Id
        type: string
      guardrail_regressions:
        default: []
        items:
          maxLength: 256
          minLength: 1
          type: string
        title: Guardrail Regressions
        type: array
      mean_effect:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Mean Effect
      metric_id:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Metric Id
      policy_diff_sha256:
        anyOf:
        - pattern: ^[0-9a-f]{64}$
          type: string
        - type: 'null'
        default: null
        title: Policy Diff Sha256
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      sample_size:
        minimum: 0
        title: Sample Size
        type: integer
      standard_error:
        anyOf:
        - minimum: 0.0
          type: number
        - type: 'null'
        default: null
        title: Standard Error
      state:
        $ref: '#/$defs/FeedbackLifecycleState'
    required:
    - feedback_id
    - state
    - sample_size
    title: FeedbackEffectivenessAssessment
    type: object
  FeedbackEffectivenessModuleOutput:
    additionalProperties: false
    properties:
      lifecycle_ledger:
        $ref: '#/$defs/FeedbackLifecycleLedger'
      regression_panel:
        $ref: '#/$defs/FeedbackRegressionPanel'
      report:
        $ref: '#/$defs/FeedbackEffectivenessReport'
    required:
    - report
    - lifecycle_ledger
    - regression_panel
    title: FeedbackEffectivenessModuleOutput
    type: object
  FeedbackEffectivenessReport:
    additionalProperties: false
    properties:
      assessments:
        items:
          $ref: '#/$defs/FeedbackEffectivenessAssessment'
        title: Assessments
        type: array
      effective_count:
        minimum: 0
        title: Effective Count
        type: integer
      inconclusive_count:
        minimum: 0
        title: Inconclusive Count
        type: integer
      ineffective_count:
        minimum: 0
        title: Ineffective Count
        type: integer
      other_count:
        minimum: 0
        title: Other Count
        type: integer
      pending_count:
        minimum: 0
        title: Pending Count
        type: integer
      policy_id:
        maxLength: 256
        minLength: 1
        title: Policy Id
        type: string
      regressive_count:
        minimum: 0
        title: Regressive Count
        type: integer
    required:
    - policy_id
    - assessments
    - effective_count
    - ineffective_count
    - regressive_count
    - inconclusive_count
    - pending_count
    - other_count
    title: FeedbackEffectivenessReport
    type: object
  FeedbackLifecycleEvent:
    additionalProperties: false
    properties:
      cycle:
        $ref: '#/$defs/CycleRef'
      event_id:
        maxLength: 256
        minLength: 1
        title: Event Id
        type: string
      event_time:
        format: date-time
        title: Event Time
        type: string
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      feedback_id:
        maxLength: 192
        minLength: 1
        title: Feedback Id
        type: string
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      state:
        $ref: '#/$defs/FeedbackLifecycleState'
    required:
    - event_id
    - feedback_id
    - state
    - cycle
    - event_time
    title: FeedbackLifecycleEvent
    type: object
  FeedbackLifecycleLedger:
    additionalProperties: false
    properties:
      events:
        items:
          $ref: '#/$defs/FeedbackLifecycleEvent'
        title: Events
        type: array
      ledger_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Ledger Sha256
        type: string
      previous_ledger_sha256:
        anyOf:
        - pattern: ^[0-9a-f]{64}$
          type: string
        - type: 'null'
        default: null
        title: Previous Ledger Sha256
    required:
    - events
    - ledger_sha256
    title: FeedbackLifecycleLedger
    type: object
  FeedbackLifecycleState:
    enum:
    - PROPOSED
    - VALIDATED
    - AUTHORIZED
    - ACTIVATED
    - OUTCOME_NOT_MATURED
    - EVALUATED
    - EFFECTIVE
    - INEFFECTIVE
    - REGRESSIVE
    - INCONCLUSIVE
    - EXPIRED
    - REVERTED
    - NOT_ACTIVATED
    - INVALID
    title: FeedbackLifecycleState
    type: string
  FeedbackRegressionPanel:
    additionalProperties: false
    properties:
      records:
        items:
          $ref: '#/$defs/FeedbackRegressionRecord'
        title: Records
        type: array
    required:
    - records
    title: FeedbackRegressionPanel
    type: object
  FeedbackRegressionRecord:
    additionalProperties: false
    properties:
      adverse_change:
        minimum: 0.0
        title: Adverse Change
        type: number
      critical:
        title: Critical
        type: boolean
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      feedback_id:
        maxLength: 192
        minLength: 1
        title: Feedback Id
        type: string
      guardrail_id:
        maxLength: 256
        minLength: 1
        title: Guardrail Id
        type: string
    required:
    - feedback_id
    - guardrail_id
    - adverse_change
    - critical
    title: FeedbackRegressionRecord
    type: object
  MaturedLessonPanel:
    additionalProperties: false
    properties:
      items:
        items:
          $ref: '#/$defs/ResearchMemoryItem'
        title: Items
        type: array
    required:
    - items
    title: MaturedLessonPanel
    type: object
  MemoryAndP3HandoffOutput:
    additionalProperties: false
    properties:
      memory_update:
        $ref: '#/$defs/SystemResearchMemoryUpdate'
      p3_handoff:
        $ref: '#/$defs/P3ResearchContextHandoff'
      p3_manifest:
        $ref: '#/$defs/P3ContextHandoffManifest'
    required:
    - memory_update
    - p3_handoff
    - p3_manifest
    title: MemoryAndP3HandoffOutput
    type: object
  MemoryUpdateState:
    enum:
    - RESEARCH_MEMORY_UPDATED
    - RESEARCH_MEMORY_UNCHANGED
    - MEMORY_UPDATE_INVALID
    title: MemoryUpdateState
    type: string
  MetricValue:
    additionalProperties: false
    properties:
      metric_id:
        maxLength: 256
        minLength: 1
        title: Metric Id
        type: string
      metric_version:
        default: 1.0.0
        maxLength: 256
        minLength: 1
        title: Metric Version
        type: string
      unit:
        maxLength: 256
        minLength: 1
        title: Unit
        type: string
      value:
        title: Value
        type: number
    required:
    - metric_id
    - value
    - unit
    title: MetricValue
    type: object
  ModuleDiagnostics:
    additionalProperties: false
    properties:
      counters:
        default: []
        items:
          maxItems: 2
          minItems: 2
          prefixItems:
          - maxLength: 256
            minLength: 1
            type: string
          - type: integer
          type: array
        title: Counters
        type: array
      scalars:
        default: []
        items:
          $ref: '#/$defs/MetricValue'
        title: Scalars
        type: array
      trace:
        default: []
        items:
          maxLength: 4000
          minLength: 1
          type: string
        title: Trace
        type: array
      warnings:
        default: []
        items:
          maxLength: 4000
          minLength: 1
          type: string
        title: Warnings
        type: array
    title: ModuleDiagnostics
    type: object
  ModuleResult_FeedbackEffectivenessModuleOutput_:
    additionalProperties: false
    properties:
      diagnostics:
        $ref: '#/$defs/ModuleDiagnostics'
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      module_id:
        pattern: ^P9\.S10\.M0[1-4]$
        title: Module Id
        type: string
      output:
        anyOf:
        - $ref: '#/$defs/FeedbackEffectivenessModuleOutput'
        - type: 'null'
      output_sha256:
        anyOf:
        - pattern: ^[0-9a-f]{64}$
          type: string
        - type: 'null'
        default: null
        title: Output Sha256
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      status:
        $ref: '#/$defs/ModuleStatus'
    required:
    - module_id
    - status
    - output
    - diagnostics
    title: ModuleResult[FeedbackEffectivenessModuleOutput]
    type: object
  ModuleResult_MemoryAndP3HandoffOutput_:
    additionalProperties: false
    properties:
      diagnostics:
        $ref: '#/$defs/ModuleDiagnostics'
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      module_id:
        pattern: ^P9\.S10\.M0[1-4]$
        title: Module Id
        type: string
      output:
        anyOf:
        - $ref: '#/$defs/MemoryAndP3HandoffOutput'
        - type: 'null'
      output_sha256:
        anyOf:
        - pattern: ^[0-9a-f]{64}$
          type: string
        - type: 'null'
        default: null
        title: Output Sha256
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      status:
        $ref: '#/$defs/ModuleStatus'
    required:
    - module_id
    - status
    - output
    - diagnostics
    title: ModuleResult[MemoryAndP3HandoffOutput]
    type: object
  ModuleResult_NormalizedResearchMemoryBundle_:
    additionalProperties: false
    properties:
      diagnostics:
        $ref: '#/$defs/ModuleDiagnostics'
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      module_id:
        pattern: ^P9\.S10\.M0[1-4]$
        title: Module Id
        type: string
      output:
        anyOf:
        - $ref: '#/$defs/NormalizedResearchMemoryBundle'
        - type: 'null'
      output_sha256:
        anyOf:
        - pattern: ^[0-9a-f]{64}$
          type: string
        - type: 'null'
        default: null
        title: Output Sha256
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      status:
        $ref: '#/$defs/ModuleStatus'
    required:
    - module_id
    - status
    - output
    - diagnostics
    title: ModuleResult[NormalizedResearchMemoryBundle]
    type: object
  ModuleResult_ReleaseCandidateOutput_:
    additionalProperties: false
    properties:
      diagnostics:
        $ref: '#/$defs/ModuleDiagnostics'
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      module_id:
        pattern: ^P9\.S10\.M0[1-4]$
        title: Module Id
        type: string
      output:
        anyOf:
        - $ref: '#/$defs/ReleaseCandidateOutput'
        - type: 'null'
      output_sha256:
        anyOf:
        - pattern: ^[0-9a-f]{64}$
          type: string
        - type: 'null'
        default: null
        title: Output Sha256
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      status:
        $ref: '#/$defs/ModuleStatus'
    required:
    - module_id
    - status
    - output
    - diagnostics
    title: ModuleResult[ReleaseCandidateOutput]
    type: object
  ModuleStatus:
    enum:
    - SUCCESS
    - LIMITED
    - INSUFFICIENT_EVIDENCE
    - INVALID
    - FAILED
    title: ModuleStatus
    type: string
  NegativeResearchMemoryPanel:
    additionalProperties: false
    properties:
      items:
        items:
          $ref: '#/$defs/ResearchMemoryItem'
        title: Items
        type: array
    required:
    - items
    title: NegativeResearchMemoryPanel
    type: object
  NormalizedResearchMemoryBundle:
    additionalProperties: false
    properties:
      matured_lessons:
        $ref: '#/$defs/MaturedLessonPanel'
      merged_candidate_ids:
        default: []
        items:
          maxLength: 256
          minLength: 1
          type: string
        title: Merged Candidate Ids
        type: array
      negative_memory:
        $ref: '#/$defs/NegativeResearchMemoryPanel'
      policy_id:
        maxLength: 256
        minLength: 1
        title: Policy Id
        type: string
      research_hypotheses:
        $ref: '#/$defs/ResearchHypothesisPanel'
      skipped_candidate_ids:
        default: []
        items:
          maxLength: 256
          minLength: 1
          type: string
        title: Skipped Candidate Ids
        type: array
      warnings:
        default: []
        items:
          maxLength: 4000
          minLength: 1
          type: string
        title: Warnings
        type: array
    required:
    - policy_id
    - matured_lessons
    - research_hypotheses
    - negative_memory
    title: NormalizedResearchMemoryBundle
    type: object
  P0AuthorizationRequestManifest:
    additionalProperties: false
    properties:
      authorization_state:
        $ref: '#/$defs/P0AuthorizationState'
      recommendation_id:
        maxLength: 256
        minLength: 1
        title: Recommendation Id
        type: string
      release_id:
        maxLength: 256
        minLength: 1
        title: Release Id
        type: string
      request_id:
        maxLength: 256
        minLength: 1
        title: Request Id
        type: string
      request_payload_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Request Payload Sha256
        type: string
    required:
    - release_id
    - request_id
    - recommendation_id
    - authorization_state
    - request_payload_sha256
    title: P0AuthorizationRequestManifest
    type: object
  P0AuthorizationState:
    enum:
    - PENDING_P0
    title: P0AuthorizationState
    type: string
  P3ContextCategory:
    enum:
    - ABSTRACT_LESSON
    - RESEARCH_HYPOTHESIS
    - UNCERTAINTY
    - FAILURE_PATTERN
    - RESEARCH_QUESTION
    title: P3ContextCategory
    type: string
  P3ContextHandoffManifest:
    additionalProperties: false
    properties:
      blocked_memory_item_ids:
        items:
          maxLength: 192
          minLength: 1
          type: string
        title: Blocked Memory Item Ids
        type: array
      context_item_ids:
        items:
          maxLength: 256
          minLength: 1
          type: string
        title: Context Item Ids
        type: array
      contract_name:
        maxLength: 256
        minLength: 1
        title: Contract Name
        type: string
      contract_version:
        maxLength: 256
        minLength: 1
        title: Contract Version
        type: string
      created_at:
        format: date-time
        title: Created At
        type: string
      handoff_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Handoff Sha256
        type: string
      manifest_id:
        maxLength: 256
        minLength: 1
        title: Manifest Id
        type: string
      source_memory_snapshot_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Source Memory Snapshot Sha256
        type: string
    required:
    - manifest_id
    - source_memory_snapshot_sha256
    - handoff_sha256
    - contract_name
    - contract_version
    - context_item_ids
    - blocked_memory_item_ids
    - created_at
    title: P3ContextHandoffManifest
    type: object
  P3ContextState:
    enum:
    - P3_CONTEXT_READY
    - NO_EXPORTABLE_CONTEXT
    - TEMPORAL_LEAKAGE_BLOCKED
    - P3_SCHEMA_INCOMPATIBLE
    title: P3ContextState
    type: string
  P3ResearchContextHandoff:
    additionalProperties: false
    properties:
      blocked_memory_item_ids:
        default: []
        items:
          maxLength: 192
          minLength: 1
          type: string
        title: Blocked Memory Item Ids
        type: array
      context_items:
        items:
          $ref: '#/$defs/P3ResearchContextItem'
        title: Context Items
        type: array
      contract_name:
        default: P9_RESEARCH_CONTEXT_HANDOFF_V1
        maxLength: 256
        minLength: 1
        title: Contract Name
        type: string
      contract_version:
        default: 1.0.0
        maxLength: 256
        minLength: 1
        title: Contract Version
        type: string
      destination:
        default: P3_RESEARCH_CONTEXT_ONLY
        maxLength: 256
        minLength: 1
        title: Destination
        type: string
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      state:
        $ref: '#/$defs/P3ContextState'
      world_memory_write_allowed:
        default: false
        title: World Memory Write Allowed
        type: boolean
    required:
    - state
    - context_items
    title: P3ResearchContextHandoff
    type: object
  P3ResearchContextItem:
    additionalProperties: false
    properties:
      abstract_claim:
        maxLength: 4000
        minLength: 1
        title: Abstract Claim
        type: string
      category:
        $ref: '#/$defs/P3ContextCategory'
      context_item_id:
        maxLength: 256
        minLength: 1
        title: Context Item Id
        type: string
      evidence_quality:
        $ref: '#/$defs/EvidenceQuality'
      research_question:
        maxLength: 4000
        minLength: 1
        title: Research Question
        type: string
      scope:
        $ref: '#/$defs/ResearchScope'
      source_memory_item_id:
        maxLength: 192
        minLength: 1
        title: Source Memory Item Id
        type: string
      uncertainty:
        maxLength: 4000
        minLength: 1
        title: Uncertainty
        type: string
      world_memory_write_allowed:
        default: false
        title: World Memory Write Allowed
        type: boolean
    required:
    - context_item_id
    - category
    - abstract_claim
    - uncertainty
    - research_question
    - scope
    - source_memory_item_id
    - evidence_quality
