$defs:
  ArtifactReference:
    additionalProperties: false
    properties:
      artifact_id:
        maxLength: 160
        minLength: 1
        title: Artifact Id
        type: string
      artifact_role:
        maxLength: 256
        minLength: 1
        title: Artifact Role
        type: string
      available_at:
        format: date-time
        title: Available At
        type: string
      cycle:
        $ref: '#/$defs/CycleRef'
      location:
        maxLength: 256
        minLength: 1
        title: Location
        type: string
      payload_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Payload Sha256
        type: string
      producer_module_id:
        maxLength: 256
        minLength: 1
        title: Producer Module Id
        type: string
      run_id:
        maxLength: 256
        minLength: 1
        title: Run Id
        type: string
      schema_name:
        maxLength: 256
        minLength: 1
        title: Schema Name
        type: string
      schema_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Schema Sha256
        type: string
      schema_version:
        maxLength: 256
        minLength: 1
        title: Schema Version
        type: string
    required:
    - artifact_id
    - artifact_role
    - schema_name
    - schema_version
    - schema_sha256
    - payload_sha256
    - producer_module_id
    - run_id
    - cycle
    - available_at
    - location
    title: ArtifactReference
    type: object
  CycleRef:
    additionalProperties: false
    properties:
      cycle_id:
        maxLength: 256
        minLength: 1
        title: Cycle Id
        type: string
      ordinal:
        minimum: 0
        title: Ordinal
        type: integer
    required:
    - cycle_id
    - ordinal
    title: CycleRef
    type: object
  EvidenceQuality:
    enum:
    - FACTUAL_EXECUTED
    - FACTUAL_OBSERVED
    - OBSERVABLE_COUNTERFACTUAL
    - MODEL_BASED_COUNTERFACTUAL
    - CENSORED
    - UNAVAILABLE
    title: EvidenceQuality
    type: string
  EvidenceReference:
    additionalProperties: false
    properties:
      artifact_ref:
        $ref: '#/$defs/ArtifactReference'
      evidence_id:
        maxLength: 256
        minLength: 1
        title: Evidence Id
        type: string
      quality:
        $ref: '#/$defs/EvidenceQuality'
      summary:
        maxLength: 4000
        minLength: 1
        title: Summary
        type: string
    required:
    - evidence_id
    - artifact_ref
    - quality
    - summary
    title: EvidenceReference
    type: object
  FeedbackEffectivenessAssessment:
    additionalProperties: false
    properties:
      confidence_lower:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Confidence Lower
      confidence_upper:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Confidence Upper
      confounded:
        default: false
        title: Confounded
        type: boolean
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      feedback_id:
        maxLength: 192
        minLength: 1
        title: Feedback Id
        type: string
      guardrail_regressions:
        default: []
        items:
          maxLength: 256
          minLength: 1
          type: string
        title: Guardrail Regressions
        type: array
      mean_effect:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Mean Effect
      metric_id:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Metric Id
      policy_diff_sha256:
        anyOf:
        - pattern: ^[0-9a-f]{64}$
          type: string
        - type: 'null'
        default: null
        title: Policy Diff Sha256
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      sample_size:
        minimum: 0
        title: Sample Size
        type: integer
      standard_error:
        anyOf:
        - minimum: 0.0
          type: number
        - type: 'null'
        default: null
        title: Standard Error
      state:
        $ref: '#/$defs/FeedbackLifecycleState'
    required:
    - feedback_id
    - state
    - sample_size
    title: FeedbackEffectivenessAssessment
    type: object
  FeedbackEffectivenessReport:
    additionalProperties: false
    properties:
      assessments:
        items:
          $ref: '#/$defs/FeedbackEffectivenessAssessment'
        title: Assessments
        type: array
      effective_count:
        minimum: 0
        title: Effective Count
        type: integer
      inconclusive_count:
        minimum: 0
        title: Inconclusive Count
        type: integer
      ineffective_count:
        minimum: 0
        title: Ineffective Count
        type: integer
      other_count:
        minimum: 0
        title: Other Count
        type: integer
      pending_count:
        minimum: 0
        title: Pending Count
        type: integer
      policy_id:
        maxLength: 256
        minLength: 1
        title: Policy Id
        type: string
      regressive_count:
        minimum: 0
        title: Regressive Count
        type: integer
    required:
    - policy_id
    - assessments
    - effective_count
    - ineffective_count
    - regressive_count
    - inconclusive_count
    - pending_count
    - other_count
    title: FeedbackEffectivenessReport
    type: object
  FeedbackLifecycleEvent:
    additionalProperties: false
    properties:
      cycle:
        $ref: '#/$defs/CycleRef'
      event_id:
        maxLength: 256
        minLength: 1
        title: Event Id
        type: string
      event_time:
        format: date-time
        title: Event Time
        type: string
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      feedback_id:
        maxLength: 192
        minLength: 1
        title: Feedback Id
        type: string
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      state:
        $ref: '#/$defs/FeedbackLifecycleState'
    required:
    - event_id
    - feedback_id
    - state
    - cycle
    - event_time
    title: FeedbackLifecycleEvent
    type: object
  FeedbackLifecycleLedger:
    additionalProperties: false
    properties:
      events:
        items:
          $ref: '#/$defs/FeedbackLifecycleEvent'
        title: Events
        type: array
      ledger_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Ledger Sha256
        type: string
      previous_ledger_sha256:
        anyOf:
        - pattern: ^[0-9a-f]{64}$
          type: string
        - type: 'null'
        default: null
        title: Previous Ledger Sha256
    required:
    - events
    - ledger_sha256
    title: FeedbackLifecycleLedger
    type: object
  FeedbackLifecycleState:
    enum:
    - PROPOSED
    - VALIDATED
    - AUTHORIZED
    - ACTIVATED
    - OUTCOME_NOT_MATURED
    - EVALUATED
    - EFFECTIVE
    - INEFFECTIVE
    - REGRESSIVE
    - INCONCLUSIVE
    - EXPIRED
    - REVERTED
    - NOT_ACTIVATED
    - INVALID
    title: FeedbackLifecycleState
    type: string
  FeedbackRegressionPanel:
    additionalProperties: false
    properties:
      records:
        items:
          $ref: '#/$defs/FeedbackRegressionRecord'
        title: Records
        type: array
    required:
    - records
    title: FeedbackRegressionPanel
    type: object
  FeedbackRegressionRecord:
    additionalProperties: false
    properties:
      adverse_change:
        minimum: 0.0
        title: Adverse Change
        type: number
      critical:
        title: Critical
        type: boolean
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      feedback_id:
        maxLength: 192
        minLength: 1
        title: Feedback Id
        type: string
      guardrail_id:
        maxLength: 256
        minLength: 1
        title: Guardrail Id
        type: string
    required:
    - feedback_id
    - guardrail_id
    - adverse_change
    - critical
    title: FeedbackRegressionRecord
    type: object
additionalProperties: false
properties:
  lifecycle_ledger:
    $ref: '#/$defs/FeedbackLifecycleLedger'
  regression_panel:
    $ref: '#/$defs/FeedbackRegressionPanel'
  report:
    $ref: '#/$defs/FeedbackEffectivenessReport'
required:
- report
- lifecycle_ledger
- regression_panel
title: FeedbackEffectivenessModuleOutput
type: object
$schema: https://json-schema.org/draft/2020-12/schema
