$defs:
  ArtifactReference:
    additionalProperties: false
    properties:
      artifact_id:
        maxLength: 160
        minLength: 1
        title: Artifact Id
        type: string
      artifact_role:
        maxLength: 256
        minLength: 1
        title: Artifact Role
        type: string
      available_at:
        format: date-time
        title: Available At
        type: string
      cycle:
        $ref: '#/$defs/CycleRef'
      location:
        maxLength: 256
        minLength: 1
        title: Location
        type: string
      payload_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Payload Sha256
        type: string
      producer_module_id:
        maxLength: 256
        minLength: 1
        title: Producer Module Id
        type: string
      run_id:
        maxLength: 256
        minLength: 1
        title: Run Id
        type: string
      schema_name:
        maxLength: 256
        minLength: 1
        title: Schema Name
        type: string
      schema_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Schema Sha256
        type: string
      schema_version:
        maxLength: 256
        minLength: 1
        title: Schema Version
        type: string
    required:
    - artifact_id
    - artifact_role
    - schema_name
    - schema_version
    - schema_sha256
    - payload_sha256
    - producer_module_id
    - run_id
    - cycle
    - available_at
    - location
    title: ArtifactReference
    type: object
  CycleRef:
    additionalProperties: false
    properties:
      cycle_id:
        maxLength: 256
        minLength: 1
        title: Cycle Id
        type: string
      ordinal:
        minimum: 0
        title: Ordinal
        type: integer
    required:
    - cycle_id
    - ordinal
    title: CycleRef
    type: object
  EvidenceQuality:
    enum:
    - FACTUAL_EXECUTED
    - FACTUAL_OBSERVED
    - OBSERVABLE_COUNTERFACTUAL
    - MODEL_BASED_COUNTERFACTUAL
    - CENSORED
    - UNAVAILABLE
    title: EvidenceQuality
    type: string
  EvidenceReference:
    additionalProperties: false
    properties:
      artifact_ref:
        $ref: '#/$defs/ArtifactReference'
      evidence_id:
        maxLength: 256
        minLength: 1
        title: Evidence Id
        type: string
      quality:
        $ref: '#/$defs/EvidenceQuality'
      summary:
        maxLength: 4000
        minLength: 1
        title: Summary
        type: string
    required:
    - evidence_id
    - artifact_ref
    - quality
    - summary
    title: EvidenceReference
    type: object
  FeedbackLifecycleEvent:
    additionalProperties: false
    properties:
      cycle:
        $ref: '#/$defs/CycleRef'
      event_id:
        maxLength: 256
        minLength: 1
        title: Event Id
        type: string
      event_time:
        format: date-time
        title: Event Time
        type: string
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      feedback_id:
        maxLength: 192
        minLength: 1
        title: Feedback Id
        type: string
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      state:
        $ref: '#/$defs/FeedbackLifecycleState'
    required:
    - event_id
    - feedback_id
    - state
    - cycle
    - event_time
    title: FeedbackLifecycleEvent
    type: object
  FeedbackLifecycleState:
    enum:
    - PROPOSED
    - VALIDATED
    - AUTHORIZED
    - ACTIVATED
    - OUTCOME_NOT_MATURED
    - EVALUATED
    - EFFECTIVE
    - INEFFECTIVE
    - REGRESSIVE
    - INCONCLUSIVE
    - EXPIRED
    - REVERTED
    - NOT_ACTIVATED
    - INVALID
    title: FeedbackLifecycleState
    type: string
additionalProperties: false
properties:
  events:
    items:
      $ref: '#/$defs/FeedbackLifecycleEvent'
    title: Events
    type: array
  ledger_sha256:
    pattern: ^[0-9a-f]{64}$
    title: Ledger Sha256
    type: string
  previous_ledger_sha256:
    anyOf:
    - pattern: ^[0-9a-f]{64}$
      type: string
    - type: 'null'
    default: null
    title: Previous Ledger Sha256
required:
- events
- ledger_sha256
title: FeedbackLifecycleLedger
type: object
$schema: https://json-schema.org/draft/2020-12/schema
