$defs:
  ArtifactReference:
    additionalProperties: false
    properties:
      artifact_id:
        maxLength: 160
        minLength: 1
        title: Artifact Id
        type: string
      artifact_role:
        maxLength: 256
        minLength: 1
        title: Artifact Role
        type: string
      available_at:
        format: date-time
        title: Available At
        type: string
      cycle:
        $ref: '#/$defs/CycleRef'
      location:
        maxLength: 256
        minLength: 1
        title: Location
        type: string
      payload_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Payload Sha256
        type: string
      producer_module_id:
        maxLength: 256
        minLength: 1
        title: Producer Module Id
        type: string
      run_id:
        maxLength: 256
        minLength: 1
        title: Run Id
        type: string
      schema_name:
        maxLength: 256
        minLength: 1
        title: Schema Name
        type: string
      schema_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Schema Sha256
        type: string
      schema_version:
        maxLength: 256
        minLength: 1
        title: Schema Version
        type: string
    required:
    - artifact_id
    - artifact_role
    - schema_name
    - schema_version
    - schema_sha256
    - payload_sha256
    - producer_module_id
    - run_id
    - cycle
    - available_at
    - location
    title: ArtifactReference
    type: object
  CategoricalChangeBounds:
    additionalProperties: false
    properties:
      allowed_values:
        items:
          maxLength: 256
          minLength: 1
          type: string
        title: Allowed Values
        type: array
      parameter_name:
        maxLength: 256
        minLength: 1
        title: Parameter Name
        type: string
    required:
    - parameter_name
    - allowed_values
    title: CategoricalChangeBounds
    type: object
  CycleRef:
    additionalProperties: false
    properties:
      cycle_id:
        maxLength: 256
        minLength: 1
        title: Cycle Id
        type: string
      ordinal:
        minimum: 0
        title: Ordinal
        type: integer
    required:
    - cycle_id
    - ordinal
    title: CycleRef
    type: object
  EvidenceQuality:
    enum:
    - FACTUAL_EXECUTED
    - FACTUAL_OBSERVED
    - OBSERVABLE_COUNTERFACTUAL
    - MODEL_BASED_COUNTERFACTUAL
    - CENSORED
    - UNAVAILABLE
    title: EvidenceQuality
    type: string
  EvidenceReference:
    additionalProperties: false
    properties:
      artifact_ref:
        $ref: '#/$defs/ArtifactReference'
      evidence_id:
        maxLength: 256
        minLength: 1
        title: Evidence Id
        type: string
      quality:
        $ref: '#/$defs/EvidenceQuality'
      summary:
        maxLength: 4000
        minLength: 1
        title: Summary
        type: string
    required:
    - evidence_id
    - artifact_ref
    - quality
    - summary
    title: EvidenceReference
    type: object
  FeedbackActivationRecord:
    additionalProperties: false
    properties:
      activated:
        title: Activated
        type: boolean
      activated_at:
        anyOf:
        - format: date-time
          type: string
        - type: 'null'
        default: null
        title: Activated At
      exact_policy_diff:
        items:
          $ref: '#/$defs/PolicyChange'
        title: Exact Policy Diff
        type: array
      feedback_id:
        maxLength: 192
        minLength: 1
        title: Feedback Id
        type: string
      policy_after_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Policy After Sha256
        type: string
      policy_before_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Policy Before Sha256
        type: string
      reverted:
        default: false
        title: Reverted
        type: boolean
      simultaneous_feedback_ids:
        default: []
        items:
          maxLength: 192
          minLength: 1
          type: string
        title: Simultaneous Feedback Ids
        type: array
      target_cycle:
        $ref: '#/$defs/CycleRef'
      target_metric_id:
        maxLength: 256
        minLength: 1
        title: Target Metric Id
        type: string
      target_phase:
        maxLength: 256
        minLength: 1
        title: Target Phase
        type: string
      target_policy_id:
        maxLength: 256
        minLength: 1
        title: Target Policy Id
        type: string
      target_policy_version_after:
        maxLength: 256
        minLength: 1
        title: Target Policy Version After
        type: string
      target_policy_version_before:
        maxLength: 256
        minLength: 1
        title: Target Policy Version Before
        type: string
    required:
    - feedback_id
    - activated
    - target_cycle
    - target_phase
    - target_policy_id
    - target_metric_id
    - target_policy_version_before
    - target_policy_version_after
    - policy_before_sha256
    - policy_after_sha256
    - exact_policy_diff
    title: FeedbackActivationRecord
    type: object
  FeedbackAuthorizationRecord:
    additionalProperties: false
    properties:
      authorization_id:
        maxLength: 256
        minLength: 1
        title: Authorization Id
        type: string
      authorized:
        title: Authorized
        type: boolean
      authorized_at:
        format: date-time
        title: Authorized At
        type: string
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      feedback_id:
        maxLength: 192
        minLength: 1
        title: Feedback Id
        type: string
    required:
    - feedback_id
    - authorization_id
    - authorized
    - authorized_at
    title: FeedbackAuthorizationRecord
    type: object
  FeedbackEffectType:
    enum:
    - RESEARCH_REQUEST
    - POLICY_BOUND_CHANGE
    - ELIGIBILITY_REVIEW
    - CALIBRATION_REVIEW
    - CAPABILITY_REQUIREMENT
    - DEPRECATION_CANDIDATE
    title: FeedbackEffectType
    type: string
  FeedbackEvaluationPolicy:
    additionalProperties: false
    properties:
      metrics:
        items:
          $ref: '#/$defs/MetricEvaluationPolicy'
        title: Metrics
        type: array
      policy_id:
        maxLength: 256
        minLength: 1
        title: Policy Id
        type: string
      reject_unisolated_interventions:
        default: true
        title: Reject Unisolated Interventions
        type: boolean
    required:
    - policy_id
    - metrics
    title: FeedbackEvaluationPolicy
    type: object
  FeedbackLifecycleEvent:
    additionalProperties: false
    properties:
      cycle:
        $ref: '#/$defs/CycleRef'
      event_id:
        maxLength: 256
        minLength: 1
        title: Event Id
        type: string
      event_time:
        format: date-time
        title: Event Time
        type: string
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      feedback_id:
        maxLength: 192
        minLength: 1
        title: Feedback Id
        type: string
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      state:
        $ref: '#/$defs/FeedbackLifecycleState'
    required:
    - event_id
    - feedback_id
    - state
    - cycle
    - event_time
    title: FeedbackLifecycleEvent
    type: object
  FeedbackLifecycleLedger:
    additionalProperties: false
    properties:
      events:
        items:
          $ref: '#/$defs/FeedbackLifecycleEvent'
        title: Events
        type: array
      ledger_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Ledger Sha256
        type: string
      previous_ledger_sha256:
        anyOf:
        - pattern: ^[0-9a-f]{64}$
          type: string
        - type: 'null'
        default: null
        title: Previous Ledger Sha256
    required:
    - events
    - ledger_sha256
    title: FeedbackLifecycleLedger
    type: object
  FeedbackLifecycleState:
    enum:
    - PROPOSED
    - VALIDATED
    - AUTHORIZED
    - ACTIVATED
    - OUTCOME_NOT_MATURED
    - EVALUATED
    - EFFECTIVE
    - INEFFECTIVE
    - REGRESSIVE
    - INCONCLUSIVE
    - EXPIRED
    - REVERTED
    - NOT_ACTIVATED
    - INVALID
    title: FeedbackLifecycleState
    type: string
  FeedbackOutcomePair:
    additionalProperties: false
    properties:
      baseline_value:
        title: Baseline Value
        type: number
      cohort_id:
        maxLength: 256
        minLength: 1
        title: Cohort Id
        type: string
      comparable:
        default: true
        title: Comparable
        type: boolean
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      feedback_id:
        maxLength: 192
        minLength: 1
        title: Feedback Id
        type: string
      intervention_value:
        title: Intervention Value
        type: number
      maturity:
        $ref: '#/$defs/OutcomeMaturity'
      metric_id:
        maxLength: 256
        minLength: 1
        title: Metric Id
        type: string
      pair_id:
        maxLength: 256
        minLength: 1
        title: Pair Id
        type: string
    required:
    - feedback_id
    - pair_id
    - metric_id
    - cohort_id
    - baseline_value
    - intervention_value
    - maturity
    title: FeedbackOutcomePair
    type: object
  FeedbackValidationDecision:
    additionalProperties: false
    properties:
      feedback_id:
        maxLength: 256
        minLength: 1
        title: Feedback Id
        type: string
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      requires_p0_authorization:
        title: Requires P0 Authorization
        type: boolean
      state:
        $ref: '#/$defs/FeedbackValidationState'
    required:
    - feedback_id
    - state
    - requires_p0_authorization
    title: FeedbackValidationDecision
    type: object
  FeedbackValidationState:
    enum:
    - VALIDATED_PENDING_P0
    - VALIDATED_FOR_FUTURE_CYCLE
    - NO_FEEDBACK_TO_ACTIVATE
    - REJECTED_SAME_CYCLE
    - REJECTED_SCHEMA_INCOMPATIBLE
    - REJECTED_TARGET_MISSING
    - REJECTED_DUPLICATE
    - REJECTED_EXPIRED
    - RESERVED_CAPABILITY_UNAVAILABLE
    title: FeedbackValidationState
    type: string
  GuardrailObservation:
    additionalProperties: false
    properties:
      baseline_value:
        title: Baseline Value
        type: number
      critical:
        default: false
        title: Critical
        type: boolean
      direction:
        $ref: '#/$defs/MetricDirection'
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      feedback_id:
        maxLength: 192
        minLength: 1
        title: Feedback Id
        type: string
      guardrail_id:
        maxLength: 256
        minLength: 1
        title: Guardrail Id
        type: string
      intervention_value:
        title: Intervention Value
        type: number
      maximum_allowed_regression:
        minimum: 0.0
        title: Maximum Allowed Regression
        type: number
    required:
    - feedback_id
    - guardrail_id
    - direction
    - baseline_value
    - intervention_value
    - maximum_allowed_regression
    title: GuardrailObservation
    type: object
  MetricDirection:
    enum:
    - MAXIMIZE
    - MINIMIZE
    title: MetricDirection
    type: string
  MetricEvaluationPolicy:
    additionalProperties: false
    properties:
      confidence_level:
        default: 0.95
        exclusiveMaximum: 1.0
        exclusiveMinimum: 0.5
        title: Confidence Level
        type: number
      direction:
        $ref: '#/$defs/MetricDirection'
      metric_id:
        maxLength: 256
        minLength: 1
        title: Metric Id
        type: string
      minimum_material_effect:
        minimum: 0.0
        title: Minimum Material Effect
        type: number
      minimum_observations:
        default: 5
        minimum: 2
        title: Minimum Observations
        type: integer
    required:
    - metric_id
    - direction
    - minimum_material_effect
    title: MetricEvaluationPolicy
    type: object
  NumericChangeBounds:
    additionalProperties: false
    properties:
      maximum:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Maximum
      maximum_absolute_delta:
        anyOf:
        - minimum: 0.0
          type: number
        - type: 'null'
        default: null
        title: Maximum Absolute Delta
      minimum:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Minimum
      parameter_name:
        maxLength: 256
        minLength: 1
        title: Parameter Name
        type: string
    required:
    - parameter_name
    title: NumericChangeBounds
    type: object
  OutcomeMaturity:
    enum:
    - NOT_MATURED
    - PARTIALLY_MATURED
    - MATURED
    - SETTLED
    - CENSORED
    - UNOBSERVABLE
    title: OutcomeMaturity
    type: string
  P9P5ForecastFeedback:
    additionalProperties: false
    properties:
      atomic_group_id:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Atomic Group Id
      categorical_change_bounds:
        default: []
        items:
          $ref: '#/$defs/CategoricalChangeBounds'
        title: Categorical Change Bounds
        type: array
      confidence:
        maximum: 1.0
        minimum: 0.0
        title: Confidence
        type: number
      economic_materiality:
        minimum: 0.0
        title: Economic Materiality
        type: number
      effect_type:
        $ref: '#/$defs/FeedbackEffectType'
      evidence_refs:
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      expires_after_cycle:
        $ref: '#/$defs/CycleRef'
      feedback_id:
        maxLength: 256
        minLength: 1
        title: Feedback Id
        type: string
      feedback_type:
        maxLength: 256
        minLength: 1
        title: Feedback Type
        type: string
      numeric_change_bounds:
        default: []
        items:
          $ref: '#/$defs/NumericChangeBounds'
        title: Numeric Change Bounds
        type: array
      promotion_dependency:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Promotion Dependency
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      source_cycle:
        $ref: '#/$defs/CycleRef'
      supersedes_feedback_id:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Supersedes Feedback Id
      target_cycle:
        $ref: '#/$defs/CycleRef'
      target_phase:
        const: P5
        default: P5
        title: Target Phase
        type: string
      target_policy_id:
        maxLength: 160
        minLength: 1
        title: Target Policy Id
        type: string
      target_policy_version:
        maxLength: 256
        minLength: 1
        title: Target Policy Version
        type: string
    required:
    - feedback_id
    - source_cycle
    - target_cycle
    - target_policy_id
    - target_policy_version
    - feedback_type
    - effect_type
    - evidence_refs
    - confidence
    - economic_materiality
    - expires_after_cycle
    title: P9P5ForecastFeedback
    type: object
  P9P6SynthesisFeedback:
    additionalProperties: false
    properties:
      atomic_group_id:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Atomic Group Id
      categorical_change_bounds:
        default: []
        items:
          $ref: '#/$defs/CategoricalChangeBounds'
        title: Categorical Change Bounds
        type: array
      confidence:
        maximum: 1.0
        minimum: 0.0
        title: Confidence
        type: number
      economic_materiality:
        minimum: 0.0
        title: Economic Materiality
        type: number
      effect_type:
        $ref: '#/$defs/FeedbackEffectType'
      evidence_refs:
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      expires_after_cycle:
        $ref: '#/$defs/CycleRef'
      feedback_id:
        maxLength: 256
        minLength: 1
        title: Feedback Id
        type: string
      feedback_type:
        maxLength: 256
        minLength: 1
        title: Feedback Type
        type: string
      numeric_change_bounds:
        default: []
        items:
          $ref: '#/$defs/NumericChangeBounds'
        title: Numeric Change Bounds
        type: array
      promotion_dependency:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Promotion Dependency
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      source_cycle:
        $ref: '#/$defs/CycleRef'
      supersedes_feedback_id:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Supersedes Feedback Id
      target_cycle:
        $ref: '#/$defs/CycleRef'
      target_phase:
        const: P6
        default: P6
        title: Target Phase
        type: string
      target_policy_id:
        maxLength: 160
        minLength: 1
        title: Target Policy Id
        type: string
      target_policy_version:
        maxLength: 256
        minLength: 1
        title: Target Policy Version
        type: string
    required:
    - feedback_id
    - source_cycle
    - target_cycle
    - target_policy_id
    - target_policy_version
    - feedback_type
    - effect_type
    - evidence_refs
    - confidence
    - economic_materiality
    - expires_after_cycle
    title: P9P6SynthesisFeedback
    type: object
  P9P7RankingFeedback:
    additionalProperties: false
    properties:
      atomic_group_id:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Atomic Group Id
      categorical_change_bounds:
        default: []
        items:
          $ref: '#/$defs/CategoricalChangeBounds'
        title: Categorical Change Bounds
        type: array
      confidence:
        maximum: 1.0
        minimum: 0.0
        title: Confidence
        type: number
      economic_materiality:
        minimum: 0.0
        title: Economic Materiality
        type: number
      effect_type:
        $ref: '#/$defs/FeedbackEffectType'
      evidence_refs:
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      expires_after_cycle:
        $ref: '#/$defs/CycleRef'
      feedback_id:
        maxLength: 256
        minLength: 1
        title: Feedback Id
        type: string
      feedback_type:
        maxLength: 256
        minLength: 1
        title: Feedback Type
        type: string
      numeric_change_bounds:
        default: []
        items:
          $ref: '#/$defs/NumericChangeBounds'
        title: Numeric Change Bounds
        type: array
      promotion_dependency:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Promotion Dependency
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      source_cycle:
        $ref: '#/$defs/CycleRef'
      supersedes_feedback_id:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Supersedes Feedback Id
      target_cycle:
        $ref: '#/$defs/CycleRef'
      target_phase:
        const: P7
        default: P7
        title: Target Phase
        type: string
      target_policy_id:
        maxLength: 160
        minLength: 1
        title: Target Policy Id
        type: string
      target_policy_version:
        maxLength: 256
        minLength: 1
        title: Target Policy Version
        type: string
    required:
    - feedback_id
    - source_cycle
    - target_cycle
    - target_policy_id
    - target_policy_version
    - feedback_type
    - effect_type
    - evidence_refs
    - confidence
    - economic_materiality
    - expires_after_cycle
    title: P9P7RankingFeedback
    type: object
  P9P8PortfolioExecutionFeedback:
    additionalProperties: false
    properties:
      atomic_group_id:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Atomic Group Id
      categorical_change_bounds:
        default: []
        items:
          $ref: '#/$defs/CategoricalChangeBounds'
        title: Categorical Change Bounds
        type: array
      confidence:
        maximum: 1.0
        minimum: 0.0
        title: Confidence
        type: number
      economic_materiality:
        minimum: 0.0
        title: Economic Materiality
        type: number
      effect_type:
        $ref: '#/$defs/FeedbackEffectType'
      evidence_refs:
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      expires_after_cycle:
        $ref: '#/$defs/CycleRef'
      feedback_id:
        maxLength: 256
        minLength: 1
        title: Feedback Id
        type: string
      feedback_type:
        maxLength: 256
        minLength: 1
        title: Feedback Type
        type: string
      numeric_change_bounds:
        default: []
        items:
          $ref: '#/$defs/NumericChangeBounds'
        title: Numeric Change Bounds
        type: array
      promotion_dependency:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Promotion Dependency
      reason_codes:
        default: []
        items:
          pattern: ^P9_[A-Z0-9_]+$
          type: string
        title: Reason Codes
        type: array
      source_cycle:
        $ref: '#/$defs/CycleRef'
      supersedes_feedback_id:
        anyOf:
        - maxLength: 256
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Supersedes Feedback Id
      target_cycle:
        $ref: '#/$defs/CycleRef'
      target_phase:
        const: P8
        default: P8
        title: Target Phase
        type: string
      target_policy_id:
        maxLength: 160
        minLength: 1
        title: Target Policy Id
        type: string
      target_policy_version:
        maxLength: 256
        minLength: 1
        title: Target Policy Version
        type: string
    required:
    - feedback_id
    - source_cycle
    - target_cycle
    - target_policy_id
    - target_policy_version
    - feedback_type
    - effect_type
    - evidence_refs
    - confidence
    - economic_materiality
    - expires_after_cycle
    title: P9P8PortfolioExecutionFeedback
    type: object
  PolicyChange:
    additionalProperties: false
    properties:
      after_value:
        maxLength: 256
        minLength: 1
        title: After Value
        type: string
      before_value:
        maxLength: 256
        minLength: 1
        title: Before Value
        type: string
      parameter_name:
        maxLength: 256
        minLength: 1
        title: Parameter Name
        type: string
    required:
    - parameter_name
    - before_value
    - after_value
    title: PolicyChange
    type: object
  ValidatedNextCycleFeedbackManifest:
    additionalProperties: false
    properties:
      accepted:
        items:
          anyOf:
          - $ref: '#/$defs/P9P5ForecastFeedback'
          - $ref: '#/$defs/P9P6SynthesisFeedback'
          - $ref: '#/$defs/P9P7RankingFeedback'
          - $ref: '#/$defs/P9P8PortfolioExecutionFeedback'
        title: Accepted
        type: array
      decisions:
        items:
          $ref: '#/$defs/FeedbackValidationDecision'
        title: Decisions
        type: array
      rejected:
        items:
