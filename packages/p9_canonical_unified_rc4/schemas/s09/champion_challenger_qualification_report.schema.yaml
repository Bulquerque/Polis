$defs:
  ArtifactReference:
    additionalProperties: false
    properties:
      artifact_id:
        maxLength: 160
        minLength: 1
        title: Artifact Id
        type: string
      artifact_role:
        maxLength: 256
        minLength: 1
        title: Artifact Role
        type: string
      available_at:
        format: date-time
        title: Available At
        type: string
      cycle:
        $ref: '#/$defs/CycleRef'
      location:
        maxLength: 256
        minLength: 1
        title: Location
        type: string
      payload_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Payload Sha256
        type: string
      producer_module_id:
        maxLength: 256
        minLength: 1
        title: Producer Module Id
        type: string
      run_id:
        maxLength: 256
        minLength: 1
        title: Run Id
        type: string
      schema_name:
        maxLength: 256
        minLength: 1
        title: Schema Name
        type: string
      schema_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Schema Sha256
        type: string
      schema_version:
        maxLength: 256
        minLength: 1
        title: Schema Version
        type: string
    required:
    - artifact_id
    - artifact_role
    - schema_name
    - schema_version
    - schema_sha256
    - payload_sha256
    - producer_module_id
    - run_id
    - cycle
    - available_at
    - location
    title: ArtifactReference
    type: object
  ChallengerQualification:
    additionalProperties: false
    properties:
      blocking_reasons:
        default: []
        items:
          maxLength: 256
          minLength: 1
          type: string
        title: Blocking Reasons
        type: array
      challenger_configuration_id:
        maxLength: 128
        minLength: 1
        title: Challenger Configuration Id
        type: string
      contamination_state:
        $ref: '#/$defs/ContaminationState'
      effect_size:
        anyOf:
        - type: number
        - type: 'null'
        title: Effect Size
      evidence_refs:
        default: []
        items:
          $ref: '#/$defs/EvidenceReference'
        title: Evidence Refs
        type: array
      limitations:
        default: []
        items:
          maxLength: 256
          minLength: 1
          type: string
        title: Limitations
        type: array
      probability_of_superiority:
        anyOf:
        - type: number
        - type: 'null'
        title: Probability Of Superiority
      state:
        $ref: '#/$defs/ChallengerQualificationState'
    required:
    - challenger_configuration_id
    - state
    - effect_size
    - probability_of_superiority
    - contamination_state
    title: ChallengerQualification
    type: object
  ChallengerQualificationState:
    enum:
    - CHALLENGER_QUALIFIED
    - CHALLENGER_QUALIFIED_LIMITED_CAPITAL
    - CHALLENGER_SHADOW_ONLY
    - RETAIN_CHAMPION
    - STATISTICALLY_INDISTINGUISHABLE
    - QUARANTINE_CHALLENGER
    - INSUFFICIENT_EVIDENCE
    - COMPARISON_INVALID
    title: ChallengerQualificationState
    type: string
  ContaminationState:
    enum:
    - CLEAN
    - LIMITED_USE
    - CONTAMINATED
    - UNKNOWN
    title: ContaminationState
    type: string
  CycleRef:
    additionalProperties: false
    properties:
      cycle_id:
        maxLength: 256
        minLength: 1
        title: Cycle Id
        type: string
      ordinal:
        minimum: 0
        title: Ordinal
        type: integer
    required:
    - cycle_id
    - ordinal
    title: CycleRef
    type: object
  EvidenceQuality:
    enum:
    - FACTUAL_EXECUTED
    - FACTUAL_OBSERVED
    - OBSERVABLE_COUNTERFACTUAL
    - MODEL_BASED_COUNTERFACTUAL
    - CENSORED
    - UNAVAILABLE
    title: EvidenceQuality
    type: string
  EvidenceReference:
    additionalProperties: false
    properties:
      artifact_ref:
        $ref: '#/$defs/ArtifactReference'
      evidence_id:
        maxLength: 256
        minLength: 1
        title: Evidence Id
        type: string
      quality:
        $ref: '#/$defs/EvidenceQuality'
      summary:
        maxLength: 4000
        minLength: 1
        title: Summary
        type: string
    required:
    - evidence_id
    - artifact_ref
    - quality
    - summary
    title: EvidenceReference
    type: object
additionalProperties: false
properties:
  champion_configuration_id:
    maxLength: 128
    minLength: 1
    title: Champion Configuration Id
    type: string
  cohort_id:
    maxLength: 256
    minLength: 1
    title: Cohort Id
    type: string
  qualifications:
    items:
      $ref: '#/$defs/ChallengerQualification'
    title: Qualifications
    type: array
  recommended_challenger_id:
    anyOf:
    - maxLength: 128
      minLength: 1
      type: string
    - type: 'null'
    title: Recommended Challenger Id
  report_state:
    $ref: '#/$defs/ChallengerQualificationState'
  warnings:
    default: []
    items:
      maxLength: 256
      minLength: 1
      type: string
    title: Warnings
    type: array
required:
- champion_configuration_id
- cohort_id
- qualifications
- recommended_challenger_id
- report_state
title: ChampionChallengerQualificationReport
type: object
$schema: https://json-schema.org/draft/2020-12/schema
