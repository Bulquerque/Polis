$defs:
  MaturityState:
    enum:
    - NOT_MATURED
    - PARTIALLY_MATURED
    - MATURED
    - SETTLED
    - CENSORED
    - UNOBSERVABLE
    title: MaturityState
    type: string
additionalProperties: false
properties:
  prediction_event_id:
    minLength: 1
    title: Prediction Event Id
    type: string
  issued_at:
    format: date-time
    title: Issued At
    type: string
  maturity_state:
    $ref: '#/$defs/MaturityState'
  latest_outcome_available_at:
    anyOf:
    - format: date-time
      type: string
    - type: 'null'
    default: null
    title: Latest Outcome Available At
required:
- prediction_event_id
- issued_at
- maturity_state
title: MaturityQueueItem
type: object
$id: urn:inferencia:p9:s7:MaturityQueueItem:1.0.0
