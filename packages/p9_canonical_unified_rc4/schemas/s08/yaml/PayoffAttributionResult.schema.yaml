$defs:
  AttributionQuality:
    enum:
    - QUALIFIED
    - LIMITED
    - INSUFFICIENT_EVIDENCE
    - NOT_IDENTIFIABLE
    - INVALID
    title: AttributionQuality
    type: string
  EstimateAccuracyItem:
    additionalProperties: false
    properties:
      candidate_id:
        minLength: 1
        title: Candidate Id
        type: string
      price_error:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Price Error
      cost_error:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Cost Error
      liquidity_error:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Liquidity Error
      risk_error:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Risk Error
      maximum_loss_proof_valid:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        title: Maximum Loss Proof Valid
      evidence_class:
        $ref: '#/$defs/EvidenceClass'
    required:
    - candidate_id
    - evidence_class
    title: EstimateAccuracyItem
    type: object
  EvidenceClass:
    enum:
    - FACTUAL_EXECUTED
    - FACTUAL_OBSERVED_NOT_EXECUTED
    - OBSERVABLE_COUNTERFACTUAL
    - MODEL_BASED_COUNTERFACTUAL
    - CENSORED
    - UNAVAILABLE
    title: EvidenceClass
    type: string
  PayoffFidelityItem:
    additionalProperties: false
    properties:
      candidate_id:
        minLength: 1
        title: Candidate Id
        type: string
      scenario_count:
        minimum: 0
        title: Scenario Count
        type: integer
      weighted_mae:
        anyOf:
        - type: number
        - type: 'null'
        title: Weighted Mae
      weighted_rmse:
        anyOf:
        - type: number
        - type: 'null'
        title: Weighted Rmse
      quality:
        $ref: '#/$defs/AttributionQuality'
      reason_codes:
        default: []
        items:
          minLength: 1
          type: string
        title: Reason Codes
        type: array
    required:
    - candidate_id
    - scenario_count
    - weighted_mae
    - weighted_rmse
    - quality
    title: PayoffFidelityItem
    type: object
additionalProperties: false
properties:
  fidelity:
    items:
      $ref: '#/$defs/PayoffFidelityItem'
    title: Fidelity
    type: array
  estimates:
    items:
      $ref: '#/$defs/EstimateAccuracyItem'
    title: Estimates
    type: array
  candidate_count:
    minimum: 0
    title: Candidate Count
    type: integer
  observable_candidate_count:
    minimum: 0
    title: Observable Candidate Count
    type: integer
  coverage_ratio:
    maximum: 1.0
    minimum: 0.0
    title: Coverage Ratio
    type: number
  selected_candidate_id:
    anyOf:
    - minLength: 1
      type: string
    - type: 'null'
    title: Selected Candidate Id
  best_observable_candidate_id:
    anyOf:
    - minLength: 1
      type: string
    - type: 'null'
    title: Best Observable Candidate Id
  synthesis_regret:
    anyOf:
    - type: number
    - type: 'null'
    title: Synthesis Regret
  aggregate_pnl_effect:
    anyOf:
    - type: number
    - type: 'null'
    title: Aggregate Pnl Effect
  quality:
    $ref: '#/$defs/AttributionQuality'
  reason_codes:
    items:
      minLength: 1
      type: string
    title: Reason Codes
    type: array
  result_sha256:
    pattern: ^[0-9a-f]{64}$
    title: Result Sha256
    type: string
required:
- fidelity
- estimates
- candidate_count
- observable_candidate_count
- coverage_ratio
- selected_candidate_id
- best_observable_candidate_id
- synthesis_regret
- aggregate_pnl_effect
- quality
- reason_codes
- result_sha256
title: PayoffAttributionResult
type: object
$id: urn:inferencia:p9:s8:PayoffAttributionResult:1.0.0
