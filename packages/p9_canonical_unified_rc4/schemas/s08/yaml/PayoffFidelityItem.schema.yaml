$defs:
  AttributionQuality:
    enum:
    - QUALIFIED
    - LIMITED
    - INSUFFICIENT_EVIDENCE
    - NOT_IDENTIFIABLE
    - INVALID
    title: AttributionQuality
    type: string
additionalProperties: false
properties:
  candidate_id:
    minLength: 1
    title: Candidate Id
    type: string
  scenario_count:
    minimum: 0
    title: Scenario Count
    type: integer
  weighted_mae:
    anyOf:
    - type: number
    - type: 'null'
    title: Weighted Mae
  weighted_rmse:
    anyOf:
    - type: number
    - type: 'null'
    title: Weighted Rmse
  quality:
    $ref: '#/$defs/AttributionQuality'
  reason_codes:
    default: []
    items:
      minLength: 1
      type: string
    title: Reason Codes
    type: array
required:
- candidate_id
- scenario_count
- weighted_mae
- weighted_rmse
- quality
title: PayoffFidelityItem
type: object
$id: urn:inferencia:p9:s8:PayoffFidelityItem:1.0.0
