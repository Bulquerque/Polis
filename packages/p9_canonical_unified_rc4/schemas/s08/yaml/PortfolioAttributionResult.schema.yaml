$defs:
  AttributionQuality:
    enum:
    - QUALIFIED
    - LIMITED
    - INSUFFICIENT_EVIDENCE
    - NOT_IDENTIFIABLE
    - INVALID
    title: AttributionQuality
    type: string
  CandidateAllocationEffect:
    additionalProperties: false
    properties:
      candidate_id:
        minLength: 1
        title: Candidate Id
        type: string
      selection_effect:
        title: Selection Effect
        type: number
      sizing_effect:
        title: Sizing Effect
        type: number
      constraint_effect:
        title: Constraint Effect
        type: number
      discretization_effect:
        title: Discretization Effect
        type: number
      total_virtual_pnl:
        title: Total Virtual Pnl
        type: number
    required:
    - candidate_id
    - selection_effect
    - sizing_effect
    - constraint_effect
    - discretization_effect
    - total_virtual_pnl
    title: CandidateAllocationEffect
    type: object
additionalProperties: false
properties:
  candidate_effects:
    items:
      $ref: '#/$defs/CandidateAllocationEffect'
    title: Candidate Effects
    type: array
  selection_effect:
    title: Selection Effect
    type: number
  sizing_effect:
    title: Sizing Effect
    type: number
  constraint_effect:
    title: Constraint Effect
    type: number
  discretization_effect:
    title: Discretization Effect
    type: number
  netting_diversification_effect:
    title: Netting Diversification Effect
    type: number
  virtual_pnl:
    title: Virtual Pnl
    type: number
  physical_pnl:
    title: Physical Pnl
    type: number
  dual_book_difference:
    title: Dual Book Difference
    type: number
  aggregate_pnl_effect:
    title: Aggregate Pnl Effect
    type: number
  quality:
    $ref: '#/$defs/AttributionQuality'
  reason_codes:
    items:
      minLength: 1
      type: string
    title: Reason Codes
    type: array
  result_sha256:
    pattern: ^[0-9a-f]{64}$
    title: Result Sha256
    type: string
required:
- candidate_effects
- selection_effect
- sizing_effect
- constraint_effect
- discretization_effect
- netting_diversification_effect
- virtual_pnl
- physical_pnl
- dual_book_difference
- aggregate_pnl_effect
- quality
- reason_codes
- result_sha256
title: PortfolioAttributionResult
type: object
$id: urn:inferencia:p9:s8:PortfolioAttributionResult:1.0.0
