registry_id: p7_eligibility_policy_registry
registry_version: 2.3.0
active_policy_id: p7_defined_risk_baseline
policies:
- policy_id: p7_defined_risk_baseline
  version: 2.3.0
  allowed_objective_families:
  - RANGE
  - DIRECTIONAL_UP
  - DIRECTIONAL_DOWN
  - LONG_VOLATILITY
  - SHORT_VOLATILITY_DEFINED_RISK
  - TAIL_HEDGE
  - INCOME_DEFINED_RISK
  - SKEW_RELATIVE_VALUE
  - TERM_STRUCTURE
  - EVENT
  - PORTFOLIO_HEDGE
  - HYBRID
  - POSITIVE_CONVEXITY
  disabled_strategy_classes: []
  required_sections:
  - candidate
  - legs
  - payoffs
  - scenario_evaluations
  - risk
  - cost_liquidity
  - lineage
  - market_snapshot
  - generation_trace
  required_candidate_paths:
  - candidate.candidate_id
  - candidate.currency
  required_metric_paths_by_objective:
    RANGE: &id001
    - risk.maximum_loss
    - risk.expected_net_payoff
    - risk.expected_shortfall
    - risk.probability_of_profit
    - cost_liquidity.entry_cost
    - cost_liquidity.liquidity_score
    DIRECTIONAL_UP: *id001
    DIRECTIONAL_DOWN: *id001
    LONG_VOLATILITY: *id001
    SHORT_VOLATILITY_DEFINED_RISK: *id001
    TAIL_HEDGE: *id001
    INCOME_DEFINED_RISK: *id001
    SKEW_RELATIVE_VALUE: *id001
    TERM_STRUCTURE: *id001
    EVENT: *id001
    PORTFOLIO_HEDGE: *id001
    HYBRID: *id001
    POSITIVE_CONVEXITY:
    - risk.maximum_loss
    - risk.expected_net_payoff
    - risk.expected_shortfall
    - risk.probability_of_profit
    - cost_liquidity.entry_cost
    - cost_liquidity.liquidity_score
  defined_risk_required: true
  require_maximum_loss_proven: true
  min_scenario_count: 2
  max_snapshot_age_seconds: 3600
  allowed_currencies:
  - USD
  - BRL
  - EUR
  - GBP
  allowed_calendars:
  - XNYS
  - XNAS
  - B3
  - XLON
  representative_only: true
  feedback_mutable_parameters:
  - min_scenario_count
  - max_snapshot_age_seconds
  require_calendar_id: false
