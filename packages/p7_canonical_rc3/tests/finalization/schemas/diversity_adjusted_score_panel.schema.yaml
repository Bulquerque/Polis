$defs:
  DiversityAdjustedScoreRecord:
    additionalProperties: false
    properties:
      cycle_id:
        title: Cycle Id
        type: string
      decision_time:
        format: date-time
        title: Decision Time
        type: string
      comparison_group_id:
        title: Comparison Group Id
        type: string
      candidate_id:
        title: Candidate Id
        type: string
      hybrid_score:
        anyOf:
        - type: number
        - type: 'null'
        title: Hybrid Score
      diversity_penalty:
        minimum: 0
        title: Diversity Penalty
        type: number
      diversity_adjusted_score:
        anyOf:
        - type: number
        - type: 'null'
        title: Diversity Adjusted Score
      score_confidence:
        maximum: 1
        minimum: 0
        title: Score Confidence
        type: number
      score_status:
        title: Score Status
        type: string
      policy_version:
        title: Policy Version
        type: string
      lineage_id:
        title: Lineage Id
        type: string
    required:
    - cycle_id
    - decision_time
    - comparison_group_id
    - candidate_id
    - hybrid_score
    - diversity_penalty
    - diversity_adjusted_score
    - score_confidence
    - score_status
    - policy_version
    - lineage_id
    title: DiversityAdjustedScoreRecord
    type: object
