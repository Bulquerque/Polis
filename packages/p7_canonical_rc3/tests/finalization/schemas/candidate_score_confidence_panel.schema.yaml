$defs:
  ConfidenceRecord:
    additionalProperties: false
    properties:
      cycle_id:
        title: Cycle Id
        type: string
      decision_time:
        format: date-time
        title: Decision Time
        type: string
      candidate_id:
        title: Candidate Id
        type: string
      score_confidence:
        maximum: 1
        minimum: 0
        title: Score Confidence
        type: number
      score_interval_lower:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Score Interval Lower
      score_interval_upper:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Score Interval Upper
      model_disagreement:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Model Disagreement
      calibration_status:
        title: Calibration Status
        type: string
      calibration_version:
        title: Calibration Version
        type: string
      ood_severity:
        title: Ood Severity
        type: string
      lineage_id:
        title: Lineage Id
        type: string
    required:
    - cycle_id
    - decision_time
    - candidate_id
    - score_confidence
    - calibration_status
    - calibration_version
    - ood_severity
    - lineage_id
    title: ConfidenceRecord
    type: object
additionalProperties: false
properties:
  artifact_id:
    title: Artifact Id
