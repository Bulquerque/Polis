$defs:
  RankingTraceRecord:
    additionalProperties: false
    properties:
      cycle_id:
        title: Cycle Id
        type: string
      decision_time:
        format: date-time
        title: Decision Time
        type: string
      comparison_group_id:
        title: Comparison Group Id
        type: string
      candidate_id:
        title: Candidate Id
        type: string
      rank_position:
        minimum: 1
        title: Rank Position
        type: integer
      sort_stages:
        items:
          $ref: '#/$defs/SortComponent'
        title: Sort Components
        type: array
      economic_tie_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Economic Tie Id
      policy_versions:
        additionalProperties:
          type: string
        title: Policy Versions
        type: object
      model_id:
        title: Model Id
        type: string
      evidence_artifact_ids:
        items:
          type: string
        title: Evidence Artifact Ids
        type: array
      lineage_id:
        title: Lineage Id
        type: string
    required:
    - cycle_id
    - decision_time
    - comparison_group_id
    - candidate_id
    - rank_position
    - sort_stages
    - economic_tie_id
    - policy_versions
    - model_id
    - evidence_artifact_ids
    - lineage_id
    title: RankingTraceRecord
    type: object
  SortComponent:
    additionalProperties: false
    properties:
      name:
        title: Name
        type: string
      value:
        anyOf:
        - type: string
        - type: integer
        - type: number
        title: Value
      direction:
        title: Direction
        type: string
    required:
    - name
    - value
    - direction
    title: SortComponent
    type: object
additionalProperties: false
