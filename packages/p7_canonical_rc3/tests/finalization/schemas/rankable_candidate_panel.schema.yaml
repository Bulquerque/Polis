$defs:
  RankableRecord:
    additionalProperties: false
    properties:
      cycle_id:
        title: Cycle Id
        type: string
      decision_time:
        format: date-time
        title: Decision Time
        type: string
      comparison_group_id:
        title: Comparison Group Id
        type: string
      candidate_id:
        title: Candidate Id
        type: string
      hybrid_score:
        title: Hybrid Score
        type: number
      diversity_penalty:
        minimum: 0
        title: Diversity Penalty
        type: number
      diversity_adjusted_score:
        title: Diversity Adjusted Score
        type: number
      score_confidence:
        maximum: 1
        minimum: 0
        title: Score Confidence
        type: number
      robustness_stage:
        title: Robustness Component
        type: number
      execution_quality_stage:
        title: Execution Quality Component
        type: number
      leg_count:
        minimum: 1
        title: Leg Count
        type: integer
      pareto_tier:
        minimum: 0
        title: Pareto Tier
        type: integer
      model_id:
        title: Model Id
        type: string
      score_semantics_version:
        title: Score Semantics Version
        type: string
      calibration_status:
        title: Calibration Status
        type: string
      calibration_version:
        title: Calibration Version
        type: string
      ood_severity:
        title: Ood Severity
        type: string
      model_disagreement:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Model Disagreement
      policy_version:
        title: Policy Version
        type: string
      lineage_id:
        title: Lineage Id
        type: string
    required:
    - cycle_id
    - decision_time
    - comparison_group_id
    - candidate_id
    - hybrid_score
    - diversity_penalty
    - diversity_adjusted_score
    - score_confidence
    - robustness_stage
    - execution_quality_stage
    - leg_count
    - pareto_tier
    - model_id
    - score_semantics_version
    - calibration_status
    - calibration_version
    - ood_severity
    - policy_version
    - lineage_id
    title: RankableRecord
    type: object
additionalProperties: false
properties:
  artifact_id:
