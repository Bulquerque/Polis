    title: Producer Module Id
    type: string
  run_id:
    title: Run Id
    type: string
  cycle_id:
    title: Cycle Id
    type: string
  decision_time:
    description: Timezone-aware UTC-compatible datetime
    format: date-time
    title: Decision Time
    type: string
  available_at:
    description: Timezone-aware UTC-compatible datetime
    format: date-time
    title: Available At
