$defs:
  Direction:
    enum:
    - MAXIMIZE
    - MINIMIZE
    title: Direction
    type: string
  MetricSourceRecord:
    additionalProperties: false
    properties:
      candidate_id:
        title: Candidate Id
        type: string
      metric_id:
        title: Metric Id
        type: string
      raw_value:
        anyOf:
        - type: number
        - type: 'null'
        title: Raw Value
      units:
        title: Units
        type: string
      direction:
        $ref: '#/$defs/Direction'
      semantic_version:
        title: Semantic Version
        type: string
      source_artifact_id:
        title: Source Artifact Id
        type: string
      available_at:
        format: date-time
        title: Available At
        type: string
      missingness_status:
        $ref: '#/$defs/MissingnessStatus'
      lineage_id:
        title: Lineage Id
        type: string
    required:
    - candidate_id
    - metric_id
    - raw_value
    - units
    - direction
    - semantic_version
    - source_artifact_id
    - available_at
    - missingness_status
    - lineage_id
    title: MetricSourceRecord
    type: object
  MissingnessStatus:
    enum:
    - AVAILABLE
    - UNAVAILABLE
    - OPTIONAL_MISSING
    - BLOCKED
    title: MissingnessStatus
    type: string
additionalProperties: false
properties:
  artifact_id:
    title: Artifact Id
    type: string
  artifact_name:
    title: Artifact Name
    type: string
  schema_version:
    title: Schema Version
    type: string
  producer_phase:
    title: Producer Phase
    type: string
  producer_module_id:
    title: Producer Module Id
    type: string
  run_id:
    title: Run Id
    type: string
  cycle_id:
    title: Cycle Id
    type: string
  decision_time:
    format: date-time
    title: Decision Time
    type: string
  available_at:
    format: date-time
    title: Available At
    type: string
  created_at:
    format: date-time
    title: Created At
    type: string
  content_sha256:
    pattern: ^[0-9a-f]{64}$
    title: Content Sha256
    type: string
  record_count:
    minimum: 0
    title: Record Count
    type: integer
  lineage_id:
    title: Lineage Id
    type: string
  records:
    items:
      $ref: '#/$defs/MetricSourceRecord'
    title: Records
    type: array
required:
- artifact_id
- artifact_name
- schema_version
- producer_phase
- producer_module_id
- run_id
- cycle_id
- decision_time
- available_at
- created_at
- content_sha256
- record_count
- lineage_id
- records
title: candidate_metric_source_panel envelope v1.0.0
type: object
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://quant-pipeline.local/schemas/p7/s3/candidate_metric_source_panel/1.0.0
