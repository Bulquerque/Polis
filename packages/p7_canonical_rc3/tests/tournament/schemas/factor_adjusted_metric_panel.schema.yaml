$defs:
  AdjustmentStatus:
    enum:
    - NOT_APPLICABLE
    - BYPASS
    - ADJUSTED
    - UNAVAILABLE
    - BLOCKED
    title: AdjustmentStatus
    type: string
  FactorAdjustedMetricRecord:
    additionalProperties: false
    properties:
      candidate_id:
        title: Candidate Id
        type: string
      comparison_group_id:
        title: Comparison Group Id
        type: string
      metric_id:
        title: Metric Id
        type: string
      raw_value:
        anyOf:
        - type: number
        - type: 'null'
        title: Raw Value
      directed_value:
        anyOf:
        - type: number
        - type: 'null'
        title: Directed Value
      adjusted_raw_value:
        anyOf:
        - type: number
        - type: 'null'
        title: Adjusted Raw Value
      adjusted_directed_value:
        anyOf:
        - type: number
        - type: 'null'
        title: Adjusted Directed Value
      adjustment_status:
        $ref: '#/$defs/AdjustmentStatus'
      adjustment_model_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Adjustment Model Id
      total_factor_contribution:
        anyOf:
        - type: number
        - type: 'null'
        title: Total Factor Contribution
      intercept:
        anyOf:
        - type: number
        - type: 'null'
        title: Intercept
      reason_code:
        anyOf:
        - type: string
        - type: 'null'
        title: Reason Code
      lineage_id:
        title: Lineage Id
        type: string
    required:
    - candidate_id
    - comparison_group_id
    - metric_id
    - raw_value
    - directed_value
    - adjusted_raw_value
    - adjusted_directed_value
    - adjustment_status
    - adjustment_model_id
    - total_factor_contribution
    - intercept
    - reason_code
    - lineage_id
    title: FactorAdjustedMetricRecord
    type: object
additionalProperties: false
properties:
  artifact_id:
    title: Artifact Id
    type: string
  artifact_name:
    title: Artifact Name
    type: string
  schema_version:
    title: Schema Version
    type: string
  producer_phase:
    title: Producer Phase
    type: string
  producer_module_id:
    title: Producer Module Id
    type: string
  run_id:
    title: Run Id
    type: string
  cycle_id:
    title: Cycle Id
    type: string
  decision_time:
    format: date-time
    title: Decision Time
    type: string
  available_at:
    format: date-time
    title: Available At
    type: string
  created_at:
    format: date-time
    title: Created At
    type: string
  content_sha256:
    pattern: ^[0-9a-f]{64}$
    title: Content Sha256
    type: string
  record_count:
    minimum: 0
    title: Record Count
    type: integer
  lineage_id:
    title: Lineage Id
    type: string
  records:
    items:
      $ref: '#/$defs/FactorAdjustedMetricRecord'
    title: Records
    type: array
required:
- artifact_id
- artifact_name
- schema_version
- producer_phase
- producer_module_id
- run_id
- cycle_id
- decision_time
- available_at
- created_at
- content_sha256
- record_count
- lineage_id
- records
