$defs:
  ModelQualificationStatus:
    enum:
    - QUALIFIED
    - REJECTED
    - SHADOW
    title: ModelQualificationStatus
    type: string
  OptionFactorModelRecord:
    additionalProperties: false
    properties:
      model_id:
        title: Model Id
        type: string
      model_version:
        title: Model Version
        type: string
      qualification_status:
        $ref: '#/$defs/ModelQualificationStatus'
      training_cutoff_at:
        format: date-time
        title: Training Cutoff At
        type: string
      factor_schema_version:
        title: Factor Schema Version
        type: string
      target_metric_id:
        title: Target Metric Id
        type: string
      intercept:
        title: Intercept
        type: number
      coefficients:
        additionalProperties:
          type: number
        title: Coefficients
        type: object
      lineage_id:
        title: Lineage Id
        type: string
    required:
    - model_id
    - model_version
    - qualification_status
    - training_cutoff_at
    - factor_schema_version
    - target_metric_id
    - intercept
    - coefficients
    - lineage_id
    title: OptionFactorModelRecord
    type: object
additionalProperties: false
properties:
  artifact_id:
    title: Artifact Id
    type: string
  artifact_name:
    title: Artifact Name
    type: string
  schema_version:
    title: Schema Version
    type: string
  producer_phase:
    title: Producer Phase
    type: string
  producer_module_id:
    title: Producer Module Id
    type: string
  run_id:
    title: Run Id
    type: string
  cycle_id:
    title: Cycle Id
    type: string
  decision_time:
    format: date-time
    title: Decision Time
    type: string
  available_at:
    format: date-time
    title: Available At
    type: string
  created_at:
    format: date-time
    title: Created At
    type: string
  content_sha256:
    pattern: ^[0-9a-f]{64}$
    title: Content Sha256
    type: string
  record_count:
    minimum: 0
    title: Record Count
    type: integer
  lineage_id:
    title: Lineage Id
    type: string
  records:
    items:
      $ref: '#/$defs/OptionFactorModelRecord'
    title: Records
    type: array
required:
- artifact_id
- artifact_name
- schema_version
- producer_phase
- producer_module_id
- run_id
- cycle_id
- decision_time
- available_at
- created_at
- content_sha256
- record_count
- lineage_id
- records
title: option_factor_model_artifact envelope v1.0.0
type: object
