$defs:
  ObjectiveFamilyDefinition:
    additionalProperties: false
    properties:
      objective_family:
        title: Objective Family
        type: string
      optional_metric_ids:
        default: []
        items:
          type: string
        title: Optional Metric Ids
        type: array
      required_metric_ids:
        items:
          type: string
        title: Required Metric Ids
        type: array
    required:
    - objective_family
    - required_metric_ids
    title: ObjectiveFamilyDefinition
    type: object
$id: https://quant-pipeline.local/schemas/p7/objective_family_registry/2.0.0
$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
properties:
  families:
    items:
      $ref: '#/$defs/ObjectiveFamilyDefinition'
    title: Families
    type: array
  registry_id:
    title: Registry Id
    type: string
  registry_version:
    pattern: ^\d+\.\d+\.\d+$
    title: Registry Version
    type: string
required:
- registry_id
- registry_version
- families
title: ObjectiveFamilyRegistry
type: object
