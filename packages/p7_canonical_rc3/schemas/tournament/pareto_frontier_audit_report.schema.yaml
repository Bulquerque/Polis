$defs:
  ParetoFrontierAuditRecord:
    additionalProperties: false
    properties:
      policy_id:
        title: Policy Id
        type: string
      exact_algorithm:
        title: Exact Algorithm
        type: boolean
      group_count:
        minimum: 0
        title: Group Count
        type: integer
      candidate_count:
        minimum: 0
        title: Candidate Count
        type: integer
      frontier_count:
        minimum: 0
        title: Frontier Count
        type: integer
      incomparable_count:
        minimum: 0
        title: Incomparable Count
        type: integer
      diagnostics:
        items:
          $ref: '#/$defs/ParetoGroupDiagnostic'
        title: Diagnostics
        type: array
      permutation_invariant_serialization:
        title: Permutation Invariant Serialization
        type: boolean
    required:
    - policy_id
    - exact_algorithm
    - group_count
    - candidate_count
    - frontier_count
    - incomparable_count
    - diagnostics
    - permutation_invariant_serialization
    title: ParetoFrontierAuditRecord
    type: object
  ParetoGroupDiagnostic:
    additionalProperties: false
    properties:
      comparison_group_id:
        title: Comparison Group Id
        type: string
      candidate_count:
        minimum: 0
        title: Candidate Count
        type: integer
      comparable_candidate_count:
        minimum: 0
        title: Comparable Candidate Count
        type: integer
      incomparable_candidate_count:
        minimum: 0
        title: Incomparable Candidate Count
        type: integer
      relation_count:
        minimum: 0
        title: Relation Count
        type: integer
      layer_count:
        minimum: 0
        title: Layer Count
        type: integer
      pair_comparisons:
        minimum: 0
        title: Pair Comparisons
        type: integer
    required:
    - comparison_group_id
    - candidate_count
    - comparable_candidate_count
    - incomparable_candidate_count
    - relation_count
    - layer_count
    - pair_comparisons
    title: ParetoGroupDiagnostic
    type: object
additionalProperties: false
properties:
  artifact_id:
    title: Artifact Id
    type: string
  artifact_name:
    title: Artifact Name
    type: string
  schema_version:
    title: Schema Version
    type: string
  producer_phase:
    title: Producer Phase
    type: string
  producer_module_id:
    title: Producer Module Id
    type: string
  run_id:
    title: Run Id
    type: string
  cycle_id:
    title: Cycle Id
    type: string
  decision_time:
    format: date-time
    title: Decision Time
    type: string
  available_at:
    format: date-time
    title: Available At
    type: string
  created_at:
    format: date-time
    title: Created At
    type: string
  content_sha256:
    pattern: ^[0-9a-f]{64}$
    title: Content Sha256
    type: string
  record_count:
    minimum: 0
    title: Record Count
    type: integer
  lineage_id:
    title: Lineage Id
    type: string
  records:
    items:
      $ref: '#/$defs/ParetoFrontierAuditRecord'
    title: Records
    type: array
required:
- artifact_id
- artifact_name
- schema_version
- producer_phase
- producer_module_id
- run_id
- cycle_id
- decision_time
- available_at
- created_at
- content_sha256
- record_count
- lineage_id
- records
