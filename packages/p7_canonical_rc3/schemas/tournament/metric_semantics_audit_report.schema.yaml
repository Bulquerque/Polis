        type: string
      candidate_count:
        minimum: 0
        title: Candidate Count
        type: integer
      source_metric_count:
        minimum: 0
        title: Source Metric Count
        type: integer
      output_metric_count:
        minimum: 0
        title: Output Metric Count
        type: integer
      converted_metric_count:
        minimum: 0
        title: Converted Metric Count
        type: integer
      blocked_metric_count:
        minimum: 0
        title: Blocked Metric Count
        type: integer
      unavailable_metric_count:
        minimum: 0
        title: Unavailable Metric Count
        type: integer
      forbidden_field_scan_passed:
        title: Forbidden Field Scan Passed
        type: boolean
      duplicate_grain_count:
        minimum: 0
        title: Duplicate Grain Count
        type: integer
      reason_counts:
        additionalProperties:
          type: integer
        title: Reason Counts
        type: object
    required:
    - policy_id
    - candidate_count
    - source_metric_count
    - output_metric_count
    - converted_metric_count
    - blocked_metric_count
    - unavailable_metric_count
    - forbidden_field_scan_passed
    - duplicate_grain_count
    - reason_counts
