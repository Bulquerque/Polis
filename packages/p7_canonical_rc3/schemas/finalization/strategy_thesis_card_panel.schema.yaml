$defs:
  ThesisCardRecord:
    additionalProperties: false
    properties:
      cycle_id:
        title: Cycle Id
        type: string
      decision_time:
        format: date-time
        title: Decision Time
        type: string
      comparison_group_id:
        title: Comparison Group Id
        type: string
      candidate_id:
        title: Candidate Id
        type: string
      rank_position:
        minimum: 1
        title: Rank Position
        type: integer
      belief_reference_ids:
        items:
          type: string
        title: Belief Reference Ids
        type: array
      objective_family:
        title: Objective Family
        type: string
      origin_template:
        anyOf:
        - type: string
        - type: 'null'
        title: Origin Template
      mutation_trace:
        items:
          type: string
        title: Mutation Trace
        type: array
      payoff_shape_reference:
        title: Payoff Shape Reference
        type: string
      profit_regions:
        items:
          type: string
        title: Profit Regions
        type: array
      failure_regions:
        items:
          type: string
        title: Failure Regions
        type: array
      score_contributions:
        additionalProperties:
          type: number
        title: Score Contributions
        type: object
      confidence_state:
        additionalProperties:
          anyOf:
          - type: string
          - type: number
          - type: 'null'
        title: Confidence State
        type: object
      ood_state:
        title: Ood State
        type: string
      nearest_alternative_ids:
        items:
          type: string
        title: Nearest Alternative Ids
        type: array
      invalidation_conditions:
        items:
          type: string
        title: Invalidation Conditions
        type: array
      section_availability:
        additionalProperties:
          type: string
        title: Section Availability
        type: object
      evidence_artifact_ids:
        items:
          type: string
        title: Evidence Artifact Ids
        type: array
      policy_version:
        title: Policy Version
        type: string
      lineage_id:
        title: Lineage Id
        type: string
    required:
    - cycle_id
    - decision_time
    - comparison_group_id
    - candidate_id
    - rank_position
    - belief_reference_ids
    - objective_family
    - origin_template
    - mutation_trace
    - payoff_shape_reference
    - profit_regions
    - failure_regions
    - score_contributions
    - confidence_state
    - ood_state
    - nearest_alternative_ids
    - invalidation_conditions
    - section_availability
    - evidence_artifact_ids
    - policy_version
    - lineage_id
    title: ThesisCardRecord
    type: object
additionalProperties: false
