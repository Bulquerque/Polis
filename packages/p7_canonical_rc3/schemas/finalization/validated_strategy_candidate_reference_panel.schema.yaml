$defs:
  ArtifactReference:
    additionalProperties: false
    properties:
      artifact_name:
        title: Artifact Name
        type: string
      artifact_id:
        title: Artifact Id
        type: string
      content_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Content Sha256
        type: string
      schema_version:
        title: Schema Version
        type: string
      record_count:
        minimum: 0
        title: Record Count
        type: integer
    required:
    - artifact_name
    - artifact_id
    - content_sha256
    - schema_version
    - record_count
    title: ArtifactReference
    type: object
  StrategyReferenceRecord:
    additionalProperties: false
    properties:
      cycle_id:
        title: Cycle Id
        type: string
      decision_time:
