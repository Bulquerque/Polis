        title: Pareto Tier
      belief_reference_ids:
        default: []
        items:
          type: string
        title: Belief Reference Ids
        type: array
      mutation_trace:
        default: []
        items:
          type: string
        title: Mutation Trace
        type: array
      profit_regions:
        default: []
        items:
          type: string
        title: Profit Regions
        type: array
      failure_regions:
        default: []
        items:
          type: string
        title: Failure Regions
        type: array
      invalidation_conditions:
        default: []
        items:
          type: string
        title: Invalidation Conditions
        type: array
      strategy_candidate_reference:
        anyOf:
        - $ref: '#/$defs/ArtifactReference'
        - type: 'null'
        default: null
      strategy_legs_reference:
        anyOf:
        - $ref: '#/$defs/ArtifactReference'
        - type: 'null'
        default: null
      payoff_evaluation_reference:
        anyOf:
        - $ref: '#/$defs/ArtifactReference'
        - type: 'null'
        default: null
      scenario_evaluation_reference:
        anyOf:
        - $ref: '#/$defs/ArtifactReference'
        - type: 'null'
        default: null
      risk_reference:
        anyOf:
        - $ref: '#/$defs/ArtifactReference'
        - type: 'null'
        default: null
      cost_liquidity_reference:
        anyOf:
        - $ref: '#/$defs/ArtifactReference'
        - type: 'null'
        default: null
      greeks_reference:
        anyOf:
        - $ref: '#/$defs/ArtifactReference'
        - type: 'null'
        default: null
      generation_trace_reference:
        anyOf:
        - $ref: '#/$defs/ArtifactReference'
        - type: 'null'
        default: null
      legacy_underlying:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Legacy Underlying
      legacy_instrument_type:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Legacy Instrument Type
      legacy_action_type:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Legacy Action Type
      legacy_reference_price:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Legacy Reference Price
      legacy_contract_key:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Legacy Contract Key
      legacy_expiration_date:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Legacy Expiration Date
      legacy_strike:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Legacy Strike
      legacy_dte:
        anyOf:
        - minimum: 0
          type: integer
        - type: 'null'
        default: null
        title: Legacy Dte
      legacy_cost_estimate:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Legacy Cost Estimate
      legacy_liquidity_score:
        anyOf:
        - maximum: 1
          minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Legacy Liquidity Score
    required:
    - cycle_id
    - decision_time
    - candidate_id
    - comparison_group_id
    - candidate_identity_hash
    - strategy_artifact_id
    - strategy_content_sha256
    - strategy_schema_version
    - strategy_lineage_id
    - defined_risk_status
    - execution_context_time
    title: StrategyReferenceRecord
    type: object
