$defs:
  AbstentionPolicy:
    additionalProperties: false
    properties:
      policy_id:
        title: Policy Id
        type: string
      minimum_confidence:
        maximum: 1
        minimum: 0
        title: Minimum Confidence
        type: number
      maximum_score_interval_width:
        minimum: 0
        title: Maximum Score Interval Width
        type: number
      maximum_model_disagreement:
        minimum: 0
        title: Maximum Model Disagreement
        type: number
      accepted_calibration_statuses:
        items:
          type: string
        title: Accepted Calibration Statuses
        type: array
      moderate_ood_values:
        items:
          type: string
        title: Moderate Ood Values
        type: array
      minimum_group_rankable_count:
        minimum: 1
        title: Minimum Group Rankable Count
        type: integer
      minimum_group_rankable_fraction:
        maximum: 1
        minimum: 0
        title: Minimum Group Rankable Fraction
        type: number
    required:
    - policy_id
    - minimum_confidence
    - maximum_score_interval_width
    - maximum_model_disagreement
    - accepted_calibration_statuses
    - moderate_ood_values
    - minimum_group_rankable_count
    - minimum_group_rankable_fraction
    title: AbstentionPolicy
    type: object
  DiversityPolicy:
    additionalProperties: false
    properties:
      policy_id:
        title: Policy Id
        type: string
      cluster_threshold:
        maximum: 1
        minimum: 0
        title: Cluster Threshold
        type: number
      density_top_k:
        minimum: 1
        title: Density Top K
        type: integer
      penalty_lambda:
        minimum: 0
        title: Penalty Lambda
        type: number
      max_penalty_fraction:
        maximum: 1
        minimum: 0
        title: Max Penalty Fraction
        type: number
      score_scale:
        exclusiveMinimum: 0
        title: Score Scale
        type: number
    required:
    - policy_id
    - cluster_threshold
    - density_top_k
    - penalty_lambda
    - max_penalty_fraction
    - score_scale
    title: DiversityPolicy
    type: object
  RuntimeConfig:
    additionalProperties: false
    properties:
      trace_id:
        title: Trace Id
        type: string
      run_id:
        title: Run Id
        type: string
      run_timestamp:
        format: date-time
        title: Run Timestamp
        type: string
    required:
    - trace_id
    - run_id
    - run_timestamp
    title: RuntimeConfig
    type: object
  SafetyPolicy:
    additionalProperties: false
    properties:
      policy_id:
        title: Policy Id
        type: string
      max_execution_context_age_seconds:
        minimum: 0
        title: Max Execution Context Age Seconds
        type: integer
      accepted_defined_risk_statuses:
        items:
          type: string
        title: Accepted Defined Risk Statuses
        type: array
      accepted_model_promotion_statuses:
        items:
          type: string
        title: Accepted Model Promotion Statuses
        type: array
      accepted_model_compatibility_statuses:
        items:
          type: string
        title: Accepted Model Compatibility Statuses
        type: array
      severe_ood_values:
        items:
          type: string
        title: Severe Ood Values
        type: array
    required:
    - policy_id
    - max_execution_context_age_seconds
    - accepted_defined_risk_statuses
    - accepted_model_promotion_statuses
    - accepted_model_compatibility_statuses
    - severe_ood_values
    title: SafetyPolicy
    type: object
  SimilarityComponent:
    additionalProperties: false
    properties:
      name:
        title: Name
        type: string
      weight:
        exclusiveMinimum: 0
        title: Weight
        type: number
    required:
    - name
    - weight
    title: SimilarityComponent
    type: object
  SimilarityPolicy:
    additionalProperties: false
    properties:
      policy_id:
        title: Policy Id
        type: string
      stages:
        items:
          $ref: '#/$defs/SimilarityComponent'
        title: Components
        type: array
      minimum_weight_coverage:
        maximum: 1
        minimum: 0
        title: Minimum Weight Coverage
        type: number
      top_k_neighbors:
        minimum: 1
        title: Top K Neighbors
        type: integer
      minimum_edge_similarity:
        maximum: 1
        minimum: 0
        title: Minimum Edge Similarity
        type: number
      max_group_size:
        minimum: 2
        title: Max Group Size
        type: integer
    required:
    - policy_id
    - stages
    - minimum_weight_coverage
    - top_k_neighbors
    - minimum_edge_similarity
    - max_group_size
    title: SimilarityPolicy
    type: object
additionalProperties: false
properties:
  runtime:
    $ref: '#/$defs/RuntimeConfig'
  similarity:
    $ref: '#/$defs/SimilarityPolicy'
  diversity:
    $ref: '#/$defs/DiversityPolicy'
  safety:
    $ref: '#/$defs/SafetyPolicy'
  abstention:
    $ref: '#/$defs/AbstentionPolicy'
  forbidden_fields:
    items:
      type: string
    title: Forbidden Fields
    type: array
required:
- runtime
- similarity
- diversity
- safety
- abstention
- forbidden_fields
title: S7Config
type: object
$schema: https://json-schema.org/draft/2020-12/schema
