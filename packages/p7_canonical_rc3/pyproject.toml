[build-system]
requires=["setuptools>=75","wheel"]
build-backend="setuptools.build_meta"
[project]
name="quant-pipeline-p7-strategy-tournament"
version="2.3.1rc3.post2"
description="P7 Strategy Tournament across S1-S8"
requires-python=">=3.11,<3.15"
dependencies=["numpy>=1.26,<3","pydantic>=2,<3","PyYAML>=6,<7","jsonschema>=4,<5"]
[project.optional-dependencies]
dev=["pytest>=8,<10","hypothesis>=6,<7","ruff>=0.12,<1","mypy>=1.18,<2","coverage>=7,<8"]
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
addopts="-ra --strict-markers -p no:cacheprovider"
testpaths=["tests"]
pythonpath=["src"]
markers=["unit","contract","integration","property","temporal","replay","performance","adversarial"]
[tool.ruff]
target-version="py311"
line-length=110
src=["src","tests"]
[tool.ruff.lint]
select=["E","F","I","UP","B","SIM","RUF"]
ignore=["E501"]
[tool.mypy]
python_version="3.11"
strict=true
warn_unreachable=true
show_error_codes=true
files=["src/quant_pipeline/phase_07_strategy_tournament"]
[tool.coverage.run]
branch=true
source=["src/quant_pipeline/phase_07_strategy_tournament"]
