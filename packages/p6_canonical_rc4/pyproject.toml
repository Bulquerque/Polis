[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-pipeline-p6-strategy-synthesis"
version = "0.6.2rc4.post2"
description = "P6 strategy synthesis with native P5 RC34 manifest compatibility and P7 handoff"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "coverage>=7.10,<8",
  "PyYAML>=6,<7",
  "hypothesis>=6.120,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
p6 = "quant_pipeline.phase_06_strategy_synthesis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "contract: boundary, schema, and invariant tests",
  "temporal: point-in-time and non-interference tests",
  "adversarial: malformed and hostile input tests",
  "integration: cross-subphase integration tests",
  "property: property-based and metamorphic tests",
]

[tool.coverage.run]
branch = true
source = ["quant_pipeline.phase_06_strategy_synthesis"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = ["tests/", "dist/", "build/"]
