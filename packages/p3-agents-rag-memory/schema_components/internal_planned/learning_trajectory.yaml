$schema: https://json-schema.org/draft/2020-12/schema
title: Learning Trajectory
type: object
additionalProperties: false
properties:
  trajectory_id: &id001
    type: string
  state_summary:
    type: object
  action:
    type: object
  feedback:
    type: object
  reward_vector:
    type: object
  outcome_status:
    type: string
    enum:
    - PENDING
    - MATURED
    - PROMOTED
    - REJECTED
    - REGIME_SPECIFIC
  available_at: *id001
  lineage_id: *id001
required:
- trajectory_id
- state_summary
- action
- feedback
- reward_vector
- outcome_status
- available_at
- lineage_id
