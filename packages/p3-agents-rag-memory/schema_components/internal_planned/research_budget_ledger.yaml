$schema: https://json-schema.org/draft/2020-12/schema
title: Research Budget Ledger
type: object
additionalProperties: false
properties:
  ledger_id: &id001
    type: string
  total_trials:
    type: integer
    minimum: 0
  trials_by_family:
    type: object
    additionalProperties:
      type: integer
      minimum: 0
  failed_trials:
    type: integer
    minimum: 0
  promoted_trials:
    type: integer
    minimum: 0
  datasets_seen:
    type: array
    items: *id001
  holdout_access_count:
    type: integer
    minimum: 0
  lineage_id: *id001
required:
- ledger_id
- total_trials
- trials_by_family
- failed_trials
- promoted_trials
- datasets_seen
- holdout_access_count
- lineage_id
