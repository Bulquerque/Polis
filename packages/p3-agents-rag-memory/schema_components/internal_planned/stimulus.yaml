$schema: https://json-schema.org/draft/2020-12/schema
title: stimulus
status: planned_internal_schema
type: object
required:
- stimulus_id
- origin_type
- available_at
- stimulus_type
- subject
- underlying
- intensity
- evidence_refs
- lineage_id
properties:
  stimulus_id:
    type: string
  origin_type:
    type: string
    enum:
    - external_pit_context
    - tool_discovery
    - social_delivery
    - memory_trigger
    - attention_followup
    - monthly_heartbeat
  available_at:
    type: string
    format: date-time
  stimulus_type:
    type: string
  subject:
    type: string
  underlying:
    type:
    - string
    - 'null'
  intensity:
    type: number
    minimum: 0
    maximum: 1
  evidence_refs:
    type: array
    items:
      type: string
  source_person_id:
    type:
    - string
    - 'null'
  source_tool_call_id:
    type:
    - string
    - 'null'
  lineage_id:
    type: string
additionalProperties: false
