    - P3.S21.M04
    - P3.S26.M02
    - P3.S27.M02
    artifacts:
    - raw_tool_result_panel
    - tool_call_audit_panel
    - tool_discovery_event_panel
    phase_outputs: []
temporal_inputs: []
tests_required:
- provider_failure_no_fake_success
- audit_matches_requests
- cost_recorded
- timeout_retry_bounded
- provider_failure_material
- provider_concurrency_bounded
- audit_contract_complete
- no_authorized_requests_empty_valid
definition_of_done:
- required_tests_implemented_and_passing
- outputs_match_schemas
- no_undeclared_side_effects
- observability_present
- contracts_docs_tests_updated_together
notes:
- Implementation, contract and executable tests are synchronized in the final release.
contract_version: p3.s21.implementation.v1
owner_prompt: subphases/P3_S21_llm_cognition_tool_execution.md
implementation_boundary:
  owns:
  - Executar requests validados via adapters e emitir resultados brutos, discovery
    events e audit real.
  must_not_absorb:
  - Não inventar sucesso ou interpretar resultado como crença.
  state_mutation_policy: only_outputs_declared_in_MODULE_IO_MATRIX
observability_requirements:
  events:
  - module_started
  - input_contract_validated
  - module_succeeded
  - module_failed
  dimensions:
  - run_id
  - cycle_id
  - module_id
  - as_of_time
  - contract_version
  - lineage_id
  metrics:
  - duration_ms
  - input_record_count
  - output_record_count
  - warning_count
  - error_count
  redaction:
  - credentials
  - provider_secrets
  - private_tool_payloads
debugging_contract:
  triage_order:
  - verify_declared_inputs_materialized
  - verify_schema_and_version
  - verify_available_at_and_as_of_time
  - verify_upstream_lineage
  - verify_provider_or_tool_boundary_if_applicable
  - verify_output_schema_and_forbidden_fields
  error_codes:
  - P3_S21_M03_INPUT_INVALID
  - P3_S21_M03_TEMPORAL_VIOLATION
  - P3_S21_M03_UNDECLARED_DEPENDENCY
  - P3_S21_M03_OUTPUT_INVALID
  - P3_S21_M03_FORBIDDEN_FIELD
  fallback_policy: no_silent_fallback; any fallback must be declared, observable and
    tested
change_control:
  safe_surfaces:
  - implementation
  - configuration
  - prompt_block
  - provider_adapter
  contract_change_requires:
  - schema_update
  - io_matrix_update
  - tests_update
  - documentation_update
  one_change_experiment_required_when_retro_managed: true
review_checklist:
- responsibility_is_single_and_bounded
- inputs_and_outputs_match_io_matrix
- no_forbidden_authority
- temporal_semantics_are_explicit
- tests_cover_happy_negative_boundary_lineage_observability
rc: RC4.1
forbidden_connections:
- any_connection_not_listed_in_CONNECTIONS_ALLOWED
- future_phase_output_consumption
- hidden_global_state
- same_cycle_back_edge
- direct_P3_to_P5_P6_P7_P8
implementation_target: src/quant_pipeline/phase_03_agents_rag_memory/modules/P3_S21_M03_mcp_tool_executor.py
unit_test_target: tests/phase_specific/test_p3_s21_m03_wrapper.py
integration_test_target: tests/phase_specific/test_p3_s21_integration.py
implementation_status_policy:
  initial: NOT_IMPLEMENTED
  allowed_progression:
  - NOT_IMPLEMENTED
  - IMPLEMENTED_QUALIFIED_INTERNAL
  - QUALIFIED_LOCAL
  - QUALIFIED_P0
  production_claim_requires: QUALIFIED_P0
  current: IMPLEMENTED_QUALIFIED_INTERNAL
