module_id: P3.S21.M03
module_name: mcp_tool_executor
phase: phase_03_agents_rag_memory
subphase: P3.S21
status: implemented_qualified_internal
function: Executar requests validados via adapters e emitir resultados brutos, discovery
  events e audit real.
inputs:
- validated_tool_call_request_panel
- mcp_gateway_policy
- tool_call_audit_contract
- provider_adapter_registry_config
outputs:
- raw_tool_result_panel
- tool_call_audit_panel
- tool_discovery_event_panel
validations:
- request_result_linkage
- actual_execution_status
- provider_failure_material
- cost_latency_recorded
- pit_response_checked
invariants:
- point_in_time_integrity
- lineage_traceability
- single_responsibility
- no_hidden_global_state
- no_same_cycle_back_edge
non_responsibilities:
- Não inventar sucesso ou interpretar resultado como crença.
fail_fast_conditions:
- mcp_tool_executor_schema_violation
- mcp_tool_executor_forbidden_field_detected
- mcp_tool_executor_undeclared_dependency
forbidden_fields:
- future_return
- candidate_score
- rank_score
- portfolio_weight
- trade_decision
- buy_sell_signal
