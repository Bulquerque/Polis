  integration_test_target: tests/phase_specific/test_p3_s21_integration.py
  canonical_entrypoint: execute(inputs, ModuleExecutionContext)
  profile_aware: true
documentation_refs:
- docs/MODULE_BY_MODULE.md
- docs/ARCHITECTURE.md
- docs/API_COMPATIBILITY.md
- docs/TESTING.md
compatibility_policy:
  original_module_id_preserved: true
  original_inputs_preserved: true
  original_outputs_preserved: true
  consumer_expectations: schemas/consumer_expectations
  global_contract_changes_require_master_approval: true
documentation_target: docs/runtime/modules/P3_S21_M01.md
integration_revision: P3-FINAL
final_integration:
  gate: P3.EXPERIMENT
  criticality: ALTA
  required_change: Emitir custo, latência, retries, provider fingerprint e cache hit
    observados; sem valores sintéticos.
  evidence_artifacts:
  - variant_execution_manifest
  - evaluation_observation_panel
  - runtime_cost_latency_panel
  - fold_checkpoint_receipt
  mandatory_tests:
  - teste positivo com artefatos reais/versionados
  - teste negativo de leakage, hash ou schema incompatível
  - mesmo fold/seed/checkpoint entre variantes
  - somente um componente ablated
  - zero reference_observations/offset sintético
  acceptance: Implementação real + evidência hash-linked + testes positivos/negativos
    + gate anterior PASS
  rollback: Schema/version bump reversível; preservar artefatos antigos; rollback
    validado em cópia pristine
  qualification_policy: REAL_PIPELINE_ONLY_FAIL_CLOSED
  production_promotion_authority: P0_ONLY
