- low_temperature_configured
- no_fake_tool_results
- no_trade_decision_output
- no_tool_path_valid
- structured_output_one_repair_only
- forbidden_fields_fail_without_repair
- prompt_version_and_hash_recorded
- openai_compatible_adapter_contract
definition_of_done:
- required_tests_implemented_and_passing
- outputs_match_schemas
- no_undeclared_side_effects
- observability_present
- contracts_docs_tests_updated_together
notes:
- Implementation, contract and executable tests are synchronized in the final release.
contract_version: p3.s21.implementation.v1
owner_prompt: subphases/P3_S21_llm_cognition_tool_execution.md
implementation_boundary:
  owns:
  - Executar primeira etapa cognitiva, podendo produzir requests de ferramentas sem
    materializar resultados.
  must_not_absorb:
  - Não executar ferramentas nem produzir audit de execução.
  state_mutation_policy: only_outputs_declared_in_MODULE_IO_MATRIX
observability_requirements:
  events:
  - module_started
  - input_contract_validated
  - module_succeeded
  - module_failed
  dimensions:
  - run_id
  - cycle_id
  - module_id
  - as_of_time
  - contract_version
  - lineage_id
  metrics:
  - duration_ms
  - input_record_count
  - output_record_count
  - warning_count
  - error_count
  redaction:
  - credentials
  - provider_secrets
  - private_tool_payloads
debugging_contract:
  triage_order:
  - verify_declared_inputs_materialized
  - verify_schema_and_version
  - verify_available_at_and_as_of_time
  - verify_upstream_lineage
  - verify_provider_or_tool_boundary_if_applicable
  - verify_output_schema_and_forbidden_fields
  error_codes:
  - P3_S21_M01_INPUT_INVALID
  - P3_S21_M01_TEMPORAL_VIOLATION
  - P3_S21_M01_UNDECLARED_DEPENDENCY
  - P3_S21_M01_OUTPUT_INVALID
  - P3_S21_M01_FORBIDDEN_FIELD
  fallback_policy: no_silent_fallback; any fallback must be declared, observable and
    tested
change_control:
  safe_surfaces:
  - implementation
  - configuration
  - prompt_block
  - provider_adapter
  contract_change_requires:
  - schema_update
  - io_matrix_update
  - tests_update
  - documentation_update
  one_change_experiment_required_when_retro_managed: true
review_checklist:
- responsibility_is_single_and_bounded
- inputs_and_outputs_match_io_matrix
- no_forbidden_authority
- temporal_semantics_are_explicit
- tests_cover_happy_negative_boundary_lineage_observability
rc: RC4.1
forbidden_connections:
- any_connection_not_listed_in_CONNECTIONS_ALLOWED
- future_phase_output_consumption
- hidden_global_state
- same_cycle_back_edge
- direct_P3_to_P5_P6_P7_P8
implementation_target: src/quant_pipeline/phase_03_agents_rag_memory/modules/P3_S21_M01_initial_llm_cognition_planner.py
unit_test_target: tests/phase_specific/test_p3_s21_m01_wrapper.py
integration_test_target: tests/phase_specific/test_p3_s21_integration.py
implementation_status_policy:
