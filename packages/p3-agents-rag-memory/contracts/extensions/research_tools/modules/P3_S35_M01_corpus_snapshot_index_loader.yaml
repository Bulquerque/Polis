module_id: P3.S35.M01
module_name: corpus_snapshot_index_loader
phase: phase_03_agents_rag_memory
subphase: P3.S35
status: implemented_qualified_local
function: Carregar e verificar o snapshot congelado do índice documental produzido por S12, sem reconstruir o índice.
inputs:
- retrieval_index_manifest
- phase3_run_snapshot
optional_inputs:
- document_metadata
outputs: &id001
- corpus_index_snapshot
- corpus_index_readiness_report
validations:
- snapshot_id_match
- as_of_not_after_snapshot
- artifact_hashes
- chunk_count
- unique_chunk_ids
- no_future_chunk_in_snapshot
- keyword_postings_reference_known_chunks
invariants:
- point_in_time_integrity
- lineage_traceability
- single_responsibility
- no_hidden_global_state
- read_only
- deterministic_or_snapshot_pinned
non_responsibilities:
- Não rechunkar, reindexar, baixar embeddings ou consultar rede.
fail_fast_conditions:
- retrieval_manifest_invalid
- snapshot_mismatch
- artifact_hash_mismatch
- future_chunk_in_snapshot
forbidden_fields:
- future_return
- candidate_score
- rank_score
- portfolio_weight
- trade_decision
- buy_sell_signal
- target
- label
- prediction
- realized_pnl
- performance
- pnl
- recommendation
