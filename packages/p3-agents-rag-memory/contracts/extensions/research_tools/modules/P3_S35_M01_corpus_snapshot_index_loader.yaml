    - P3.S12.M02
    - P3.S2.M02
    artifacts:
    - retrieval_index_manifest
    - phase3_run_snapshot
    - document_metadata
  emits_to:
    modules:
    - P3.S35.M02
    - P3.S35.M03
    - P3.S35.M04
    - P3.S35.M05
    artifacts: *id001
forbidden_connections:
- network_in_backtest
- direct_P3_to_P5_P6_P7_P8
- arbitrary_P1_path_access
- same_cycle_back_edge
- undeclared_dependency
