module_id: P3.S37.M01
module_name: macro_series_release_catalog_builder
subphase: P3.S37
function: Build a temporal macro series/release catalog and operation-level readiness report.
inputs:
- research_data_boundary_bundle
outputs:
- macro_series_release_catalog
- macro_view_readiness_report
- macro_asset_context_config_snapshot
invariants:
- no_live_api_access
- series_identity_is_deterministic
- operation_readiness_is_field_based
- vintage_support_is_not_assumed
forbidden_outputs:
- prediction
- regime
- signal
- candidate_id
- portfolio_weight
- trade_decision
optional_inputs:
- macro_series_metadata_registry
- macro_asset_context_registry
phase: phase_03_agents_rag_memory
status: qualified_local
validations:
- input_contracts_strict
- output_contracts_strict
- point_in_time_policy_enforced
- lineage_and_hashes_present
- declared_dependencies_only
non_responsibilities:
- investment_recommendation
- portfolio_construction
- trade_execution
- future_outcome_access
- downstream_model_selection
fail_fast_conditions:
- input_contract_violation
- snapshot_or_vintage_mismatch
- undeclared_dependency
- output_contract_violation
- forbidden_authority
forbidden_fields:
- prediction
- regime
- signal
- candidate_id
- portfolio_weight
- trade_decision
- future_return
- target
- label
- rank_score
- realized_pnl
- performance
- pnl
- buy_sell_signal
- recommendation
allowed_connections:
  consumes_from:
    artifacts:
    - research_data_boundary_bundle
    - macro_series_metadata_registry
    - macro_asset_context_registry
  emits_to:
    artifacts:
    - macro_series_release_catalog
    - macro_view_readiness_report
    - macro_asset_context_config_snapshot
tests_required:
- happy_path
- negative_contract
- determinism
- point_in_time_integrity
- lineage_and_hash_integrity
- consumer_compatibility
definition_of_done:
- required_tests_implemented_and_passing
- outputs_match_schemas
- no_undeclared_side_effects
- contracts_docs_tests_updated_together
- existing_p3_tests_remain_green
observability_requirements:
  events:
  - module_started
  - input_contract_validated
  - module_succeeded
  - module_failed
  dimensions:
  - run_id
  - cycle_id
  - module_id
  - decision_time
  - contract_version
  - lineage_id
  - content_hash
  metrics:
  - duration_ms
  - input_record_count
  - output_record_count
  - warning_count
  - error_count
  redaction:
  - credentials
  - provider_secrets
  - storage_paths
  - raw_bytes
  - private_payloads
debugging_contract:
  triage_order:
  - validate_required_and_optional_inputs
  - validate_schema_and_version
  - validate_point_in_time_and_snapshot_identity
  - validate_lineage_and_hashes
  - validate_output_schema_and_reason_codes
  error_codes:
  - P3RT-CONTRACT-SCHEMA-INVALID
  - P3RT-PIT-SNAPSHOT-MISMATCH
  - P3RT-DATA-UPSTREAM-INCOMPLETE
  - P3RT-OUTPUT-CONTRACT-INVALID
  fallback_policy: fail_closed_no_silent_fallback
change_control:
  safe_surfaces:
  - implementation
  - configuration
  - documentation
  - test_fixture
  contract_change_requires:
  - schema_update
  - fixtures_update
  - consumer_tests_update
  - documentation_update
  - version_review
  major_breaking_change_during_parallel_production: false
review_checklist:
- single_responsibility
- input_output_match
- no_forbidden_authority
- temporal_semantics_explicit
- deterministic_or_seeded
- strict_models
- negative_tests_present
- consumer_compatibility_verified
