module_id: P3.S23.M02
module_name: gradual_change_guard
phase: phase_03_agents_rag_memory
subphase: P3.S23
status: implemented_qualified_internal
function: Validar o candidato de estado sem recalcular ou reparar, aplicando imutabilidade,
  caps temporais, field-change correspondence e evidência de tool proficiency.
inputs:
- next_person_state_panel
- current_person_state_panel
- person_schema_policy
- state_change_config
outputs:
- validated_next_person_state_panel
validations:
- delta_caps
- immutable_fields
- bounded_state
- change_reason_present
- declared_change_set_matches_actual_diff
- state_version_transition
- belief_refs_append_only
- tool_proficiency_requires_executed_call
invariants:
- point_in_time_integrity
- lineage_traceability
- single_responsibility
- no_hidden_global_state
- no_same_cycle_back_edge
- no_silent_repair
non_responsibilities:
- Não recalcular transição.
- Não clamar ou reparar valores acima de caps.
- Não persistir diretamente.
fail_fast_conditions:
- gradual_change_guard_schema_violation
- duplicate_person_state
- transition_before_prior_state
- undeclared_state_family
forbidden_fields:
- future_return
- candidate_score
- rank_score
- portfolio_weight
- trade_decision
- buy_sell_signal
allowed_connections:
  consumes_from:
    modules:
    - P3.S4.M02
    - P3.S11.M03
    - P3.S23.M01
    artifacts:
    - next_person_state_panel
    - current_person_state_panel
    - person_schema_policy
    - state_change_config
    phase_inputs:
    - state_change_config
  emits_to:
    modules:
    - P3.S24.M01
    - P3.S25.M01
    - P3.S26.M01
    - P3.S26.M03
    - P3.S27.M02
    - P3.S28.M01
    artifacts:
    - validated_next_person_state_panel
    phase_outputs: []
temporal_inputs: []
tests_required:
- large_delta_fails
- immutable_field_change_fails
- declared_change_mismatch_fails
- tool_proficiency_without_execution_fails
- no_change_state_accepted
definition_of_done:
- runtime_implemented
- schemas_generated_from_models
- unit_contract_integration_replay_tests_passing
- outputs_match_original_io
- no_undeclared_side_effects
- qualified_local_evidence_present
notes:
- Implementation, contract, executable tests and documentation are synchronized in
  the final release.
contract_version: p3.s23.module.v1
owner_prompt: subphases/P3_S23_person_state_transition_persistence.md
implementation_boundary:
  owns:
  - Validation and acceptance/rejection of candidate person states.
  must_not_absorb:
  - Candidate transition calculation
  - Persistence implementation
  - Trust or memory updates
  state_mutation_policy: read_only_validation
observability_requirements:
  events:
  - module_started
  - input_contract_validated
  - module_succeeded
  - module_failed
  dimensions:
  - run_id
  - cycle_id
  - module_id
  - as_of_time
  - contract_version
  - lineage_id
  metrics:
  - duration_ms
  - input_record_count
  - output_record_count
  - warning_count
  - error_count
  redaction:
  - credentials
  - provider_secrets
  - private_tool_payloads
debugging_contract:
  triage_order:
  - verify_declared_inputs_materialized
  - verify_schema_and_version
  - verify_candidate_prior_link
  - verify_immutable_fields
  - verify_actual_diff_vs_declared_changes
  - verify_delta_caps
  - verify_output_schema_and_forbidden_fields
  error_codes:
  - P3_S23_M02_INPUT_INVALID
  - P3_S23_M02_TEMPORAL_VIOLATION
  - P3_S23_M02_IMMUTABLE_FIELD
  - P3_S23_M02_DELTA_CAP
  - P3_S23_M02_OUTPUT_INVALID
  fallback_policy: no_silent_fallback_or_repair
change_control:
  safe_surfaces:
  - implementation
  - configuration
  - tests
  - documentation
  contract_change_requires:
  - schema_update
  - io_matrix_update
  - tests_update
  - documentation_update
  - consumer_acceptance
  one_change_experiment_required_when_retro_managed: true
review_checklist:
- responsibility_is_single_and_bounded
- inputs_and_outputs_match_io_matrix
- no_forbidden_authority
- temporal_semantics_are_explicit
- no_silent_repair
- tests_cover_happy_negative_boundary_lineage_observability
rc: RC4.1
forbidden_connections:
- any_connection_not_listed_in_CONNECTIONS_ALLOWED
- future_phase_output_consumption
- hidden_global_state
- same_cycle_back_edge
- direct_P3_to_P5_P6_P7_P8
implementation_target: src/quant_pipeline/phase_03_agents_rag_memory/modules/P3_S23_M02_gradual_change_guard.py
unit_test_target: tests/phase_specific/test_p3_s23_m02_gradual_change_guard.py
integration_test_target: tests/phase_specific/test_p3_s23_integration.py
implementation_status_policy:
  current: IMPLEMENTED_QUALIFIED_INTERNAL
  allowed_progression:
  - NOT_IMPLEMENTED
  - IMPLEMENTED_QUALIFIED_INTERNAL
  - QUALIFIED_LOCAL
  - QUALIFIED_P0
  production_claim_requires: QUALIFIED_P0
  qualification_required: false
  production_promotion_allowed: false
  runtime_fail_closed: true
documentation_target: docs/runtime/modules/P3_S23_M02.md
qualification_scope: LOCAL_AND_INTEGRATION_CONTRACTS; EXTERNAL_PROVIDER_AND_P0_GATES_SEPARATE
integration_revision: P3-FINAL
qualification_evidence:
  python_test_target: tests/phase_specific/test_p3_s23_m02_gradual_change_guard.py
  integration_test_target: tests/phase_specific/test_p3_s23_integration.py
  canonical_entrypoint: execute(inputs, ModuleExecutionContext)
  profile_aware: true
implementation_status: QUALIFIED_LOCAL
production_promotion_allowed: false
final_integration:
  gate: P3.CALIBRATION
  criticality: MEDIA_ALTA
  required_change: Calibrar limites de mudança gradual por variável e regime; provar
    que não bloqueiam mudanças legítimas.
  evidence_artifacts:
  - population_calibration_bundle
  - social_graph_calibration_report
  - activation_trust_sensitivity_report
  mandatory_tests:
  - teste positivo com artefatos reais/versionados
  - teste negativo de leakage, hash ou schema incompatível
  - sensibilidade por seed e versão
  - stress de starvation/runaway feedback
  - comparação com benchmark observado
  acceptance: Implementação real + evidência hash-linked + testes positivos/negativos
    + gate anterior PASS
  rollback: Schema/version bump reversível; preservar artefatos antigos; rollback
    validado em cópia pristine
  qualification_policy: REAL_PIPELINE_ONLY_FAIL_CLOSED
  production_promotion_authority: P0_ONLY
