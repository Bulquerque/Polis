schema_id: p3.research_tools.plan_registry_config.v1
schema_version: 1.0.0
registry_version: 1.0.0
plans:
- plan_id: QUICK_RETAIL_RESEARCH
  title: Quick retail research
  description: Low-cost public-data review for a time-constrained retail persona.
  subject_kinds: [COMPANY, INSTRUMENT]
  maximum_visible_calls_per_cycle: 5
  continuation_allowed: true
  nodes:
  - node_id: corpus_lookup
    tool_id: research.corpus.v1
    operation_id: search
    requested_mode: LOOKUP
    required: true
    predecessors: []
    stop_conditions: [NO_PUBLIC_EVIDENCE]
    downgrade_policy: BLOCK
    visible_call_cost: 1
    priority: 10
  - node_id: market_snapshot
    tool_id: market.observation.v1
    operation_id: get_snapshot
    requested_mode: OBSERVE
    required: false
    predecessors: [corpus_lookup]
    stop_conditions: [INSTRUMENT_UNRESOLVED]
    downgrade_policy: SKIP_OPTIONAL
    visible_call_cost: 1
    priority: 20
  - node_id: company_profile
    tool_id: company.fundamentals.v1
    operation_id: get_profile
    requested_mode: QUICK_CHECK
    required: false
    predecessors: [corpus_lookup]
    stop_conditions: [UPSTREAM_BLOCKED]
    downgrade_policy: SKIP_OPTIONAL
    visible_call_cost: 1
    priority: 30
  - node_id: return_summary
    tool_id: quant.diagnostics.v1
    operation_id: return_statistics
    requested_mode: BASIC
    required: false
    predecessors: [market_snapshot]
    stop_conditions: [INSUFFICIENT_HISTORY]
    downgrade_policy: SKIP_OPTIONAL
    visible_call_cost: 1
    priority: 40

