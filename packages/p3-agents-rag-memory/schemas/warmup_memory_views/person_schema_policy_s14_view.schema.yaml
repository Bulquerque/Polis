$defs:
  MemoryType:
    enum:
    - EPISODIC
    - SEMANTIC
    - PROCEDURAL
    - SOCIAL
    title: MemoryType
    type: string
  VisibilityScope:
    enum:
    - SELF
    - SOCIAL_VISIBLE
    - PUBLIC
    - AUDIT_ONLY
    title: VisibilityScope
    type: string
additionalProperties: false
properties:
  schema_id:
    const: person_schema_policy_s14_view.v1
    default: person_schema_policy_s14_view.v1
    title: Schema Id
    type: string
  schema_version:
    const: 1.0.0
    default: 1.0.0
    title: Schema Version
    type: string
  policy_id:
    minLength: 1
    title: Policy Id
    type: string
  person_schema_version:
    minLength: 1
    title: Person Schema Version
    type: string
  allowed_memory_types:
