    type: array
  allowed_visibility_scopes:
    items:
      $ref: '#/$defs/VisibilityScope'
    title: Allowed Visibility Scopes
    type: array
  content_hash:
    pattern: ^[0-9a-f]{64}$
    title: Content Hash
    type: string
  lineage_id:
    minLength: 1
    title: Lineage Id
    type: string
required:
- policy_id
- person_schema_version
- allowed_memory_types
- allowed_visibility_scopes
- content_hash
- lineage_id
