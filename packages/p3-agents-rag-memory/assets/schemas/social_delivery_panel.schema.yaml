$defs:
  ArtifactStatus:
    enum:
    - READY
    - DEGRADED
    - BLOCKED
    - FAILED
    - EMPTY_VALID
    title: ArtifactStatus
    type: string
  ChannelVisibility:
    enum:
    - DECLARED
    - HIDDEN
    title: ChannelVisibility
    type: string
  DeliveryStatus:
    enum:
    - QUEUED
    - UNDELIVERED
    - EXPIRED
    - FAILED
    title: DeliveryStatus
    type: string
  LineageRecord:
    additionalProperties: false
    properties:
      lineage_id:
        minLength: 1
        title: Lineage Id
        type: string
      source_artifact_ids:
        default: []
        items:
          minLength: 1
          type: string
        title: Source Artifact Ids
        type: array
      source_hashes:
        additionalProperties:
          minLength: 1
          type: string
        propertyNames:
          minLength: 1
        title: Source Hashes
        type: object
      producer_module_id:
        minLength: 1
        title: Producer Module Id
        type: string
    required:
    - lineage_id
    - producer_module_id
    title: LineageRecord
    type: object
  SocialDeliveryRecord:
    additionalProperties: false
    properties:
      delivery_id:
        minLength: 1
        title: Delivery Id
        type: string
      message_id:
        minLength: 1
        title: Message Id
        type: string
      run_id:
        minLength: 1
        title: Run Id
        type: string
      source_cycle_id:
        minLength: 1
        title: Source Cycle Id
        type: string
      target_cycle_id:
        minLength: 1
        title: Target Cycle Id
        type: string
      cognition_transaction_id:
        minLength: 1
        title: Cognition Transaction Id
        type: string
      sender_person_id:
        minLength: 1
        title: Sender Person Id
        type: string
      recipient_person_id:
        minLength: 1
        title: Recipient Person Id
        type: string
      channel_id:
        minLength: 1
        title: Channel Id
        type: string
      channel_visibility:
        $ref: '#/$defs/ChannelVisibility'
      relationship_id:
        anyOf:
        - minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Relationship Id
      status:
        $ref: '#/$defs/DeliveryStatus'
      scheduled_for:
        anyOf:
        - format: date-time
          type: string
        - type: 'null'
        default: null
        title: Scheduled For
      delivery_window_end:
        format: date-time
        title: Delivery Window End
        type: string
      latency_seconds:
        minimum: 0
        title: Latency Seconds
        type: integer
      delivery_attempt:
        const: 0
        default: 0
        title: Delivery Attempt
        type: integer
      idempotency_key:
        minLength: 1
        title: Idempotency Key
        type: string
      reason_codes:
        default: []
        items:
          minLength: 1
          type: string
        title: Reason Codes
        type: array
    required:
    - delivery_id
    - message_id
    - run_id
    - source_cycle_id
    - target_cycle_id
    - cognition_transaction_id
    - sender_person_id
    - recipient_person_id
    - channel_id
    - channel_visibility
    - status
    - delivery_window_end
    - latency_seconds
    - idempotency_key
    title: SocialDeliveryRecord
    type: object
additionalProperties: false
properties:
  schema_version:
    const: p3.s24.v1
    default: p3.s24.v1
    title: Schema Version
    type: string
  status:
    $ref: '#/$defs/ArtifactStatus'
    default: READY
  records:
    items:
      $ref: '#/$defs/SocialDeliveryRecord'
    title: Records
    type: array
  lineage:
    $ref: '#/$defs/LineageRecord'
  reason_code:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    title: Reason Code
required:
- records
- lineage
title: SocialDeliveryPanel
type: object
$schema: https://json-schema.org/draft/2020-12/schema
artifact_name: social_delivery_panel
schema_id: social_delivery_panel.p3.s24.v1
status: implemented_internal_schema
artifact_schema_version: 1.0.0
schema_version: v14.1-rc4.1
