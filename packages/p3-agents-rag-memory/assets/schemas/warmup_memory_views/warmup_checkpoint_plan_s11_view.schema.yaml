$defs:
  ArtifactStatus:
    enum:
    - READY
    - DEGRADED
    - BLOCKED
    - FAILED
    title: ArtifactStatus
    type: string
  CheckpointReason:
    enum:
    - MONTHLY_BOUNDARY
    - FINAL_REPLAY_BOUNDARY
    - GENESIS
    title: CheckpointReason
    type: string
  PlannedCheckpoint:
    additionalProperties: false
    properties:
      checkpoint_id:
        minLength: 1
        title: Checkpoint Id
        type: string
      sequence_number:
        exclusiveMinimum: 0
        title: Sequence Number
        type: integer
      after_schedule_sequence_number:
        minimum: 0
        title: After Schedule Sequence Number
        type: integer
      logical_time:
        format: date-time
        title: Logical Time
        type: string
      reason:
        $ref: '#/$defs/CheckpointReason'
      previous_checkpoint_id:
        anyOf:
        - minLength: 1
          type: string
        - type: 'null'
        title: Previous Checkpoint Id
      required_state_families:
        items:
          minLength: 1
          type: string
        title: Required State Families
        type: array
      final:
        title: Final
        type: boolean
    required:
    - checkpoint_id
    - sequence_number
    - after_schedule_sequence_number
    - logical_time
    - reason
    - previous_checkpoint_id
    - required_state_families
    - final
    title: PlannedCheckpoint
    type: object
  WarmupMode:
    enum:
    - HISTORICAL_REPLAY
    - GENESIS_ONLY
    title: WarmupMode
    type: string
additionalProperties: false
properties:
  schema_id:
    const: warmup_checkpoint_plan.v2
    title: Schema Id
    type: string
  schema_version:
    const: 2.0.0
    title: Schema Version
    type: string
  artifact_id:
    minLength: 1
    title: Artifact Id
    type: string
  module_id:
    const: P3.S10.M02
    title: Module Id
    type: string
  run_id:
    minLength: 1
    title: Run Id
    type: string
  snapshot_id:
    minLength: 1
    title: Snapshot Id
    type: string
  as_of:
    format: date-time
    title: As Of
    type: string
  evaluation_start:
    format: date-time
    title: Evaluation Start
    type: string
  mode:
    $ref: '#/$defs/WarmupMode'
  status:
    $ref: '#/$defs/ArtifactStatus'
  schedule_hash:
    pattern: ^[0-9a-f]{64}$
    title: Schedule Hash
    type: string
  checkpoint_config_hash:
    pattern: ^[0-9a-f]{64}$
    title: Checkpoint Config Hash
    type: string
  checkpoints:
    items:
      $ref: '#/$defs/PlannedCheckpoint'
    title: Checkpoints
    type: array
  final_checkpoint_id:
    minLength: 1
    title: Final Checkpoint Id
    type: string
  final_checkpoint_time:
    format: date-time
    title: Final Checkpoint Time
    type: string
  resume_supported:
    title: Resume Supported
    type: boolean
  plan_hash:
    pattern: ^[0-9a-f]{64}$
    title: Plan Hash
    type: string
  lineage:
    additionalProperties: true
    title: Lineage
    type: object
  issues:
    default: []
    items:
      additionalProperties: true
      type: object
    title: Issues
    type: array
required:
- schema_id
- schema_version
- artifact_id
- module_id
- run_id
- snapshot_id
- as_of
- evaluation_start
- mode
- status
- schedule_hash
- checkpoint_config_hash
- checkpoints
- final_checkpoint_id
- final_checkpoint_time
- resume_supported
- plan_hash
- lineage
title: WarmupCheckpointPlanView
type: object
