    type: array
  lineage_id:
    minLength: 1
    title: Lineage Id
    type: string
  source_bundle_refs:
    default: []
    items:
      $ref: '#/$defs/ArtifactRef'
    title: Source Bundle Refs
    type: array
required:
- history_id
- mode
- records
- lineage_id
title: WarmupHistoryBundle
type: object
