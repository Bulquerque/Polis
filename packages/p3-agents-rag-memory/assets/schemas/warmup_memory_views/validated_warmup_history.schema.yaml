$defs:
  ArtifactRef:
    additionalProperties: false
    properties:
      artifact_id:
        minLength: 1
        title: Artifact Id
        type: string
      artifact_type:
        minLength: 1
        title: Artifact Type
        type: string
      content_hash:
        pattern: ^[0-9a-f]{64}$
        title: Content Hash
        type: string
      schema_id:
        anyOf:
        - minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Schema Id
      schema_version:
        anyOf:
        - minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Schema Version
    required:
    - artifact_id
    - artifact_type
    - content_hash
    title: ArtifactRef
    type: object
  DatasetPartition:
    enum:
    - WARMUP
    - TRAIN
    - VALIDATION
    - EVALUATION
    - HOLDOUT
    - TEST
    title: DatasetPartition
    type: string
  HistoryRecord:
    additionalProperties: false
    properties:
      history_record_id:
        minLength: 1
        title: History Record Id
        type: string
      event_id:
        minLength: 1
        title: Event Id
        type: string
      source_id:
        minLength: 1
        title: Source Id
        type: string
      partition:
        $ref: '#/$defs/DatasetPartition'
      event_time:
        format: date-time
        title: Event Time
        type: string
      effective_time:
        anyOf:
        - format: date-time
          type: string
        - type: 'null'
        default: null
        title: Effective Time
      available_at:
        format: date-time
        title: Available At
        type: string
      ingested_at:
        format: date-time
        title: Ingested At
        type: string
      payload_ref:
        $ref: '#/$defs/ArtifactRef'
      underlyings:
        default: []
        items:
          minLength: 1
          type: string
        title: Underlyings
        type: array
      propositions:
        default: []
        items:
          minLength: 1
          type: string
        title: Propositions
        type: array
      lineage:
        $ref: '#/$defs/RecordLineage'
    required:
    - history_record_id
    - event_id
    - source_id
    - partition
    - event_time
    - available_at
    - ingested_at
    - payload_ref
    - lineage
    title: HistoryRecord
    type: object
  OutputLineage:
    additionalProperties: false
    properties:
      lineage_id:
        minLength: 1
        title: Lineage Id
        type: string
      input_history_id:
        minLength: 1
        title: Input History Id
        type: string
      input_history_hash:
        pattern: ^[0-9a-f]{64}$
        title: Input History Hash
        type: string
      input_snapshot_id:
        minLength: 1
        title: Input Snapshot Id
        type: string
      input_snapshot_hash:
        anyOf:
        - pattern: ^[0-9a-f]{64}$
          type: string
        - type: 'null'
        default: null
        title: Input Snapshot Hash
      source_artifact_ids:
        items:
          minLength: 1
          type: string
        title: Source Artifact Ids
        type: array
      source_lineage_ids:
        items:
          minLength: 1
          type: string
        title: Source Lineage Ids
        type: array
    required:
    - lineage_id
    - input_history_id
    - input_history_hash
    - input_snapshot_id
    - source_artifact_ids
    - source_lineage_ids
    title: OutputLineage
    type: object
  RecordLineage:
    additionalProperties: false
    properties:
      lineage_id:
        minLength: 1
        title: Lineage Id
        type: string
      source_artifact_ids:
        default: []
        items:
          minLength: 1
          type: string
        title: Source Artifact Ids
        type: array
      parent_lineage_ids:
        default: []
        items:
          minLength: 1
          type: string
        title: Parent Lineage Ids
        type: array
      holdout_refs:
        default: []
        items:
          minLength: 1
          type: string
        title: Holdout Refs
        type: array
    required:
    - lineage_id
    title: RecordLineage
    type: object
  ValidationIssueModel:
    additionalProperties: false
    properties:
      code:
        minLength: 1
        title: Code
        type: string
      severity:
        enum:
        - INFO
        - WARNING
        title: Severity
        type: string
      message:
        minLength: 1
        title: Message
        type: string
      path:
        minLength: 1
        title: Path
        type: string
    required:
    - code
    - severity
    - message
    - path
    title: ValidationIssueModel
    type: object
  ValidationStatus:
    enum:
    - READY
    - DEGRADED
    title: ValidationStatus
    type: string
  ValidationSummary:
    additionalProperties: false
    properties:
      input_record_count:
        title: Input Record Count
        type: integer
      output_record_count:
        title: Output Record Count
        type: integer
      unique_event_count:
        title: Unique Event Count
        type: integer
      unique_source_count:
        title: Unique Source Count
        type: integer
      earliest_available_at:
        anyOf:
        - format: date-time
          type: string
        - type: 'null'
        title: Earliest Available At
      latest_available_at:
        anyOf:
        - format: date-time
          type: string
        - type: 'null'
        title: Latest Available At
      rejected_record_count:
        const: 0
        default: 0
        title: Rejected Record Count
        type: integer
    required:
    - input_record_count
    - output_record_count
    - unique_event_count
    - unique_source_count
    - earliest_available_at
    - latest_available_at
    title: ValidationSummary
    type: object
  WarmupMode:
    enum:
    - HISTORICAL_REPLAY
    - GENESIS_ONLY
    title: WarmupMode
    type: string
additionalProperties: false
properties:
  schema_id:
    const: validated_warmup_history.v1
    default: validated_warmup_history.v1
    title: Schema Id
    type: string
  schema_version:
    const: 1.0.0
    default: 1.0.0
    title: Schema Version
    type: string
  artifact_id:
    minLength: 1
    title: Artifact Id
    type: string
  module_id:
    const: P3.S9.M01
    default: P3.S9.M01
    title: Module Id
    type: string
  run_id:
    minLength: 1
    title: Run Id
    type: string
  snapshot_id:
    minLength: 1
    title: Snapshot Id
    type: string
  as_of:
    format: date-time
    title: As Of
    type: string
  mode:
    $ref: '#/$defs/WarmupMode'
  status:
    $ref: '#/$defs/ValidationStatus'
  evaluation_start:
    format: date-time
    title: Evaluation Start
    type: string
  warmup_start:
    anyOf:
    - format: date-time
      type: string
    - type: 'null'
    title: Warmup Start
  warmup_end:
    anyOf:
    - format: date-time
      type: string
    - type: 'null'
    title: Warmup End
  records:
    items:
      $ref: '#/$defs/HistoryRecord'
    title: Records
    type: array
  history_hash:
    pattern: ^[0-9a-f]{64}$
    title: History Hash
    type: string
  lineage:
    $ref: '#/$defs/OutputLineage'
  validation_summary:
    $ref: '#/$defs/ValidationSummary'
  issues:
    default: []
    items:
      $ref: '#/$defs/ValidationIssueModel'
    title: Issues
    type: array
required:
- artifact_id
- run_id
- snapshot_id
- as_of
- mode
- status
- evaluation_start
- warmup_start
- warmup_end
- records
- history_hash
- lineage
- validation_summary
title: ValidatedWarmupHistory
type: object
