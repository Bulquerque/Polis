$defs:
  PersonDynamicStatus:
    enum:
    - ACTIVE
    - INACTIVE
    title: PersonDynamicStatus
    type: string
  PersonStateRecord:
    additionalProperties: false
    properties:
      person_id:
        minLength: 1
        title: Person Id
        type: string
      structural_profile_hash:
        pattern: ^[0-9a-f]{64}$
        title: Structural Profile Hash
        type: string
      representation_weight:
        maximum: 1.0
        minimum: 0.0
        title: Representation Weight
        type: number
      status:
        $ref: '#/$defs/PersonDynamicStatus'
      attention:
        maximum: 1.0
        minimum: 0.0
        title: Attention
        type: number
      fatigue:
        maximum: 1.0
        minimum: 0.0
        title: Fatigue
        type: number
      last_updated_at:
        format: date-time
        title: Last Updated At
        type: string
    required:
    - person_id
    - structural_profile_hash
    - representation_weight
    - status
    - attention
    - fatigue
    - last_updated_at
    title: PersonStateRecord
    type: object
additionalProperties: false
properties:
  schema_id:
    const: current_person_state_panel.v2
    default: current_person_state_panel.v2
    title: Schema Id
    type: string
  schema_version:
    const: 2.0.0
    default: 2.0.0
    title: Schema Version
    type: string
  artifact_id:
    minLength: 1
    title: Artifact Id
    type: string
  module_id:
    const: P3.S11.M03
    default: P3.S11.M03
    title: Module Id
    type: string
  run_id:
    minLength: 1
    title: Run Id
    type: string
  snapshot_id:
    minLength: 1
    title: Snapshot Id
    type: string
  cycle_id:
    minLength: 1
    title: Cycle Id
    type: string
  cycle_number:
    exclusiveMinimum: 0
    title: Cycle Number
