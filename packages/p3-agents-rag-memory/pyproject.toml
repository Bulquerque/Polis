[build-system]
requires = ["setuptools>=82,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-pipeline-p3"
version = "1.0.0"
description = "Integrated P3 runtime: governed foundation, synthetic society cycle, memory, RAG, tools and cross-phase outputs."
requires-python = ">=3.13,<3.15"
dependencies = [
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "cryptography==46.0.7",
]

[project.optional-dependencies]
api = ["httpx==0.28.1"]
mcp = ["mcp==1.29.0"]
parquet = ["pyarrow==25.0.0"]
neo4j = ["neo4j==6.2.0"]
observability = ["opentelemetry-api==1.44.0", "opentelemetry-sdk==1.44.0"]
redis = ["redis>=7,<8"]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "hypothesis>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.18,<2",
  "coverage==7.15.2",
  "numpy==2.4.6",
  "scipy==1.17.1",
]
all = [
  "httpx==0.28.1",
  "mcp==1.29.0",
  "pyarrow==25.0.0",
  "neo4j==6.2.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "redis>=7,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant_pipeline*"]

[tool.setuptools.package-data]
"quant_pipeline.phase_03_agents_rag_memory" = [
  "assets/**/*.yaml",
  "assets/**/*.yml",
  "assets/**/*.json",
  "assets/**/*.md",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["unit", "contract", "integration", "property", "replay", "pit", "live_api", "slow"]

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["src/quant_pipeline/phase_03_agents_rag_memory"]

[tool.coverage.run]
branch = true
source = ["src/quant_pipeline/phase_03_agents_rag_memory"]

[project.scripts]
p3 = "quant_pipeline.phase_03_agents_rag_memory.orchestration.cli:main"
