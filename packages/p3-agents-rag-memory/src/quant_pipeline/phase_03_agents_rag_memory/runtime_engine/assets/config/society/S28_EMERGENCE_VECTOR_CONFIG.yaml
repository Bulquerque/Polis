vector_id: P3_UNDERLYING_SOCIETY_VECTOR_V2
vector_version: p3.s28.vector.v1
formula_version: p3.s28.formulas.v1
grain:
  - underlying_id
  - proposition_id
  - horizon
  - as_of_time
missing_grain_policy: MATERIAL_MISSING
required_metric_paths:
  - belief.belief_mean
  - belief.belief_variance
  - belief.belief_entropy
  - belief.belief_polarization
  - belief.bullish_share
  - belief.bearish_share
  - dynamics.belief_update_velocity_per_day
  - dynamics.belief_reversal_rate
  - attention.attention_intensity
  - attention.attention_concentration
  - social.mean_cascade_size
  - social.mean_cascade_depth
  - social.social_contagion
  - social.influence_concentration
  - information.information_asymmetry
  - information.expert_nonexpert_divergence
  - information.institutional_disagreement
  - tag_projection.top_tag_divergence
  - tag_projection.top_tag_conditioned_shift
  - tag_projection.active_tag_projection_count
  - tag_projection.suppressed_tag_projection_count
required_source_artifacts:
  - belief_distribution_panel
  - attention_information_metrics
  - cascade_metrics_panel
  - tag_projection_panel
max_feature_count: 32
source_quality_aggregation: MINIMUM
uncertainty_formula: MAX_BELIEF_STD_INFORMATION_ASYMMETRY_COVERAGE_GAPS
quality_score_formula: WEIGHTED_DIMENSION_SCORE
quality_weights:
  completeness: 0.25
  source_quality: 0.25
  coverage: 0.25
  uncertainty_complement: 0.25
thresholds:
  min_active_person_count_pass: 4
  min_active_person_count_degraded: 2
  min_effective_n_pass: 3.0
  min_effective_n_degraded: 1.5
  min_population_coverage_pass: 0.6
  min_population_coverage_degraded: 0.25
  min_belief_coverage_pass: 0.6
  min_belief_coverage_degraded: 0.25
  min_causal_coverage_pass: 0.7
  min_causal_coverage_degraded: 0.3
  min_source_quality_pass: 0.8
  min_source_quality_degraded: 0.5
  min_metric_completeness_pass: 0.9
  min_metric_completeness_degraded: 0.7
  max_uncertainty_pass: 0.4
  max_uncertainty_degraded: 0.75
forbidden_direct_targets:
  - future_return
  - candidate_score
  - rank_score
  - portfolio_weight
  - trade_decision
  - buy_sell_signal
