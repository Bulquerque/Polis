$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:quant-pipeline:p3:s2:pit-validated-context:v2
title: pit_validated_context
artifact_name: pit_validated_context
schema_id: pit_validated_context.v2
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required:
- schema_version
- contract_version
- validation_status
- run_temporal_boundary
- source_validated_context_hash
- artifact_views
- temporal_records
- summary
- issues
- lineage_id
- content_hash
properties:
  schema_version:
    const: v14.1-rc4.1
  contract_version:
    const: p3.s2.pit_validated_context.v2
  validation_status:
    enum:
    - READY
    - DEGRADED
  run_temporal_boundary:
    type: object
    additionalProperties: false
    required:
    - as_of_time
    - as_of
    - evaluation_start
    - evaluation_end
    - warmup_start
    - warmup_end
    - timezone
    - boundary_rule
    properties:
      as_of:
        $ref: '#/$defs/nullable_datetime'
        not:
          type: 'null'
      evaluation_start:
        $ref: '#/$defs/nullable_datetime'
      evaluation_end:
        $ref: '#/$defs/nullable_datetime'
      warmup_start:
        $ref: '#/$defs/nullable_datetime'
      warmup_end:
        $ref: '#/$defs/nullable_datetime'
      timezone:
        const: UTC
      boundary_rule:
        const: available_at_equal_as_of_allowed
      as_of_time:
        $ref: '#/$defs/nullable_datetime'
        not:
          type: 'null'
  source_validated_context_hash:
    type: string
    pattern: ^[0-9a-f]{64}$
  artifact_views:
    type: array
    minItems: 3
    maxItems: 3
    items:
      $ref: '#/$defs/artifact_view'
  temporal_records:
    type: array
    items:
      $ref: '#/$defs/temporal_record'
  summary:
    type: object
    additionalProperties: false
    required:
    - accepted
    - rejected_future
    - missing_temporal
    - total_considered
    properties:
      accepted:
        type: integer
        minimum: 0
      rejected_future:
        type: integer
        minimum: 0
      missing_temporal:
        type: integer
        minimum: 0
      total_considered:
        type: integer
        minimum: 0
  issues:
    type: array
    items:
      $ref: '#/$defs/issue'
  lineage_id:
    type: string
    minLength: 1
  content_hash:
    type: string
    pattern: ^[0-9a-f]{64}$
$defs:
  nullable_datetime:
    type:
    - string
    - 'null'
    format: date-time
  artifact_reference:
    type: object
    additionalProperties: false
    required:
    - artifact_name
    - artifact_id
    - schema_id
    - schema_version
    - schema_binding
    - content_hash
    - lineage_id
    - pipeline_version
    - grain
    - row_count
    - validation_status
    - schema_sha256
    - schema_authority
    - schema_authority_path
    properties:
      artifact_name:
        enum:
        - clean_context_source_panel
        - clean_document_panel
        - clean_event_reference_panel
        - source_quality_panel
      artifact_id:
        type: string
        minLength: 1
      schema_id:
        type: string
        minLength: 1
      schema_version:
        type: string
        minLength: 1
      schema_binding:
        const: EXTERNAL_AUTHORITY
      content_hash:
        type: string
        pattern: ^[0-9a-f]{64}$
      lineage_id:
        type: string
        minLength: 1
      pipeline_version:
        type: string
        minLength: 1
      grain:
        type: array
        items:
          type: string
          minLength: 1
        uniqueItems: true
      row_count:
        type: integer
        minimum: 0
      validation_status:
        const: READY
      schema_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      schema_authority:
        type: string
        minLength: 1
      schema_authority_path:
        type: string
        minLength: 1
  artifact_view:
    type: object
    additionalProperties: false
    required:
    - source_artifact_ref
    - observed_content_hash
    - accepted_record_ids
    - rejected_future_record_ids
    - quarantined_missing_temporal_record_ids
    - accepted_count
    - rejected_future_count
    - missing_temporal_count
    - available_at_min
    - available_at_max
    properties:
      source_artifact_ref:
        $ref: '#/$defs/artifact_reference'
      observed_content_hash:
        type: string
        pattern: ^[0-9a-f]{64}$
      accepted_record_ids:
        type: array
        items:
          type: string
          minLength: 1
        uniqueItems: true
      rejected_future_record_ids:
        type: array
        items:
          type: string
          minLength: 1
        uniqueItems: true
      quarantined_missing_temporal_record_ids:
        type: array
        items:
          type: string
          minLength: 1
        uniqueItems: true
      accepted_count:
        type: integer
        minimum: 0
      rejected_future_count:
        type: integer
        minimum: 0
      missing_temporal_count:
        type: integer
        minimum: 0
      available_at_min:
        $ref: '#/$defs/nullable_datetime'
      available_at_max:
        $ref: '#/$defs/nullable_datetime'
  temporal_record:
    type: object
    additionalProperties: false
    required:
    - artifact_name
    - artifact_id
    - record_id
    - source_id
    - event_time
    - effective_time
    - available_at
    - ingested_at
    - temporal_evidence_class
    - decision
    - quality_decision
    properties:
      artifact_name:
        enum:
        - clean_context_source_panel
        - clean_document_panel
        - clean_event_reference_panel
      artifact_id:
        type: string
        minLength: 1
      record_id:
        type: string
        minLength: 1
      source_id:
        type:
        - string
        - 'null'
      event_time:
        $ref: '#/$defs/nullable_datetime'
      effective_time:
        $ref: '#/$defs/nullable_datetime'
      available_at:
        $ref: '#/$defs/nullable_datetime'
      temporal_evidence_class:
        enum:
        - RECORD_LEVEL_TEMPORAL
        - ARTIFACT_LEVEL_TEMPORAL
        - RESOLVED_BY_REFERENCE
        - MISSING_TEMPORAL_EVIDENCE
      decision:
        enum:
        - ACCEPTED
        - REJECTED_FUTURE
        - QUARANTINED_MISSING_TEMPORAL
      quality_decision:
        enum:
        - ACCEPTED
        - ACCEPTED_WITH_WARNING
      ingested_at:
        $ref: '#/$defs/nullable_datetime'
  issue:
    type: object
    additionalProperties: false
    required:
    - code
    - severity
    - message
    - artifact_name
    - record_id
    - field
    properties:
      code:
        type: string
        minLength: 1
      severity:
        enum:
        - INFO
        - WARNING
        - ERROR
        - BLOCKING
      message:
        type: string
        minLength: 1
      artifact_name:
        type:
        - string
        - 'null'
      record_id:
        type:
        - string
        - 'null'
      field:
        type:
        - string
        - 'null'
