  half_life_days: 30
  max_per_query: 6
- memory_type: SEMANTIC
  enabled: true
  half_life_days: 180
  max_per_query: 8
- memory_type: PROCEDURAL
  enabled: true
  half_life_days: 365
  max_per_query: 4
- memory_type: SOCIAL
  enabled: true
  half_life_days: 90
  max_per_query: 4
scope_policies:
- visibility_scope: SELF
  retrievable: true
  requires_relationship: false
  audit_only: false
- visibility_scope: SOCIAL_VISIBLE
  retrievable: true
  requires_relationship: true
  audit_only: false
- visibility_scope: PUBLIC
  retrievable: true
  requires_relationship: false
  audit_only: false
- visibility_scope: AUDIT_ONLY
  retrievable: false
  requires_relationship: false
