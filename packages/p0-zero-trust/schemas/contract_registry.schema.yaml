schema_id: contract_registry.v1
artifact_name: contract_registry
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields:
- artifact_id
- created_at
- pipeline_version
- lineage_id
- contracts_source_path
- global_contracts_source_path
- contract_count
- global_contract_count
- contracts
- global_contracts
- contract_has_source_target
- shared_artifacts_have_schema
- contract_identity_valid
- contract_hash_valid
- connection_graph_valid
- validation_evidence_status
- promotion_blocked
properties:
  artifact_id:
    type: string
    pattern: ^contract-registry-[0-9a-f]{12}$
  created_at:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
  pipeline_version:
    type: string
    const: V14.1-RC4.1
  lineage_id:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  contracts_source_path: {type: string}
  global_contracts_source_path: {type: string}
  contract_count: {type: integer, minimum: 40, maximum: 268}
  global_contract_count: {type: integer, minimum: 17, maximum: 17}
  contracts:
    type: array
    minItems: 40
    maxItems: 268
    items:
      type: object
      additionalProperties: false
      required_fields:
      - contract_id
      - module_id
      - module_name
      - phase
      - subphase
      - contract_path
      - contract_sha256
      - inputs
      - outputs
      - consumes_from
      - emits_to
      - output_schemas
      properties:
        contract_id: {type: string}
        module_id: {type: string, pattern: '^P[0-9]+\.S[0-9]+\.M[0-9]+$'}
        module_name: {type: string}
        phase: {type: string}
        subphase: {type: string}
        contract_path: {type: string}
        contract_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        inputs: {type: array, items: {type: string}}
        outputs: {type: array, items: {type: string}}
        consumes_from:
          type: object
          additionalProperties: false
          required_fields: [modules, artifacts, phase_inputs]
          properties:
            modules: {type: array, items: {type: string}}
            artifacts: {type: array, items: {type: string}}
            phase_inputs: {type: array, items: {type: string}}
        emits_to:
          type: object
          additionalProperties: false
          required_fields: [modules, artifacts, phase_outputs]
          properties:
            modules: {type: array, items: {type: string}}
            artifacts: {type: array, items: {type: string}}
            phase_outputs: {type: array, items: {type: string}}
        output_schemas:
          type: array
          items:
            type: object
            additionalProperties: false
            required_fields: [artifact, schema_path, schema_sha256]
            properties:
              artifact: {type: string}
              schema_path: {type: string}
              schema_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  global_contracts:
    type: array
    minItems: 17
    maxItems: 17
    items:
      type: object
      additionalProperties: false
      required_fields:
      - contract_id
      - contract_path
      - contract_sha256
      - producer
      - consumer
      - artifacts
      - schemas
      properties:
        contract_id: {type: string}
        contract_path: {type: string}
        contract_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        producer: {type: string}
        consumer: {type: string}
        artifacts: {type: array, minItems: 1, items: {type: string}}
        schemas:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required_fields: [artifact, schema_path, schema_sha256]
            properties:
              artifact: {type: string}
              schema_path: {type: string}
              schema_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  contract_has_source_target: {type: boolean, const: true}
  shared_artifacts_have_schema: {type: boolean, const: true}
  contract_identity_valid: {type: boolean, const: true}
  contract_hash_valid: {type: boolean, const: true}
  connection_graph_valid: {type: boolean, const: true}
  validation_evidence_status:
    type: string
    const: domain_oracle_pass_pending_independent_judge
  promotion_blocked: {type: boolean, const: true}
forbidden_fields:
- future_return
- target
- candidate_score
- trade_decision
- rank_score
- portfolio_weight
- realized_pnl
