schema_id: collected_phase_dashboard_payloads.v2
artifact_name: collected_phase_dashboard_payloads
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields: [artifact_id, created_at, pipeline_version, lineage_id, phase_count, phases, source_lineage_ids, source_freshness, state_conflicts, status, blocking_sources, release_blocking, promotion_blocked]
properties:
  artifact_id: {type: string, pattern: '^collected-phase-dashboard-payloads-[0-9a-f]{12}$'}
  created_at: {type: string}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  phase_count: {type: integer, minimum: 1}
  phases: {type: array, minItems: 1, items: {type: object}}
  source_lineage_ids: {type: array, minItems: 2, items: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}}
  source_freshness: {type: string, enum: [CURRENT, STALE, CONFLICTING, UNKNOWN]}
  state_conflicts: {type: array, items: {type: object}}
  status: {type: string, enum: [PASS, FAIL]}
  blocking_sources: {type: array, items: {type: string}}
  release_blocking: {type: boolean}
  promotion_blocked: {type: boolean, const: true}
forbidden_fields: [future_return, target, candidate_score, trade_decision, rank_score, portfolio_weight, realized_pnl]
