schema_id: validated_connection_matrix.v1
artifact_name: validated_connection_matrix
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields:
- artifact_id
- created_at
- pipeline_version
- lineage_id
- source_path
- phase
- rc
- contract
- format
- phase_registry_lineage_id
- module_registry_lineage_id
- module_io_matrix
- connections
- module_count
- connection_count
- registry_identity_valid
- dependency_reciprocity_valid
- artifact_flow_valid
- economic_connections_allowed_only
- zero_trust_plane_metadata_only
- validation_evidence_status
- promotion_blocked
properties:
  artifact_id:
    type: string
    pattern: ^validated-connection-matrix-[0-9a-f]{12}$
  created_at:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
  pipeline_version:
    type: string
    const: V14.1-RC4.1
  lineage_id:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  source_path:
    type: string
    minLength: 1
  phase:
    type: string
    pattern: ^P[0-9]+$
  rc:
    type: string
    const: RC4.1
  contract:
    type: string
    const: MODULE_IO_MATRIX
  format:
    type: string
    const: compact_contract_v4
  phase_registry_lineage_id:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  module_registry_lineage_id:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  module_io_matrix:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required_fields:
      - module_id
      - module_name
      - subphase
      - consumes_from
      - emits_to
      - module_contract
      properties:
        module_id:
          type: string
          pattern: ^P[0-9]+\.S[0-9]+\.M[0-9]+$
        module_name:
          type: string
          minLength: 1
        subphase:
          type: string
          pattern: ^P[0-9]+\.S[0-9]+$
        consumes_from:
          type: object
          additionalProperties: false
          required_fields:
          - modules
          - artifacts
          - phase_inputs
          properties:
            modules:
              type: array
              items:
                type: string
                pattern: ^P[0-9]+\.S[0-9]+\.M[0-9]+$
            artifacts:
              type: array
              items:
                type: string
                minLength: 1
            phase_inputs:
              type: array
              items:
                type: string
                minLength: 1
        emits_to:
          type: object
          additionalProperties: false
          required_fields:
          - modules
          - artifacts
          - phase_outputs
          properties:
            modules:
              type: array
              items:
                type: string
                pattern: ^P[0-9]+\.S[0-9]+\.M[0-9]+$
            artifacts:
              type: array
              items:
                type: string
                minLength: 1
            phase_outputs:
              type: array
              items:
                type: string
                minLength: 1
        module_contract:
          type: string
          pattern: ^modules/P[0-9]+_S[0-9]+_M[0-9]+_[A-Za-z0-9_]+\.yaml$
  module_count:
    type: integer
    minimum: 1
  connections:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required_fields:
      - source_module
      - target_module
      properties:
        source_module:
          type: string
          pattern: ^P[0-9]+\.S[0-9]+\.M[0-9]+$
        target_module:
          type: string
          pattern: ^P[0-9]+\.S[0-9]+\.M[0-9]+$
  connection_count:
    type: integer
    minimum: 0
  registry_identity_valid:
    type: boolean
    const: true
  dependency_reciprocity_valid:
    type: boolean
    const: true
  artifact_flow_valid:
    type: boolean
    const: true
  economic_connections_allowed_only:
    type: boolean
    const: true
  zero_trust_plane_metadata_only:
    type: boolean
    const: true
  validation_evidence_status:
    type: string
    const: domain_oracle_pass_pending_independent_judge
  promotion_blocked:
    type: boolean
    const: true
forbidden_fields:
- future_return
- target
- candidate_score
- trade_decision
- rank_score
- portfolio_weight
- realized_pnl
