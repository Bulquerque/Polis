schema_id: dashboard_static_site.v2
artifact_name: dashboard_static_site
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields: [artifact_id, created_at, pipeline_version, lineage_id, format, entrypoint, content_sha256, source_payload_lineage_id, file_entries, materialized, status, release_blocking, promotion_blocked]
properties:
  artifact_id: {type: string, pattern: '^dashboard-static-site-[0-9a-f]{12}$'}
  created_at: {type: string}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  format: {type: string, const: html}
  entrypoint: {type: string, const: index.html}
  content_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  source_payload_lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  file_entries: {type: array, minItems: 4, items: {type: object}}
  materialized: {type: boolean}
  status: {type: string, enum: [PASS, FAIL]}
  release_blocking: {type: boolean}
  promotion_blocked: {type: boolean, const: true}
forbidden_fields: [future_return, target, candidate_score, trade_decision, rank_score, portfolio_weight, realized_pnl]
