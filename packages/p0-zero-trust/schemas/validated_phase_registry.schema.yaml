schema_id: validated_phase_registry.v1
artifact_name: validated_phase_registry
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields:
- artifact_id
- created_at
- pipeline_version
- lineage_id
- source_path
- architecture_source_path
- registry_id
- architecture_authority
- phase_count
- phases
- phase_id_unique
- phase_type_declared
- registry_id_declared
- package_name_declared
- global_architecture_config_valid
- registry_version_compatible
- validation_evidence_status
- promotion_blocked
properties:
  artifact_id:
    type: string
    pattern: ^validated-phase-registry-[0-9a-f]{12}$
  created_at:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
  pipeline_version:
    type: string
    const: V14.1-RC4.1
  lineage_id:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  source_path:
    type: string
    minLength: 1
  architecture_source_path:
    type: string
    minLength: 1
  registry_id:
    type: string
    pattern: ^phase_registry_v14_1_rc4_1$
  architecture_authority:
    type: string
    minLength: 1
  phase_count:
    type: integer
    minimum: 1
  phases:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required_fields:
      - phase_id
      - package_name
      - plane
      properties:
        phase_id:
          type: string
          pattern: ^P[0-9]+$
        package_name:
          type: string
          minLength: 1
        plane:
          type: string
          enum:
          - zero_trust_control
          - economic_pipeline
  phase_id_unique:
    type: boolean
    const: true
  phase_type_declared:
    type: boolean
    const: true
  registry_id_declared:
    type: boolean
    const: true
  package_name_declared:
    type: boolean
    const: true
  global_architecture_config_valid:
    type: boolean
    const: true
  registry_version_compatible:
    type: boolean
    const: true
  validation_evidence_status:
    type: string
    const: domain_oracle_pass_pending_independent_judge
  promotion_blocked:
    type: boolean
    const: true
forbidden_fields:
- future_return
- target
- candidate_score
- trade_decision
- rank_score
- portfolio_weight
- realized_pnl
