schema_id: phase_health_panel.v2
artifact_name: phase_health_panel
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields: [artifact_id, created_at, pipeline_version, lineage_id, phase_count, phases, phase_statuses, source_reports, development_summary, test_summary, qualification_summary, integrity_summary, health_status, status, critical_errors, warnings, readiness_status, release_blocking, promotion_blocked]
properties:
  artifact_id: {type: string, pattern: '^phase-health-panel-[0-9a-f]{12}$'}
  created_at: {type: string}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  phase_count: {type: integer, minimum: 1}
  phases: {type: array, minItems: 1, items: {type: object}}
  phase_statuses: {type: array, minItems: 1, items: {type: object}}
  source_reports: {type: array, minItems: 4, maxItems: 4, items: {type: object}}
  development_summary: {type: object}
  test_summary: {type: object}
  qualification_summary: {type: object}
  integrity_summary: {type: object}
  health_status: {type: string, enum: [UNKNOWN, HEALTHY, WARNING, CRITICAL]}
  status: {type: string, enum: [PASS, FAIL]}
  critical_errors: {type: array, items: {type: string}}
  warnings: {type: array, items: {type: string}}
  readiness_status: {type: string, enum: [READY, NOT_READY]}
  release_blocking: {type: boolean}
  promotion_blocked: {type: boolean, const: true}
forbidden_fields: [future_return, target, candidate_score, trade_decision, rank_score, portfolio_weight, realized_pnl]
