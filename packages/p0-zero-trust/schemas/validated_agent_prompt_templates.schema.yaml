schema_id: validated_agent_prompt_templates.v1
artifact_name: validated_agent_prompt_templates
schema_version: v14.1-rc4.1
type: object
required_fields: [artifact_id, created_at, pipeline_version, lineage_id, templates, template_count, source_sha256, rules_sha256, status, release_blocking, promotion_blocked]
properties:
  artifact_id: {type: string}
  created_at: {type: string}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  templates:
    type: array
    minItems: 1
    items:
      type: object
      required: [template_id, skill_id, skill_version, phase_scope, module_scope, requested_permissions, system_prompt_sha256, normalized_prompt_sha256, skill_definition_sha256, status]
  template_count: {type: integer, minimum: 1}
  source_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  rules_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  skill_registry_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  skill_registry_lineage_id: {type: string}
  status: {const: PASS}
  release_blocking: {const: false}
  promotion_blocked: {const: true}
forbidden_fields: [future_return, target, candidate_score, rank_score, portfolio_weight, realized_pnl, trade_decision]
