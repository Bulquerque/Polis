schema_id: agent_execution_policy.v1
artifact_name: agent_execution_policy
schema_version: v14.1-rc4.1
type: object
required_fields: [artifact_id, created_at, pipeline_version, lineage_id, definition_of_done, required_tests, required_package_files, permissions, policies, governance_policy_version, governance_policy_sha256, code_standards, testing_standards, status, release_blocking, promotion_blocked]
properties:
  artifact_id: {type: string}
  created_at: {type: string}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  definition_of_done: {type: array, minItems: 1}
  required_tests: {type: array, minItems: 1}
  required_package_files: {type: array, minItems: 1}
  permissions: {type: object}
  policies: {type: array, minItems: 1}
  policy_count: {type: integer, minimum: 1}
  governance_policy_version: {type: string}
  governance_policy_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  package_limits: {type: object}
  require_agent_manifest: {type: boolean}
  code_standards: {type: object}
  testing_standards: {type: object}
  status: {const: PASS}
  release_blocking: {const: false}
  promotion_blocked: {const: true}
forbidden_fields: [future_return, target, candidate_score, rank_score, portfolio_weight, realized_pnl, trade_decision]
