schema_id: contract_test_report.v1
artifact_name: contract_test_report
schema_version: v14.1-rc4.1
type: object
required_fields:
- artifact_id
- created_at
- pipeline_version
- lineage_id
- contract_count
- total_tests
- passed_tests
- failed_tests
- tests
- status
- release_blocking
- contract_tests_declared
- connection_contracts_tested
- forbidden_connections_tested
- forbidden_policy_delegated_to
properties:
  created_at:
    type: string
  passed_tests:
    type: integer
    minimum: 0
  failed_tests:
    type: integer
    minimum: 0
  status:
    type: string
    enum:
    - PASS
    - FAIL
  release_blocking:
    type: boolean
  artifact_id:
    type: string
    pattern: ^contract-test-report-[0-9a-f]{12}$
  pipeline_version:
    type: string
    const: V14.1-RC4.1
  lineage_id:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  contract_count:
    type: integer
    minimum: 1
  total_tests:
    type: integer
    minimum: 1
  tests:
    type: array
    minItems: 1
  contract_tests_declared:
    type: boolean
    const: true
  forbidden_connections_tested:
    type: boolean
  connection_contracts_tested:
    type: boolean
    const: true
  forbidden_policy_delegated_to:
    type: string
    const: P0.S1.M05
forbidden_fields:
- future_return
- target
- candidate_score
- trade_decision
- rank_score
- portfolio_weight
- realized_pnl
