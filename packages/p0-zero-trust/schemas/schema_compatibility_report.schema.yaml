schema_id: schema_compatibility_report.v1
artifact_name: schema_compatibility_report
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields:
- artifact_id
- created_at
- pipeline_version
- lineage_id
- contract_registry_lineage_id
- schema_registry_lineage_id
- checked_authority_schema_count
- schema_checks
- compatible_schema_count
- incompatible_schema_count
- required_fields_compatible
- required_types_compatible
- findings
- finding_count
- status
- release_blocking
- validation_evidence_status
- promotion_blocked
properties:
  artifact_id: {type: string, pattern: '^schema-compatibility-report-[0-9a-f]{12}$'}
  created_at: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  contract_registry_lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  schema_registry_lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  checked_authority_schema_count: {type: integer}
  schema_checks:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required_fields: [producer, artifact, schema_id, schema_path, schema_sha256, required_fields, field_types, mirror_status, status, release_blocking]
      properties:
        producer: {type: string}
        artifact: {type: string}
        schema_id: {type: string}
        schema_path: {type: string}
        schema_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        required_fields: {type: array, minItems: 1, items: {type: string}}
        field_types:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required_fields: [field_name, type_name]
            properties:
              field_name: {type: string}
              type_name: {type: string}
        mirror_status: {type: string, enum: [MATCH, DIVERGED, MISSING]}
        status: {type: string, enum: [COMPATIBLE, INCOMPATIBLE]}
        release_blocking: {type: boolean}
  compatible_schema_count: {type: integer}
  incompatible_schema_count: {type: integer}
  required_fields_compatible: {type: boolean}
  required_types_compatible: {type: boolean}
  findings:
    type: array
    items:
      type: object
      additionalProperties: false
      required_fields: [finding_id, code, severity, scope, artifact, producer, consumer, message, release_blocking]
      properties:
        finding_id: {type: string}
        code: {type: string}
        severity: {type: string, const: CRITICAL}
        scope: {type: string}
        artifact: {type: string}
        producer: {type: string}
        consumer: {type: string}
        message: {type: string}
        release_blocking: {type: boolean, const: true}
  finding_count: {type: integer}
  status: {type: string, enum: [PASS, FAIL]}
  release_blocking: {type: boolean}
  validation_evidence_status:
    type: string
    enum: [domain_oracle_pass_pending_independent_judge, domain_oracle_failed]
  promotion_blocked: {type: boolean, const: true}
forbidden_fields:
- future_return
- target
- candidate_score
- trade_decision
- rank_score
- portfolio_weight
- realized_pnl
