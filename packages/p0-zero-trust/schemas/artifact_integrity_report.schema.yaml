schema_id: artifact_integrity_report.v1
artifact_name: artifact_integrity_report
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields:
- artifact_id
- created_at
- pipeline_version
- lineage_id
- manifest_sources
- artifact_registry_source
- hash_integrity_source
- lineage_integrity_source
- manifest_count
- manifest_entry_count
- unique_manifest_path_count
- registered_artifact_count
- covered_registry_artifact_count
- finding_count
- duplicate_count
- missing_file_count
- missing_hash_count
- hash_mismatch_count
- disallowed_algorithm_count
- unregistered_count
- uncovered_registry_count
- critical_missing_count
- upstream_blocking_count
- manifest_documents_readable
- all_manifest_targets_exist
- critical_declared_count
- critical_materialized_count
- critical_hash_valid_count
- findings
- status
- severity
- release_blocking
- manifest_file_exists
- critical_file_present
- coverage_complete
- hashes_valid
- paths_internal
- validation_evidence_status
- promotion_blocked
- component_statuses
- integrity_summary
properties:
  artifact_id:
    type: string
    pattern: ^artifact-integrity-report-[0-9a-f]{12}$
  created_at:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
  pipeline_version:
    type: string
    const: V14.1-RC4.1
  lineage_id:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  manifest_sources:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  artifact_registry_source:
    type: string
    minLength: 1
  hash_integrity_source:
    type: string
    minLength: 1
  lineage_integrity_source:
    type: string
    minLength: 1
  manifest_count:
    type: integer
    minimum: 1
  manifest_entry_count:
    type: integer
    minimum: 1
  unique_manifest_path_count:
    type: integer
    minimum: 1
  registered_artifact_count:
    type: integer
    minimum: 1
  covered_registry_artifact_count:
    type: integer
    minimum: 0
  finding_count:
    type: integer
    minimum: 0
  duplicate_count:
    type: integer
    minimum: 0
  missing_file_count:
    type: integer
    minimum: 0
  missing_hash_count:
    type: integer
    minimum: 0
  hash_mismatch_count:
    type: integer
    minimum: 0
  disallowed_algorithm_count:
    type: integer
    minimum: 0
  unregistered_count:
    type: integer
    minimum: 0
  uncovered_registry_count:
    type: integer
    minimum: 0
  critical_missing_count:
    type: integer
    minimum: 0
  upstream_blocking_count:
    type: integer
    minimum: 0
  findings:
    type: array
    items:
      type: object
      additionalProperties: false
      required_fields:
      - finding_id
      - code
      - path
      - manifest_source
      - detail
      - severity
      - release_blocking
      properties:
        finding_id:
          type: string
          pattern: ^MA-[0-9]{6}$
        code:
          type: string
          enum:
          - DUPLICATE_MANIFEST_ENTRY
          - MISSING_FILE
          - MISSING_OR_MALFORMED_HASH
          - HASH_MISMATCH
          - DISALLOWED_HASH_ALGORITHM
          - UNREGISTERED_MANIFEST_ARTIFACT
          - REGISTRY_ARTIFACT_UNCOVERED
          - CRITICAL_FILE_ABSENT
          - UPSTREAM_HASH_INTEGRITY_BLOCKED
          - UPSTREAM_LINEAGE_INTEGRITY_BLOCKED
          - CRITICAL_FILE_NOT_MATERIALIZED
          - CRITICAL_FILE_HASH_INVALID
        path:
          type: string
        manifest_source:
          type: string
          minLength: 1
        detail:
          type: string
          minLength: 1
        severity:
          type: string
          const: CRITICAL
        release_blocking:
          type: boolean
          const: true
  status:
    type: string
    enum:
    - PASS
    - FAIL
  severity:
    type: string
    enum:
    - NONE
    - CRITICAL
  release_blocking:
    type: boolean
  manifest_file_exists:
    type: boolean
  critical_file_present:
    type: boolean
  coverage_complete:
    type: boolean
  hashes_valid:
    type: boolean
  paths_internal:
    type: boolean
    const: true
  validation_evidence_status:
    type: string
    const: domain_oracle_pass_pending_independent_judge
  promotion_blocked:
    type: boolean
    const: true
  manifest_documents_readable:
    type: boolean
    const: true
  all_manifest_targets_exist:
    type: boolean
  critical_declared_count:
    type: integer
    minimum: 0
  critical_materialized_count:
    type: integer
    minimum: 0
  critical_hash_valid_count:
    type: integer
    minimum: 0
  component_statuses:
    type: object
    additionalProperties: false
    required_fields:
    - manifest
    - hash
    - lineage
    properties:
      manifest:
        type: string
        enum:
        - PASS
        - FAIL
      hash:
        type: string
        enum:
        - PASS
        - FAIL
      lineage:
        type: string
        enum:
        - PASS
        - FAIL
  integrity_summary:
    type: string
    enum:
    - PASS
    - FAIL
forbidden_fields:
- future_return
- target
- candidate_score
- trade_decision
- rank_score
- portfolio_weight
- realized_pnl
