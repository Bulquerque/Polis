schema_id: dashboard_json_payloads.v2
artifact_name: dashboard_json_payloads
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields: [artifact_id, created_at, pipeline_version, lineage_id, format, payload_sha256, payloads, file_entries, status, release_blocking, promotion_blocked]
properties:
  artifact_id: {type: string, pattern: '^dashboard-json-payloads-[0-9a-f]{12}$'}
  created_at: {type: string}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  format: {type: string, const: json}
  payload_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  payloads: {type: object}
  file_entries: {type: array, minItems: 4, items: {type: object}}
  status: {type: string, enum: [PASS, FAIL]}
  release_blocking: {type: boolean}
  promotion_blocked: {type: boolean, const: true}
forbidden_fields: [future_return, target, candidate_score, trade_decision, rank_score, portfolio_weight, realized_pnl]
