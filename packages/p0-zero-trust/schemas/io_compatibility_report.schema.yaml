schema_id: io_compatibility_report.v1
artifact_name: io_compatibility_report
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields:
- artifact_id
- created_at
- pipeline_version
- lineage_id
- contract_registry_lineage_id
- connection_matrix_lineage_id
- checked_contract_count
- checked_matrix_module_count
- checked_matrix_connection_count
- compatibility_checks
- compatible_check_count
- optional_check_count
- incompatible_check_count
- output_covers_required_input
- optional_feedback_not_blocking
- findings
- finding_count
- status
- release_blocking
- validation_evidence_status
- promotion_blocked
properties:
  artifact_id: {type: string, pattern: '^io-compatibility-report-[0-9a-f]{12}$'}
  created_at: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  contract_registry_lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  connection_matrix_lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  checked_contract_count: {type: integer}
  checked_matrix_module_count: {type: integer}
  checked_matrix_connection_count: {type: integer}
  compatibility_checks:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required_fields: [producer, consumer, artifact, source_kind, status, release_blocking, message]
      properties:
        producer: {type: string}
        consumer: {type: string}
        artifact: {type: string}
        source_kind: {type: string, enum: [module_output, phase_input, optional_feedback]}
        status: {type: string, enum: [COMPATIBLE, INCOMPATIBLE, OPTIONAL]}
        release_blocking: {type: boolean}
        message: {type: string}
  compatible_check_count: {type: integer}
  optional_check_count: {type: integer}
  incompatible_check_count: {type: integer}
  output_covers_required_input: {type: boolean}
  optional_feedback_not_blocking: {type: boolean, const: true}
  findings:
    type: array
    items:
      type: object
      additionalProperties: false
      required_fields: [finding_id, code, severity, scope, artifact, producer, consumer, message, release_blocking]
      properties:
        finding_id: {type: string}
        code: {type: string}
        severity: {type: string, const: CRITICAL}
        scope: {type: string}
        artifact: {type: string}
        producer: {type: string}
        consumer: {type: string}
        message: {type: string}
        release_blocking: {type: boolean, const: true}
  finding_count: {type: integer}
  status: {type: string, enum: [PASS, FAIL]}
  release_blocking: {type: boolean}
  validation_evidence_status:
    type: string
    enum: [domain_oracle_pass_pending_independent_judge, domain_oracle_failed]
  promotion_blocked: {type: boolean, const: true}
forbidden_fields:
- future_return
- target
- candidate_score
- trade_decision
- rank_score
- portfolio_weight
- realized_pnl
