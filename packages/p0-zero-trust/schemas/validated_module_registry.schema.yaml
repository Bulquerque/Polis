schema_id: validated_module_registry.v1
artifact_name: validated_module_registry
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields:
- artifact_id
- created_at
- pipeline_version
- lineage_id
- source_path
- registry_id
- module_count
- modules
- module_id_unique
- module_has_contract
- module_parent_valid
- contract_identity_valid
- contract_hash_valid
- registry_version_compatible
- validation_evidence_status
- promotion_blocked
properties:
  artifact_id:
    type: string
    pattern: ^validated-module-registry-[0-9a-f]{12}$
  created_at:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
  pipeline_version:
    type: string
    const: V14.1-RC4.1
  lineage_id:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  source_path:
    type: string
    minLength: 1
  registry_id:
    type: string
    const: module_registry_v14_1_rc4_1
  module_count:
    type: integer
    minimum: 40
    maximum: 268
  modules:
    type: array
    minItems: 40
    maxItems: 268
    items:
      type: object
      additionalProperties: false
      required_fields:
      - module_id
      - module_name
      - phase_id
      - subphase_id
      - contract_path
      - contract_sha256
      properties:
        module_id:
          type: string
          pattern: ^P[0-9]+\.S[0-9]+\.M[0-9]+$
        module_name:
          type: string
          minLength: 1
        phase_id:
          type: string
          pattern: ^P[0-9]+$
        subphase_id:
          type: string
          pattern: ^P[0-9]+\.S[0-9]+$
        contract_path:
          type: string
          pattern: ^phase_[^/]+/[^/]+/(?:modules|contracts/(?:modules|foundation/modules|s[0-9]+/modules|economic/modules))/P[0-9]+_S[0-9]+_M[0-9]+_[A-Za-z0-9_]+\.yaml$
        contract_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
  module_id_unique:
    type: boolean
    const: true
  module_has_contract:
    type: boolean
    const: true
  module_parent_valid:
    type: boolean
    const: true
  contract_identity_valid:
    type: boolean
    const: true
  contract_hash_valid:
    type: boolean
    const: true
  registry_version_compatible:
    type: boolean
    const: true
  validation_evidence_status:
    type: string
    const: domain_oracle_pass_pending_independent_judge
  promotion_blocked:
    type: boolean
    const: true
forbidden_fields:
- future_return
- target
- candidate_score
- trade_decision
- rank_score
- portfolio_weight
- realized_pnl
