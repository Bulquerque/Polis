schema_id: global_control_tower_payload.v2
artifact_name: global_control_tower_payload
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields: [artifact_id, created_at, pipeline_version, lineage_id, phase_count, phase_statuses, development_summary, test_summary, qualification_summary, integrity_summary, alert_summary, readiness_summary, zero_trust_summary, schema_status, hash_status, release_readiness, blocking_sources, status, release_blocking, promotion_blocked]
properties:
  artifact_id: {type: string, pattern: '^global-control-tower-payload-[0-9a-f]{12}$'}
  created_at: {type: string}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  phase_count: {type: integer, minimum: 1}
  phase_statuses: {type: array, minItems: 1, items: {type: object}}
  development_summary: {type: object}
  test_summary: {type: object}
  qualification_summary: {type: object}
  integrity_summary: {type: object}
  alert_summary: {type: object}
  readiness_summary: {type: object}
  zero_trust_summary: {type: object}
  schema_status: {type: string, enum: [PASS, FAIL, UNKNOWN]}
  hash_status: {type: string, enum: [PASS, FAIL, UNKNOWN]}
  release_readiness: {type: string, enum: [READY, BLOCKED]}
  blocking_sources: {type: array, items: {type: string}}
  status: {type: string, enum: [PASS, FAIL]}
  release_blocking: {type: boolean}
  promotion_blocked: {type: boolean, const: true}
forbidden_fields: [future_return, target, candidate_score, trade_decision, rank_score, portfolio_weight, realized_pnl]
