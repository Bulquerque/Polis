schema_id: zero_trust_health_report.v2
artifact_name: zero_trust_health_report
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields: [artifact_id, created_at, pipeline_version, lineage_id, zero_trust_summary, status, source_reports, blocking_sources, release_blocking, promotion_blocked]
properties:
  artifact_id: {type: string, pattern: '^zero-trust-health-report-[0-9a-f]{12}$'}
  created_at: {type: string}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  zero_trust_summary: {type: object}
  status: {type: string, enum: [PASS, FAIL]}
  source_reports: {type: array, minItems: 4, maxItems: 4, items: {type: object}}
  blocking_sources: {type: array, items: {type: string}}
  release_blocking: {type: boolean}
  promotion_blocked: {type: boolean, const: true}
forbidden_fields: [future_return, target, candidate_score, trade_decision, rank_score, portfolio_weight, realized_pnl]
