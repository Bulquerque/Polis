schema_id: code_quality_report.v1
artifact_name: code_quality_report
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields: [artifact_id, created_at, pipeline_version, lineage_id, source_report_count, source_reports, blocking_report_count, blocking_reports, quality_status, status, phases, blocking_quality_issue, release_blocking, validation_evidence_status, promotion_blocked]
properties:
  artifact_id: {type: string, pattern: '^code-quality-report-[0-9a-f]{12}$'}
  created_at: {type: string}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  source_report_count: {type: integer, const: 5}
  source_reports: {type: array, minItems: 5, items: {type: object, additionalProperties: false, required_fields: [report_name, producer_module_id, artifact_id, lineage_id, status, release_blocking], properties: {report_name: {type: string}, producer_module_id: {type: string}, artifact_id: {type: string}, lineage_id: {type: string}, status: {type: string, enum: [PASS, FAIL]}, release_blocking: {type: boolean}}}}
  blocking_report_count: {type: integer, minimum: 0}
  blocking_reports: {type: array, items: {type: string}}
  quality_status: {type: string, enum: [PASS, FAIL]}
  status: {type: string, enum: [PASS, FAIL]}
  phases:
    type: array
    minItems: 10
    items:
      type: object
      additionalProperties: false
      required_fields: [phase_id, status, findings]
      properties:
        phase_id: {type: string, pattern: '^P[0-9]$'}
        status: {type: string, enum: [PASS, FAIL]}
        findings: {type: array}
  blocking_quality_issue: {type: boolean}
  release_blocking: {type: boolean}
  validation_evidence_status: {type: string, const: domain_oracle_pass_pending_independent_judge}
  promotion_blocked: {type: boolean, const: true}
forbidden_fields: [future_return, target, candidate_score, trade_decision, rank_score, portfolio_weight, realized_pnl]
