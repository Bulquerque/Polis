schema_id: forbidden_field_report.v1
artifact_name: forbidden_field_report
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields:
- artifact_id
- created_at
- pipeline_version
- lineage_id
- schema_registry_source
- artifact_registry_source
- policy_source
- schema_registry_lineage_id
- policy_field_count
- scanned_schema_count
- scanned_artifact_count
- scanned_document_count
- field_occurrence_count
- allowed_exception_count
- violation_count
- target_inference_violation_count
- rank_score_pre_p7_violation_count
- other_forbidden_violation_count
- violations
- status
- severity
- release_blocking
- target_not_in_inference
- rank_score_not_before_phase7
- recursive_scan_complete
- validation_evidence_status
- promotion_blocked
properties:
  artifact_id: {type: string, pattern: '^forbidden-field-report-[0-9a-f]{12}$'}
  created_at: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  schema_registry_source: {type: string, minLength: 1}
  artifact_registry_source: {type: string, minLength: 1}
  policy_source: {type: string, minLength: 1}
  schema_registry_lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  policy_field_count: {type: integer, minimum: 2}
  scanned_schema_count: {type: integer, minimum: 1}
  scanned_artifact_count: {type: integer, minimum: 0}
  scanned_document_count: {type: integer, minimum: 1}
  field_occurrence_count: {type: integer, minimum: 0}
  allowed_exception_count: {type: integer, minimum: 0}
  violation_count: {type: integer, minimum: 0}
  target_inference_violation_count: {type: integer, minimum: 0}
  rank_score_pre_p7_violation_count: {type: integer, minimum: 0}
  other_forbidden_violation_count: {type: integer, minimum: 0}
  violations:
    type: array
    items:
      type: object
      additionalProperties: false
      required_fields:
      - violation_id
      - code
      - severity
      - field_name
      - phase_id
      - source_kind
      - source_id
      - schema_id
      - location
      - message
      - release_blocking
      properties:
        violation_id: {type: string, pattern: '^FF-[0-9]{4}$'}
        code: {type: string, enum: [TARGET_IN_INFERENCE, RANK_SCORE_BEFORE_P7, FORBIDDEN_FIELD_PRESENT]}
        severity: {type: string, const: CRITICAL}
        field_name: {type: string, minLength: 1}
        phase_id: {type: string, pattern: '^P[0-9]+$'}
        source_kind: {type: string, enum: [schema, artifact]}
        source_id: {type: string, minLength: 1}
        schema_id: {type: string, minLength: 1}
        location: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
        release_blocking: {type: boolean, const: true}
  status: {type: string, enum: [PASS, FAIL]}
  severity: {type: string, enum: [NONE, CRITICAL]}
  release_blocking: {type: boolean}
  target_not_in_inference: {type: boolean}
  rank_score_not_before_phase7: {type: boolean}
  recursive_scan_complete: {type: boolean, const: true}
  validation_evidence_status: {type: string, const: domain_oracle_pass_pending_independent_judge}
  promotion_blocked: {type: boolean, const: true}
forbidden_fields:
- future_return
- target
- candidate_score
- trade_decision
- rank_score
- portfolio_weight
- realized_pnl
