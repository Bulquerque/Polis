schema_id: schema_registry.v1
artifact_name: schema_registry
schema_version: v14.1-rc4.1
type: object
additionalProperties: false
required_fields:
- artifact_id
- created_at
- pipeline_version
- lineage_id
- authority_root
- inventory_count
- authority_schema_count
- mirror_count
- mirror_match_count
- mirror_divergence_count
- hashed_file_count
- schemas
- mirrors
- findings
- status
- severity
- release_blocking
- schema_id_unique
- required_fields_not_empty
- artifact_name_unique
- schema_version_consistent
- properties_types_consistent
- inventory_complete
- hashes_computed
- mirror_authority_enforced
- validation_evidence_status
- promotion_blocked
properties:
  artifact_id: {type: string, pattern: '^schema-registry-[0-9a-f]{12}$'}
  created_at: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'}
  pipeline_version: {type: string, const: V14.1-RC4.1}
  lineage_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  authority_root: {type: string, const: global_contracts_parallel_agents/v14_1_global_contracts_parallel_agents_RC4_1}
  inventory_count: {type: integer, minimum: 1}
  authority_schema_count: {type: integer, minimum: 1}
  mirror_count: {type: integer, minimum: 1}
  mirror_match_count: {type: integer, minimum: 0}
  mirror_divergence_count: {type: integer, minimum: 0}
  hashed_file_count: {type: integer, minimum: 1}
  schemas:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required_fields:
      - schema_id
      - artifact_name
      - schema_version
      - path
      - sha256
      - required_fields
      - structure_mode
      - property_count
      properties:
        schema_id: {type: string, minLength: 1}
        artifact_name: {type: string, minLength: 1}
        schema_version: {type: string, const: v14.1-rc4.1}
        path: {type: string, minLength: 1}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        required_fields: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        structure_mode: {type: string, enum: [typed_properties, legacy_required_fields]}
        property_count: {type: integer, minimum: 0}
  mirrors:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required_fields:
      - path
      - authority_path
      - sha256
      - authority_sha256
      - status
      - content_relation
      properties:
        path: {type: string, minLength: 1}
        authority_path: {type: string, minLength: 1}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        authority_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        status: {type: string, enum: [MATCH, DIVERGED]}
        content_relation: {type: string, enum: [EXACT, COMPATIBLE_EXTENSION]}
  findings:
    type: array
    items:
      type: object
      additionalProperties: false
      required_fields:
      - finding_id
      - code
      - severity
      - mirror_path
      - authority_path
      - expected_hash
      - actual_hash
      - message
      - release_blocking
      properties:
        finding_id: {type: string, pattern: '^SR-[0-9]{4}$'}
        code: {type: string, enum: [MIRROR_POLICY_DIVERGENCE]}
        severity: {type: string, const: CRITICAL}
        mirror_path: {type: string, minLength: 1}
        authority_path: {type: string, minLength: 1}
        expected_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        actual_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        message: {type: string, minLength: 1}
        release_blocking: {type: boolean, const: true}
  status: {type: string, enum: [PASS, FAIL]}
  severity: {type: string, enum: [NONE, CRITICAL]}
  release_blocking: {type: boolean}
  schema_id_unique: {type: boolean, const: true}
  required_fields_not_empty: {type: boolean, const: true}
  artifact_name_unique: {type: boolean, const: true}
  schema_version_consistent: {type: boolean, const: true}
  properties_types_consistent: {type: boolean, const: true}
  inventory_complete: {type: boolean, const: true}
  hashes_computed: {type: boolean, const: true}
  mirror_authority_enforced: {type: boolean, const: true}
  validation_evidence_status: {type: string, const: domain_oracle_pass_pending_independent_judge}
  promotion_blocked: {type: boolean, const: true}
forbidden_fields:
- future_return
- target
- candidate_score
- trade_decision
- rank_score
- portfolio_weight
- realized_pnl
