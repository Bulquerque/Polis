module_id: P0.S1.M04
module_name: connection_matrix_validator
function: Executar connection matrix validator da Fase 0, mantendo controle Zero Trust
  técnico e sem tocar no fluxo econômico.
inputs: &id001
- connection_matrix_yaml
- validated_phase_registry
- validated_module_registry
outputs: &id002
- validated_connection_matrix
validations:
- economic_connections_allowed_only
- zero_trust_plane_metadata_only
fail_fast_conditions:
- connection_matrix_validator_critical_failure
forbidden_fields:
- future_return
- target
- candidate_score
- rank_score
- portfolio_weight
- realized_pnl
- trade_decision
allowed_connections:
  consumes_from:
    modules:
    - P0.S1.M01
    - P0.S1.M03
    artifacts: *id001
    phase_inputs:
    - connection_matrix_yaml
  emits_to:
    modules:
    - P0.S1.M05
    - P0.S2.M03
    artifacts: *id002
    phase_outputs: []
phase: P0
subphase: P0.S1
rc: RC4.1
notes: Canonical P0 module contract; the matrix remains the IO authority.
