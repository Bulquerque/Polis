module_id: P0.S1.M05
module_name: forbidden_connection_detector
function: Executar forbidden connection detector da Fase 0, mantendo controle Zero
  Trust técnico e sem tocar no fluxo econômico.
inputs: &id001
- validated_connection_matrix
- forbidden_connection_matrix_yaml
- module_io_matrix_all_phases
outputs: &id002
- forbidden_connection_report
validations:
- no_forbidden_economic_connection
- phase0_not_economic_input
fail_fast_conditions:
- forbidden_connection_detector_critical_failure
forbidden_fields:
- future_return
- target
- candidate_score
- rank_score
- portfolio_weight
- realized_pnl
- trade_decision
allowed_connections:
