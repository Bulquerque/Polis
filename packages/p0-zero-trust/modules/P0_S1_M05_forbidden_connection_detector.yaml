    - P0.S1.M04
    artifacts: *id001
    phase_inputs:
    - forbidden_connection_matrix_yaml
    - module_io_matrix_all_phases
  emits_to:
    modules:
    - P0.S6.M03
    - P0.S8.M03
    artifacts: *id002
    phase_outputs:
    - forbidden_connection_report
phase: P0
subphase: P0.S1
rc: RC4.1
notes: Canonical P0 module contract; the matrix remains the IO authority.
