module_id: P0.S7.M02
module_name: agent_prompt_template_validator
function: Validar templates de prompt contra o skill registry e as regras Zero Trust,
  impedindo escalation de fase, módulos, permissões ou autoridade.
inputs: &id001
- agent_prompt_templates
- agent_skill_registry
- zero_trust_rules
outputs: &id002
- validated_agent_prompt_templates
validations:
- prompt_does_not_override_global_contract
- prompt_scope_matches_skill
- prompt_permissions_do_not_escalate
- prompt_module_scope_does_not_escalate
fail_fast_conditions:
- agent_prompt_template_validator_critical_failure
forbidden_fields:
- future_return
- target
- candidate_score
- rank_score
- portfolio_weight
- realized_pnl
- trade_decision
allowed_connections:
  consumes_from:
    modules:
    - P0.S7.M01
    artifacts: *id001
    phase_inputs:
    - agent_prompt_templates
    - zero_trust_rules
  emits_to:
    modules:
    - P0.S7.M03
    artifacts: *id002
    phase_outputs: []
phase: P0
subphase: P0.S7
rc: RC4.1
notes: Canonical P0 module contract; the matrix remains the IO authority.
