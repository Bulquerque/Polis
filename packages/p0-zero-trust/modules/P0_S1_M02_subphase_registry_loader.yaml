  técnico e sem tocar no fluxo econômico.
inputs: &id001
- validated_phase_registry
- subphase_registry_yaml
outputs: &id002
- validated_subphase_registry
validations:
- subphase_id_unique
- subphase_belongs_to_existing_phase
- exact_subphase_set
- provenance_valid
- registry_version_compatible
fail_fast_conditions:
- subphase_registry_loader_critical_failure
forbidden_fields:
- future_return
- target
- candidate_score
- rank_score
- portfolio_weight
- realized_pnl
- trade_decision
allowed_connections:
