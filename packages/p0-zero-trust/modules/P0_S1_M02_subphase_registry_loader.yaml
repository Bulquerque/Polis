    modules:
    - P0.S1.M01
    artifacts: *id001
    phase_inputs:
    - subphase_registry_yaml
  emits_to:
    modules:
    - P0.S1.M03
    artifacts: *id002
    phase_outputs: []
phase: P0
subphase: P0.S1
rc: RC4.1
notes: Canonical P0 module contract; the matrix remains the IO authority.
