$defs:
  ExposureLimitResult:
    additionalProperties: false
    properties:
      exposure_type:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Exposure Type
        type: string
      bucket_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Bucket Id
        type: string
      horizon_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Horizon Id
        type: string
      value:
        title: Value
        type: number
      minimum:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Minimum
      maximum:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Maximum
      available:
        default: true
        title: Available
        type: boolean
      feasible:
        title: Feasible
        type: boolean
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - exposure_type
    - bucket_id
    - horizon_id
    - value
    - feasible
    title: ExposureLimitResult
    type: object
  HedgeAdjustment:
    additionalProperties: false
    properties:
      candidate_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Candidate Id
        type: string
      current_target_quantity:
        title: Current Target Quantity
        type: number
      adjustment_quantity:
        title: Adjustment Quantity
        type: number
      hedged_target_quantity:
        title: Hedged Target Quantity
        type: number
      estimated_transaction_cost:
        minimum: 0
        title: Estimated Transaction Cost
        type: number
    required:
    - candidate_id
    - current_target_quantity
    - adjustment_quantity
    - hedged_target_quantity
    - estimated_transaction_cost
    title: HedgeAdjustment
    type: object
  HedgeStatus:
    enum:
    - DISABLED
    - NOT_NEEDED
    - PROPOSED
    - ACCEPTED
    - REJECTED
    - INFEASIBLE
    - NO_ACTION_VALID
    title: HedgeStatus
    type: string
  HorizonRiskMetrics:
    additionalProperties: false
    properties:
      horizon_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Horizon Id
        type: string
      capital:
        minimum: 0
        title: Capital
        type: number
      margin:
        minimum: 0
        title: Margin
        type: number
      maximum_loss:
        minimum: 0
        title: Maximum Loss
        type: number
      cvar:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Cvar
      maximum_stress_loss:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Maximum Stress Loss
      capital_limit:
        minimum: 0
        title: Capital Limit
        type: number
      margin_limit:
        minimum: 0
        title: Margin Limit
        type: number
      maximum_loss_limit:
        minimum: 0
        title: Maximum Loss Limit
        type: number
      cvar_limit:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Cvar Limit
      feasible:
        title: Feasible
        type: boolean
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - horizon_id
    - capital
    - margin
    - maximum_loss
    - capital_limit
    - margin_limit
    - maximum_loss_limit
    - feasible
    title: HorizonRiskMetrics
    type: object
  IndependentRiskGateReport:
    additionalProperties: false
    properties:
      status:
        $ref: '#/$defs/RiskGateStatus'
      horizon_metrics:
        items:
          $ref: '#/$defs/HorizonRiskMetrics'
        title: Horizon Metrics
        type: array
      exposure_limits:
        items:
          $ref: '#/$defs/ExposureLimitResult'
        title: Exposure Limits
        type: array
      optimizer_claimed_feasible:
        title: Optimizer Claimed Feasible
        type: boolean
      independently_feasible:
        title: Independently Feasible
        type: boolean
      maximum_optimizer_risk_discrepancy:
        minimum: 0
        title: Maximum Optimizer Risk Discrepancy
        type: number
      decision_snapshot_hash:
        pattern: ^[a-f0-9]{64}$
        title: Decision Snapshot Hash
        type: string
      target_hash:
        pattern: ^[a-f0-9]{64}$
        title: Target Hash
        type: string
      report_hash:
        pattern: ^[a-f0-9]{64}$
        title: Report Hash
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - status
    - horizon_metrics
    - exposure_limits
    - optimizer_claimed_feasible
    - independently_feasible
    - maximum_optimizer_risk_discrepancy
    - decision_snapshot_hash
    - target_hash
    - report_hash
    title: IndependentRiskGateReport
    type: object
  RiskGateStatus:
    enum:
    - APPROVED
    - PARTIALLY_APPROVED
    - RISK_BLOCKED
    - NO_ACTION_VALID
    - INFEASIBLE_INPUT
    title: RiskGateStatus
    type: string
additionalProperties: false
properties:
  status:
    $ref: '#/$defs/HedgeStatus'
  adjustments:
    items:
      $ref: '#/$defs/HedgeAdjustment'
    title: Adjustments
    type: array
  base_cvar:
    anyOf:
    - minimum: 0
      type: number
    - type: 'null'
    default: null
    title: Base Cvar
  post_hedge_cvar:
    anyOf:
    - minimum: 0
      type: number
    - type: 'null'
    default: null
    title: Post Hedge Cvar
  cvar_reduction:
    minimum: 0
    title: Cvar Reduction
    type: number
  estimated_cost:
    minimum: 0
    title: Estimated Cost
    type: number
  post_hedge_risk_gate:
    anyOf:
    - $ref: '#/$defs/IndependentRiskGateReport'
    - type: 'null'
    default: null
  plan_hash:
    pattern: ^[a-f0-9]{64}$
    title: Plan Hash
    type: string
  reason_codes:
    default: []
    items:
      maxLength: 180
      minLength: 1
      pattern: ^[A-Za-z0-9_.:\-/]+$
      type: string
    title: Reason Codes
    type: array
required:
- status
- adjustments
- cvar_reduction
- estimated_cost
- plan_hash
title: HedgePlan
type: object
