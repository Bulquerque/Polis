$defs:
  Agent3IntegratedPayload:
    additionalProperties: false
    properties:
      s5_result:
        $ref: '#/$defs/S5ResultBundle'
      s6_authorization:
        $ref: '#/$defs/ExecutionAuthorizationBundle'
      integration_receipts:
        items:
          type: string
        title: Integration Receipts
        type: array
    required:
    - s5_result
    - s6_authorization
    - integration_receipts
    title: Agent3IntegratedPayload
    type: object
  ArtifactEnvelope:
    additionalProperties: false
    properties:
      artifact_id:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Artifact Id
        type: string
      artifact_type:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Artifact Type
        type: string
      schema_version:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Schema Version
        type: string
      contract_version:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Contract Version
        type: string
      producer_phase:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Producer Phase
        type: string
      producer_module:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Producer Module
        type: string
      producer_release:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Producer Release
        type: string
      pipeline_version:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Pipeline Version
        type: string
      run_id:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Run Id
        type: string
      cycle_id:
        minimum: 0
        title: Cycle Id
        type: integer
      decision_time:
        format: date-time
        title: Decision Time
        type: string
      market_cutoff_at:
        format: date-time
        title: Market Cutoff At
        type: string
      computed_at:
        format: date-time
        title: Computed At
        type: string
      recorded_at:
        format: date-time
        title: Recorded At
        type: string
      available_at:
        format: date-time
        title: Available At
        type: string
      content_sha256:
        pattern: ^[a-f0-9]{64}$
        title: Content Sha256
        type: string
      lineage_id:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Lineage Id
        type: string
    required:
    - artifact_id
    - artifact_type
    - schema_version
    - contract_version
    - producer_phase
    - producer_module
    - producer_release
    - pipeline_version
    - run_id
    - cycle_id
    - decision_time
    - market_cutoff_at
    - computed_at
    - recorded_at
    - available_at
    - content_sha256
    - lineage_id
    title: ArtifactEnvelope
    type: object
  AuthorizationActionType:
    enum:
    - TARGET
    - HEDGE
    - LIFECYCLE
    - EMERGENCY
    title: AuthorizationActionType
    type: string
  AuthorizationStatus:
    enum:
    - AUTHORIZED
    - PARTIALLY_AUTHORIZED
    - EMERGENCY_AUTHORIZED
    - RISK_BLOCKED
    - LIFECYCLE_BLOCKED
    - INFEASIBLE
    - NO_ACTION_VALID
    title: AuthorizationStatus
    type: string
  AuthorizedAction:
    additionalProperties: false
    properties:
      authorization_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Authorization Id
        type: string
      action_type:
        $ref: '#/$defs/AuthorizationActionType'
      candidate_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Candidate Id
        type: string
      target_quantity:
        title: Target Quantity
        type: number
      delta_quantity:
        title: Delta Quantity
        type: number
      lifecycle_action:
        anyOf:
        - $ref: '#/$defs/LifecycleAction'
        - type: 'null'
        default: null
      valid_from:
        format: date-time
        title: Valid From
        type: string
      valid_until:
        format: date-time
        title: Valid Until
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - authorization_id
    - action_type
    - candidate_id
    - target_quantity
    - delta_quantity
    - valid_from
    - valid_until
    title: AuthorizedAction
    type: object
  ComparisonState:
    enum:
    - BENIGN
    - MATERIAL
    - UNSAFE
    - NOT_RUN
    title: ComparisonState
    type: string
  CompiledConstraintSet:
    additionalProperties: false
    properties:
      candidate_ids:
        items:
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Candidate Ids
        type: array
      horizon_ids:
        items:
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Horizon Ids
        type: array
      candidate_bounds:
        items:
          maxItems: 2
          minItems: 2
          prefixItems:
          - type: number
          - type: number
          type: array
        title: Candidate Bounds
        type: array
      quantity_increments:
        items:
          type: number
        title: Quantity Increments
        type: array
      capital_limits:
        items:
          type: number
        title: Capital Limits
        type: array
      margin_limits:
        items:
          type: number
        title: Margin Limits
        type: array
      maximum_loss_limits:
        items:
          type: number
        title: Maximum Loss Limits
        type: array
      liquidity_caps:
        items:
          items:
            type: number
          type: array
        title: Liquidity Caps
        type: array
      maximum_turnover:
        title: Maximum Turnover
        type: number
      maximum_cvar:
        anyOf:
        - type: number
        - type: 'null'
        title: Maximum Cvar
      constraint_count:
        minimum: 0
        title: Constraint Count
        type: integer
      conflicts:
        default: []
        items:
          $ref: '#/$defs/ConstraintConflict'
        title: Conflicts
        type: array
      constraint_hash:
        pattern: ^[a-f0-9]{64}$
        title: Constraint Hash
        type: string
    required:
    - candidate_ids
    - horizon_ids
    - candidate_bounds
    - quantity_increments
    - capital_limits
    - margin_limits
    - maximum_loss_limits
    - liquidity_caps
    - maximum_turnover
    - maximum_cvar
    - constraint_count
    - constraint_hash
    title: CompiledConstraintSet
    type: object
  CompiledPortfolioObjective:
    additionalProperties: false
    properties:
      candidate_ids:
        items:
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Candidate Ids
        type: array
      horizon_ids:
        items:
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Horizon Ids
        type: array
      expected_pnl_by_horizon_candidate:
        items:
          items:
            type: number
          type: array
        title: Expected Pnl By Horizon Candidate
        type: array
      transaction_cost_by_candidate:
        items:
          type: number
        title: Transaction Cost By Candidate
        type: array
      funding_cost_by_horizon_candidate:
        items:
          items:
            type: number
          type: array
        title: Funding Cost By Horizon Candidate
        type: array
      components:
        items:
          $ref: '#/$defs/ObjectiveComponent'
        title: Components
        type: array
      ordinal_penalty_count:
        minimum: 0
        title: Ordinal Penalty Count
        type: integer
      objective_hash:
        pattern: ^[a-f0-9]{64}$
        title: Objective Hash
        type: string
    required:
    - candidate_ids
    - horizon_ids
    - expected_pnl_by_horizon_candidate
    - transaction_cost_by_candidate
    - funding_cost_by_horizon_candidate
    - components
    - ordinal_penalty_count
    - objective_hash
    title: CompiledPortfolioObjective
    type: object
  ConstraintConflict:
    additionalProperties: false
    properties:
      conflict_id:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Conflict Id
        type: string
      reason_code:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Reason Code
        type: string
      candidate_id:
        anyOf:
        - maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        - type: 'null'
        default: null
        title: Candidate Id
      detail:
        title: Detail
        type: string
    required:
    - conflict_id
    - reason_code
    - detail
    title: ConstraintConflict
    type: object
  ConstraintSlack:
    additionalProperties: false
    properties:
      constraint_name:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Constraint Name
        type: string
      slack:
        title: Slack
        type: number
    required:
    - constraint_name
    - slack
    title: ConstraintSlack
    type: object
  ContinuousTargetSolution:
    additionalProperties: false
    properties:
      status:
        $ref: '#/$defs/SolverStatus'
      quantities:
        items:
          $ref: '#/$defs/QuantityPath'
        title: Quantities
        type: array
      objective_value:
        anyOf:
        - type: number
        - type: 'null'
        title: Objective Value
      solver_name:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Solver Name
        type: string
      solver_version:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Solver Version
        type: string
      iterations:
        anyOf:
        - minimum: 0
          type: integer
        - type: 'null'
        default: null
        title: Iterations
      message:
        title: Message
        type: string
      solution_hash:
        pattern: ^[a-f0-9]{64}$
        title: Solution Hash
        type: string
      validation:
        $ref: '#/$defs/SolutionValidationReport'
    required:
    - status
    - quantities
    - objective_value
    - solver_name
    - solver_version
    - message
    - solution_hash
    - validation
    title: ContinuousTargetSolution
    type: object
  DiscreteStatus:
    enum:
    - FEASIBLE_ROUNDED
    - FEASIBLE_REOPTIMIZED
    - INFEASIBLE_AFTER_ROUNDING
    - NO_ACTION_VALID
    title: DiscreteStatus
    type: string
  DiscreteTargetPositionPanel:
    additionalProperties: false
    properties:
      status:
        $ref: '#/$defs/DiscreteStatus'
      quantities:
        items:
          $ref: '#/$defs/QuantityPath'
        title: Quantities
        type: array
      changes:
        items:
          $ref: '#/$defs/RoundingChange'
        title: Changes
        type: array
      objective_value:
        anyOf:
        - type: number
        - type: 'null'
        title: Objective Value
      validation:
        $ref: '#/$defs/SolutionValidationReport'
      discrete_hash:
        pattern: ^[a-f0-9]{64}$
        title: Discrete Hash
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - status
    - quantities
    - changes
    - objective_value
    - validation
    - discrete_hash
    title: DiscreteTargetPositionPanel
    type: object
  EmergencyPlan:
    additionalProperties: false
    properties:
      status:
        $ref: '#/$defs/EmergencyStatus'
      steps:
        items:
          $ref: '#/$defs/LiquidationStep'
        title: Steps
        type: array
      total_margin_relief:
        minimum: 0
        title: Total Margin Relief
        type: number
      total_capital_relief:
        minimum: 0
        title: Total Capital Relief
        type: number
      total_maximum_loss_relief:
        minimum: 0
        title: Total Maximum Loss Relief
        type: number
      estimated_total_cost:
        minimum: 0
        title: Estimated Total Cost
        type: number
      feasibility_proven:
        title: Feasibility Proven
        type: boolean
      plan_hash:
        pattern: ^[a-f0-9]{64}$
        title: Plan Hash
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - status
    - steps
    - total_margin_relief
    - total_capital_relief
    - total_maximum_loss_relief
    - estimated_total_cost
    - feasibility_proven
    - plan_hash
    title: EmergencyPlan
    type: object
  EmergencyStatus:
    enum:
    - NOT_TRIGGERED
    - PLAN_AVAILABLE
    - NO_SAFE_LIQUIDATION_PLAN
    - NO_ACTION_VALID
    title: EmergencyStatus
    type: string
  ExecutionAuthorizationBundle:
    additionalProperties: false
    properties:
      envelope:
        $ref: '#/$defs/ArtifactEnvelope'
      payload:
        $ref: '#/$defs/ExecutionAuthorizationPayload'
    required:
    - envelope
    - payload
    title: ExecutionAuthorizationBundle
    type: object
  ExecutionAuthorizationPayload:
    additionalProperties: false
    properties:
      status:
        $ref: '#/$defs/AuthorizationStatus'
      decision_snapshot_hash:
        pattern: ^[a-f0-9]{64}$
        title: Decision Snapshot Hash
        type: string
      risk_gate:
        $ref: '#/$defs/IndependentRiskGateReport'
      hedge_plan:
        $ref: '#/$defs/HedgePlan'
      lifecycle_plan:
        $ref: '#/$defs/LifecyclePlan'
      emergency_plan:
        $ref: '#/$defs/EmergencyPlan'
      authorized_actions:
        items:
          $ref: '#/$defs/AuthorizedAction'
        title: Authorized Actions
        type: array
      valid_from:
        format: date-time
        title: Valid From
        type: string
      valid_until:
        format: date-time
        title: Valid Until
        type: string
      execution_authority:
        default: true
        title: Execution Authority
        type: boolean
      payload_hash:
        pattern: ^[a-f0-9]{64}$
        title: Payload Hash
        type: string
      module_receipts:
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Module Receipts
        type: array
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - status
    - decision_snapshot_hash
    - risk_gate
    - hedge_plan
    - lifecycle_plan
    - emergency_plan
    - authorized_actions
    - valid_from
    - valid_until
    - payload_hash
    - module_receipts
    title: ExecutionAuthorizationPayload
    type: object
  ExposureLimitResult:
    additionalProperties: false
    properties:
      exposure_type:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Exposure Type
        type: string
      bucket_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Bucket Id
        type: string
      horizon_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Horizon Id
        type: string
      value:
        title: Value
        type: number
      minimum:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Minimum
      maximum:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Maximum
      available:
        default: true
        title: Available
        type: boolean
      feasible:
        title: Feasible
        type: boolean
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - exposure_type
    - bucket_id
    - horizon_id
    - value
    - feasible
    title: ExposureLimitResult
    type: object
  HedgeAdjustment:
    additionalProperties: false
    properties:
      candidate_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Candidate Id
        type: string
      current_target_quantity:
        title: Current Target Quantity
        type: number
      adjustment_quantity:
        title: Adjustment Quantity
        type: number
      hedged_target_quantity:
        title: Hedged Target Quantity
        type: number
      estimated_transaction_cost:
        minimum: 0
        title: Estimated Transaction Cost
        type: number
    required:
    - candidate_id
    - current_target_quantity
    - adjustment_quantity
    - hedged_target_quantity
    - estimated_transaction_cost
    title: HedgeAdjustment
    type: object
  HedgePlan:
    additionalProperties: false
    properties:
      status:
        $ref: '#/$defs/HedgeStatus'
      adjustments:
        items:
          $ref: '#/$defs/HedgeAdjustment'
        title: Adjustments
        type: array
      base_cvar:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Base Cvar
      post_hedge_cvar:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Post Hedge Cvar
      cvar_reduction:
        minimum: 0
        title: Cvar Reduction
        type: number
      estimated_cost:
        minimum: 0
        title: Estimated Cost
        type: number
      post_hedge_risk_gate:
        anyOf:
        - $ref: '#/$defs/IndependentRiskGateReport'
        - type: 'null'
        default: null
      plan_hash:
        pattern: ^[a-f0-9]{64}$
        title: Plan Hash
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - status
    - adjustments
    - cvar_reduction
    - estimated_cost
    - plan_hash
    title: HedgePlan
    type: object
  HedgeStatus:
    enum:
    - DISABLED
    - NOT_NEEDED
    - PROPOSED
    - ACCEPTED
    - REJECTED
    - INFEASIBLE
    - NO_ACTION_VALID
    title: HedgeStatus
    type: string
  HorizonRiskMetrics:
    additionalProperties: false
    properties:
      horizon_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Horizon Id
        type: string
      capital:
        minimum: 0
        title: Capital
        type: number
      margin:
        minimum: 0
        title: Margin
        type: number
      maximum_loss:
        minimum: 0
        title: Maximum Loss
        type: number
      cvar:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Cvar
      maximum_stress_loss:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Maximum Stress Loss
      capital_limit:
        minimum: 0
        title: Capital Limit
        type: number
      margin_limit:
        minimum: 0
        title: Margin Limit
        type: number
      maximum_loss_limit:
        minimum: 0
        title: Maximum Loss Limit
        type: number
      cvar_limit:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Cvar Limit
      feasible:
        title: Feasible
        type: boolean
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - horizon_id
    - capital
    - margin
    - maximum_loss
    - capital_limit
    - margin_limit
    - maximum_loss_limit
    - feasible
    title: HorizonRiskMetrics
    type: object
  IndependentRiskGateReport:
    additionalProperties: false
    properties:
      status:
        $ref: '#/$defs/RiskGateStatus'
      horizon_metrics:
        items:
          $ref: '#/$defs/HorizonRiskMetrics'
        title: Horizon Metrics
        type: array
      exposure_limits:
        items:
          $ref: '#/$defs/ExposureLimitResult'
        title: Exposure Limits
        type: array
      optimizer_claimed_feasible:
        title: Optimizer Claimed Feasible
        type: boolean
      independently_feasible:
        title: Independently Feasible
        type: boolean
      maximum_optimizer_risk_discrepancy:
        minimum: 0
        title: Maximum Optimizer Risk Discrepancy
        type: number
      decision_snapshot_hash:
        pattern: ^[a-f0-9]{64}$
        title: Decision Snapshot Hash
        type: string
      target_hash:
        pattern: ^[a-f0-9]{64}$
        title: Target Hash
        type: string
      report_hash:
        pattern: ^[a-f0-9]{64}$
        title: Report Hash
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - status
    - horizon_metrics
    - exposure_limits
    - optimizer_claimed_feasible
    - independently_feasible
    - maximum_optimizer_risk_discrepancy
    - decision_snapshot_hash
    - target_hash
    - report_hash
    title: IndependentRiskGateReport
    type: object
  LifecycleAction:
    enum:
    - HOLD
    - CLOSE
    - ROLL
    - EXERCISE
    - ALLOW_ASSIGNMENT
    - PREVENT_ASSIGNMENT
    - CASH_SETTLE
    - PHYSICAL_SETTLE
    - UNSUPPORTED
    title: LifecycleAction
    type: string
  LifecycleLegDecision:
    additionalProperties: false
    properties:
      candidate_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Candidate Id
        type: string
      leg_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Leg Id
        type: string
      instrument_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Instrument Id
        type: string
      action:
        $ref: '#/$defs/LifecycleAction'
      quantity:
        title: Quantity
        type: number
      effective_at:
        format: date-time
        title: Effective At
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - candidate_id
    - leg_id
    - instrument_id
    - action
    - quantity
    - effective_at
    title: LifecycleLegDecision
    type: object
  LifecyclePlan:
    additionalProperties: false
    properties:
      status:
        $ref: '#/$defs/LifecycleStatus'
      decisions:
        items:
          $ref: '#/$defs/LifecycleLegDecision'
        title: Decisions
        type: array
      unsupported_candidate_ids:
        default: []
        items:
