$defs:
  AuthorizationActionType:
    enum:
    - TARGET
    - HEDGE
    - LIFECYCLE
    - EMERGENCY
    title: AuthorizationActionType
    type: string
  AuthorizationStatus:
    enum:
    - AUTHORIZED
    - PARTIALLY_AUTHORIZED
    - EMERGENCY_AUTHORIZED
    - RISK_BLOCKED
    - LIFECYCLE_BLOCKED
    - INFEASIBLE
    - NO_ACTION_VALID
    title: AuthorizationStatus
    type: string
  AuthorizedAction:
    additionalProperties: false
    properties:
      authorization_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Authorization Id
        type: string
      action_type:
        $ref: '#/$defs/AuthorizationActionType'
      candidate_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Candidate Id
        type: string
      target_quantity:
        title: Target Quantity
        type: number
      delta_quantity:
        title: Delta Quantity
        type: number
      lifecycle_action:
        anyOf:
        - $ref: '#/$defs/LifecycleAction'
        - type: 'null'
        default: null
      valid_from:
        format: date-time
        title: Valid From
        type: string
      valid_until:
        format: date-time
        title: Valid Until
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - authorization_id
    - action_type
    - candidate_id
    - target_quantity
    - delta_quantity
    - valid_from
    - valid_until
    title: AuthorizedAction
    type: object
  EmergencyPlan:
    additionalProperties: false
    properties:
      status:
        $ref: '#/$defs/EmergencyStatus'
      steps:
        items:
          $ref: '#/$defs/LiquidationStep'
        title: Steps
        type: array
      total_margin_relief:
        minimum: 0
        title: Total Margin Relief
        type: number
      total_capital_relief:
        minimum: 0
        title: Total Capital Relief
        type: number
      total_maximum_loss_relief:
        minimum: 0
        title: Total Maximum Loss Relief
        type: number
      estimated_total_cost:
        minimum: 0
        title: Estimated Total Cost
        type: number
      feasibility_proven:
        title: Feasibility Proven
        type: boolean
      plan_hash:
        pattern: ^[a-f0-9]{64}$
        title: Plan Hash
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - status
    - steps
    - total_margin_relief
    - total_capital_relief
    - total_maximum_loss_relief
    - estimated_total_cost
    - feasibility_proven
    - plan_hash
    title: EmergencyPlan
    type: object
  EmergencyStatus:
    enum:
    - NOT_TRIGGERED
    - PLAN_AVAILABLE
    - NO_SAFE_LIQUIDATION_PLAN
    - NO_ACTION_VALID
    title: EmergencyStatus
    type: string
  ExposureLimitResult:
    additionalProperties: false
    properties:
      exposure_type:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Exposure Type
        type: string
      bucket_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Bucket Id
        type: string
      horizon_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Horizon Id
        type: string
      value:
        title: Value
        type: number
      minimum:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Minimum
      maximum:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Maximum
      available:
        default: true
        title: Available
        type: boolean
      feasible:
        title: Feasible
        type: boolean
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - exposure_type
    - bucket_id
    - horizon_id
    - value
    - feasible
    title: ExposureLimitResult
    type: object
  HedgeAdjustment:
    additionalProperties: false
    properties:
      candidate_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Candidate Id
        type: string
      current_target_quantity:
        title: Current Target Quantity
        type: number
      adjustment_quantity:
        title: Adjustment Quantity
        type: number
      hedged_target_quantity:
        title: Hedged Target Quantity
        type: number
      estimated_transaction_cost:
        minimum: 0
        title: Estimated Transaction Cost
        type: number
    required:
    - candidate_id
    - current_target_quantity
    - adjustment_quantity
    - hedged_target_quantity
    - estimated_transaction_cost
    title: HedgeAdjustment
    type: object
  HedgePlan:
    additionalProperties: false
    properties:
      status:
        $ref: '#/$defs/HedgeStatus'
      adjustments:
        items:
          $ref: '#/$defs/HedgeAdjustment'
        title: Adjustments
        type: array
      base_cvar:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Base Cvar
      post_hedge_cvar:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Post Hedge Cvar
      cvar_reduction:
        minimum: 0
        title: Cvar Reduction
        type: number
      estimated_cost:
        minimum: 0
        title: Estimated Cost
        type: number
      post_hedge_risk_gate:
        anyOf:
        - $ref: '#/$defs/IndependentRiskGateReport'
        - type: 'null'
        default: null
      plan_hash:
        pattern: ^[a-f0-9]{64}$
        title: Plan Hash
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - status
    - adjustments
    - cvar_reduction
    - estimated_cost
    - plan_hash
    title: HedgePlan
    type: object
  HedgeStatus:
    enum:
    - DISABLED
    - NOT_NEEDED
    - PROPOSED
    - ACCEPTED
    - REJECTED
    - INFEASIBLE
    - NO_ACTION_VALID
    title: HedgeStatus
    type: string
  HorizonRiskMetrics:
    additionalProperties: false
    properties:
      horizon_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Horizon Id
        type: string
      capital:
        minimum: 0
        title: Capital
        type: number
      margin:
        minimum: 0
        title: Margin
        type: number
      maximum_loss:
        minimum: 0
        title: Maximum Loss
        type: number
      cvar:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Cvar
      maximum_stress_loss:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Maximum Stress Loss
      capital_limit:
        minimum: 0
        title: Capital Limit
        type: number
      margin_limit:
        minimum: 0
        title: Margin Limit
        type: number
      maximum_loss_limit:
        minimum: 0
        title: Maximum Loss Limit
        type: number
      cvar_limit:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Cvar Limit
      feasible:
        title: Feasible
        type: boolean
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - horizon_id
    - capital
    - margin
    - maximum_loss
    - capital_limit
    - margin_limit
    - maximum_loss_limit
    - feasible
    title: HorizonRiskMetrics
    type: object
  IndependentRiskGateReport:
    additionalProperties: false
    properties:
      status:
        $ref: '#/$defs/RiskGateStatus'
      horizon_metrics:
        items:
          $ref: '#/$defs/HorizonRiskMetrics'
        title: Horizon Metrics
        type: array
      exposure_limits:
        items:
          $ref: '#/$defs/ExposureLimitResult'
        title: Exposure Limits
        type: array
      optimizer_claimed_feasible:
        title: Optimizer Claimed Feasible
        type: boolean
      independently_feasible:
        title: Independently Feasible
        type: boolean
      maximum_optimizer_risk_discrepancy:
        minimum: 0
        title: Maximum Optimizer Risk Discrepancy
        type: number
      decision_snapshot_hash:
        pattern: ^[a-f0-9]{64}$
        title: Decision Snapshot Hash
        type: string
      target_hash:
        pattern: ^[a-f0-9]{64}$
        title: Target Hash
        type: string
      report_hash:
        pattern: ^[a-f0-9]{64}$
        title: Report Hash
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - status
    - horizon_metrics
    - exposure_limits
    - optimizer_claimed_feasible
    - independently_feasible
    - maximum_optimizer_risk_discrepancy
    - decision_snapshot_hash
    - target_hash
    - report_hash
    title: IndependentRiskGateReport
    type: object
  LifecycleAction:
    enum:
    - HOLD
    - CLOSE
    - ROLL
    - EXERCISE
    - ALLOW_ASSIGNMENT
    - PREVENT_ASSIGNMENT
    - CASH_SETTLE
    - PHYSICAL_SETTLE
    - UNSUPPORTED
    title: LifecycleAction
    type: string
  LifecycleLegDecision:
    additionalProperties: false
    properties:
      candidate_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Candidate Id
        type: string
      leg_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Leg Id
        type: string
      instrument_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Instrument Id
        type: string
      action:
        $ref: '#/$defs/LifecycleAction'
      quantity:
        title: Quantity
        type: number
      effective_at:
        format: date-time
        title: Effective At
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - candidate_id
    - leg_id
    - instrument_id
    - action
    - quantity
    - effective_at
    title: LifecycleLegDecision
    type: object
  LifecyclePlan:
    additionalProperties: false
    properties:
      status:
        $ref: '#/$defs/LifecycleStatus'
      decisions:
        items:
          $ref: '#/$defs/LifecycleLegDecision'
        title: Decisions
        type: array
      unsupported_candidate_ids:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Unsupported Candidate Ids
        type: array
      plan_hash:
        pattern: ^[a-f0-9]{64}$
        title: Plan Hash
        type: string
      reason_codes:
        default: []
        items:
          maxLength: 180
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - status
    - decisions
    - plan_hash
    title: LifecyclePlan
    type: object
  LifecycleStatus:
    enum:
    - SUPPORTED
    - BLOCKED
    - NO_ACTION_VALID
    title: LifecycleStatus
    type: string
  LiquidationStep:
    additionalProperties: false
    properties:
      sequence:
        minimum: 1
        title: Sequence
        type: integer
      candidate_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Candidate Id
        type: string
      current_target_quantity:
        title: Current Target Quantity
        type: number
      reduction_quantity:
        title: Reduction Quantity
        type: number
      resulting_target_quantity:
        title: Resulting Target Quantity
        type: number
      margin_relief:
        minimum: 0
        title: Margin Relief
        type: number
      capital_relief:
        minimum: 0
        title: Capital Relief
        type: number
      maximum_loss_relief:
        minimum: 0
        title: Maximum Loss Relief
        type: number
      estimated_transaction_cost:
        minimum: 0
        title: Estimated Transaction Cost
        type: number
      structure_preserving:
        default: true
        title: Structure Preserving
        type: boolean
    required:
    - sequence
    - candidate_id
    - current_target_quantity
    - reduction_quantity
    - resulting_target_quantity
    - margin_relief
    - capital_relief
    - maximum_loss_relief
    - estimated_transaction_cost
    title: LiquidationStep
    type: object
  RiskGateStatus:
    enum:
    - APPROVED
    - PARTIALLY_APPROVED
    - RISK_BLOCKED
    - NO_ACTION_VALID
    - INFEASIBLE_INPUT
    title: RiskGateStatus
    type: string
additionalProperties: false
properties:
  status:
    $ref: '#/$defs/AuthorizationStatus'
  decision_snapshot_hash:
    pattern: ^[a-f0-9]{64}$
    title: Decision Snapshot Hash
    type: string
  risk_gate:
    $ref: '#/$defs/IndependentRiskGateReport'
  hedge_plan:
    $ref: '#/$defs/HedgePlan'
  lifecycle_plan:
    $ref: '#/$defs/LifecyclePlan'
  emergency_plan:
    $ref: '#/$defs/EmergencyPlan'
  authorized_actions:
    items:
      $ref: '#/$defs/AuthorizedAction'
    title: Authorized Actions
    type: array
  valid_from:
    format: date-time
    title: Valid From
    type: string
  valid_until:
    format: date-time
    title: Valid Until
    type: string
  execution_authority:
    default: true
    title: Execution Authority
    type: boolean
  payload_hash:
    pattern: ^[a-f0-9]{64}$
    title: Payload Hash
    type: string
  module_receipts:
    items:
      maxLength: 180
      minLength: 1
      pattern: ^[A-Za-z0-9_.:\-/]+$
      type: string
    title: Module Receipts
    type: array
  reason_codes:
    default: []
    items:
      maxLength: 180
      minLength: 1
      pattern: ^[A-Za-z0-9_.:\-/]+$
      type: string
    title: Reason Codes
    type: array
required:
- status
- decision_snapshot_hash
- risk_gate
- hedge_plan
- lifecycle_plan
- emergency_plan
- authorized_actions
- valid_from
- valid_until
- payload_hash
- module_receipts
title: ExecutionAuthorizationPayload
type: object
