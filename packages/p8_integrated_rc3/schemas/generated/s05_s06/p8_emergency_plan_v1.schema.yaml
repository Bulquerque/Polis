$defs:
  EmergencyStatus:
    enum:
    - NOT_TRIGGERED
    - PLAN_AVAILABLE
    - NO_SAFE_LIQUIDATION_PLAN
    - NO_ACTION_VALID
    title: EmergencyStatus
    type: string
  LiquidationStep:
    additionalProperties: false
    properties:
      sequence:
        minimum: 1
        title: Sequence
        type: integer
      candidate_id:
        maxLength: 180
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Candidate Id
        type: string
      current_target_quantity:
        title: Current Target Quantity
        type: number
      reduction_quantity:
        title: Reduction Quantity
        type: number
      resulting_target_quantity:
        title: Resulting Target Quantity
        type: number
      margin_relief:
        minimum: 0
        title: Margin Relief
        type: number
      capital_relief:
        minimum: 0
        title: Capital Relief
        type: number
      maximum_loss_relief:
        minimum: 0
        title: Maximum Loss Relief
        type: number
      estimated_transaction_cost:
        minimum: 0
        title: Estimated Transaction Cost
        type: number
      structure_preserving:
        default: true
        title: Structure Preserving
        type: boolean
    required:
    - sequence
    - candidate_id
    - current_target_quantity
    - reduction_quantity
    - resulting_target_quantity
    - margin_relief
    - capital_relief
    - maximum_loss_relief
    - estimated_transaction_cost
    title: LiquidationStep
    type: object
additionalProperties: false
properties:
  status:
    $ref: '#/$defs/EmergencyStatus'
  steps:
    items:
      $ref: '#/$defs/LiquidationStep'
    title: Steps
    type: array
  total_margin_relief:
    minimum: 0
    title: Total Margin Relief
    type: number
  total_capital_relief:
    minimum: 0
    title: Total Capital Relief
    type: number
  total_maximum_loss_relief:
    minimum: 0
    title: Total Maximum Loss Relief
    type: number
  estimated_total_cost:
    minimum: 0
    title: Estimated Total Cost
    type: number
  feasibility_proven:
    title: Feasibility Proven
    type: boolean
  plan_hash:
    pattern: ^[a-f0-9]{64}$
    title: Plan Hash
    type: string
  reason_codes:
    default: []
    items:
      maxLength: 180
      minLength: 1
      pattern: ^[A-Za-z0-9_.:\-/]+$
      type: string
    title: Reason Codes
    type: array
required:
- status
- steps
- total_margin_relief
- total_capital_relief
- total_maximum_loss_relief
- estimated_total_cost
- feasibility_proven
- plan_hash
title: EmergencyPlan
type: object
