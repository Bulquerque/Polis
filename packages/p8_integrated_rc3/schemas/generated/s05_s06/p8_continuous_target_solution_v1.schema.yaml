$defs:
  ConstraintSlack:
    additionalProperties: false
    properties:
      constraint_name:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Constraint Name
        type: string
      slack:
        title: Slack
        type: number
    required:
    - constraint_name
    - slack
    title: ConstraintSlack
    type: object
  QuantityPath:
    additionalProperties: false
    properties:
      candidate_id:
        maxLength: 160
        minLength: 1
        pattern: ^[A-Za-z0-9_.:\-/]+$
        title: Candidate Id
        type: string
      quantities_by_horizon:
        items:
          type: number
        title: Quantities By Horizon
        type: array
    required:
    - candidate_id
    - quantities_by_horizon
    title: QuantityPath
    type: object
  SolutionValidationReport:
    additionalProperties: false
    properties:
      feasible:
        title: Feasible
        type: boolean
      objective_value:
        anyOf:
        - type: number
        - type: 'null'
        title: Objective Value
      maximum_inequality_violation:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Maximum Inequality Violation
      maximum_equality_violation:
        anyOf:
        - minimum: 0
          type: number
        - type: 'null'
        default: null
        title: Maximum Equality Violation
      slacks:
        default: []
        items:
          $ref: '#/$defs/ConstraintSlack'
        title: Slacks
        type: array
      reason_codes:
        default: []
        items:
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9_.:\-/]+$
          type: string
        title: Reason Codes
        type: array
    required:
    - feasible
    - objective_value
    title: SolutionValidationReport
    type: object
  SolverStatus:
    enum:
    - OPTIMAL
    - ACCEPTABLE_SUBOPTIMAL
    - INFEASIBLE
    - UNBOUNDED
    - TIMEOUT_NO_SOLUTION
    - SOLVER_ERROR
    - NO_ACTION_VALID
    title: SolverStatus
    type: string
additionalProperties: false
properties:
  status:
    $ref: '#/$defs/SolverStatus'
  quantities:
    items:
      $ref: '#/$defs/QuantityPath'
    title: Quantities
    type: array
  objective_value:
    anyOf:
    - type: number
    - type: 'null'
    title: Objective Value
  solver_name:
    maxLength: 160
    minLength: 1
    pattern: ^[A-Za-z0-9_.:\-/]+$
    title: Solver Name
    type: string
  solver_version:
    maxLength: 160
    minLength: 1
    pattern: ^[A-Za-z0-9_.:\-/]+$
    title: Solver Version
    type: string
  iterations:
    anyOf:
    - minimum: 0
      type: integer
    - type: 'null'
    default: null
    title: Iterations
  message:
    title: Message
    type: string
  solution_hash:
    pattern: ^[a-f0-9]{64}$
    title: Solution Hash
    type: string
  validation:
    $ref: '#/$defs/SolutionValidationReport'
required:
- status
- quantities
- objective_value
- solver_name
- solver_version
- message
- solution_hash
- validation
title: ContinuousTargetSolution
type: object
