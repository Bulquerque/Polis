  - run_id
  - cycle_id
  - module_id
  - as_of_time
  - contract_version
  - lineage_id
  metrics:
  - duration_ms
  - input_record_count
  - output_record_count
  - warning_count
  - error_count
tests_required:
- happy_path
- schema_negative
- temporal_negative
- forbidden_field_negative
- lineage
- deterministic_replay
- numeric_or_metamorphic_oracle_when_applicable
definition_of_done:
