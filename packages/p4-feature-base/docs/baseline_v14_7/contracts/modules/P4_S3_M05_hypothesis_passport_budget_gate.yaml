- outputs_match_schemas
- tests_pass
- observability_present
- documentation_contracts_tests_updated_together
- qualification_status_not_overclaimed
implementation_target: src/quant_pipeline/phase_04_feature_base/modules/P4_S3_M05_hypothesis_passport_budget_gate.py
