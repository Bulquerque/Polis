- validated_observer_spec_registry
- feature_observer_registry
- feature_parameter_policy_registry
- observer_change_proposal_registry
- foundational_hypothesis_core_registry
outputs:
- approved_hypothesis_passport_registry
- approved_observer_execution_registry
- approved_interaction_registry
- hypothesis_budget_report
