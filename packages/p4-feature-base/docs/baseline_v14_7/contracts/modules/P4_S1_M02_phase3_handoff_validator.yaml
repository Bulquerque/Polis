- no_prediction_or_target_learning
- no_candidate_generation
- no_ranking_or_portfolio_authority
- no_same_cycle_p9_back_edge
fail_fast_conditions:
- P4_S1_M02_INPUT_INVALID
- P4_S1_M02_TEMPORAL_VIOLATION
