- outputs_match_schemas
- tests_pass
- observability_present
- documentation_contracts_tests_updated_together
- qualification_status_not_overclaimed
implementation_target: src/quant_pipeline/phase_04_feature_base/modules/P4_S1_M02_phase3_handoff_validator.py
unit_test_target: tests/p4_s1/test_p4_s1_m02_phase3_handoff_validator.py
qualification_policy: LOCAL_THEN_CROSS_PHASE_THEN_P0
production_promotion_allowed: false
