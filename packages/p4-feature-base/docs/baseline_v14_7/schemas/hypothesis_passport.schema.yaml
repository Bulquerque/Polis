$schema: https://json-schema.org/draft/2020-12/schema
title: P4 Hypothesis Passport
type: object
required:
- hypothesis_id
- family_id
- economic_mechanism
- primary_observer_ids
- parameter_budget
- status
properties:
  hypothesis_id:
    type: string
  family_id:
    type: string
  economic_mechanism:
    type: string
    minLength: 20
  primary_observer_ids:
    type: array
    minItems: 1
    items:
      type: string
  robustness_observer_ids:
    type: array
    items:
      type: string
  parameter_budget:
    type: object
    required:
    - primary
    - maximum_total_parameterizations
  status:
    type: string
