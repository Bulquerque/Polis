$schema: https://json-schema.org/draft/2020-12/schema
title: perspective_feature_panel
type: object
additionalProperties: true
properties:
  artifact_id:
    type: string
  created_at:
    type: string
    format: date-time
  run_id:
    type: string
  cycle_id:
    type: string
  as_of_time:
    type: string
    format: date-time
  pipeline_version:
    type: string
  lineage_id:
    type: string
  records:
    type: array
    items:
      type: object
      additionalProperties: true
      properties:
        decision_time:
          type: string
          format: date-time
        entity_id:
          type: string
        phenomenon_id:
          type: string
        perspective_id:
          type: string
        observer_id:
          type: string
        feature_value:
          type:
          - number
          - 'null'
        source_modalities:
          type: array
        horizon_group:
          type: string
        available_at:
          type: string
          format: date-time
        quality_state:
          type: string
        record_lineage_id:
          type: string
      required:
      - decision_time
      - entity_id
      - phenomenon_id
      - perspective_id
      - observer_id
      - source_modalities
      - horizon_group
      - available_at
      - quality_state
      - record_lineage_id
required:
- artifact_id
- created_at
- run_id
- cycle_id
- as_of_time
- pipeline_version
- lineage_id
- records
