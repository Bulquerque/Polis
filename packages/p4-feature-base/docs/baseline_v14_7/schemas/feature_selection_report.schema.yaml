$schema: https://json-schema.org/draft/2020-12/schema
title: feature_selection_report
type: object
additionalProperties: true
properties:
  artifact_id:
    type: string
  created_at:
    type: string
    format: date-time
  run_id:
    type: string
  cycle_id:
    type: string
  as_of_time:
    type: string
    format: date-time
  pipeline_version:
    type: string
  lineage_id:
    type: string
  records:
    type: array
    items:
      type: object
      additionalProperties: true
      properties:
        feature_id:
          type:
          - string
          - number
          - 'null'
        decision:
          type:
          - string
          - number
          - 'null'
        reason_code:
          type:
          - string
          - number
          - 'null'
        quality_state:
          type:
          - string
          - number
          - 'null'
      required:
      - feature_id
      - decision
      - reason_code
      - quality_state
required:
- artifact_id
- created_at
- run_id
- cycle_id
- as_of_time
- pipeline_version
- lineage_id
- records
