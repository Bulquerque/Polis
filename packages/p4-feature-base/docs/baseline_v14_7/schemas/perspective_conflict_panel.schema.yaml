$schema: https://json-schema.org/draft/2020-12/schema
title: perspective_conflict_panel
type: object
additionalProperties: true
properties:
  artifact_id:
    type: string
  created_at:
    type: string
    format: date-time
  run_id:
    type: string
  cycle_id:
    type: string
  as_of_time:
    type: string
    format: date-time
  pipeline_version:
    type: string
  lineage_id:
    type: string
  records:
    type: array
    items:
      type: object
      additionalProperties: true
      properties:
        decision_time:
          type: string
          format: date-time
        entity_id:
          type: string
        phenomenon_id:
          type: string
        horizon_group:
          type: string
        consensus_score:
          type:
          - number
          - 'null'
        dispersion_score:
          type:
          - number
          - 'null'
        conflict_score:
          type:
          - number
          - 'null'
        minority_view_strength:
          type:
          - number
          - 'null'
        available_view_count:
          type: integer
        missing_view_count:
          type: integer
        record_lineage_id:
          type: string
      required:
      - decision_time
      - entity_id
      - phenomenon_id
      - horizon_group
      - available_view_count
      - missing_view_count
      - record_lineage_id
required:
- artifact_id
- created_at
- run_id
- cycle_id
- as_of_time
- pipeline_version
- lineage_id
- records
