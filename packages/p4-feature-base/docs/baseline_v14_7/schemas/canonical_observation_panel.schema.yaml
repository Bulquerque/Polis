$schema: https://json-schema.org/draft/2020-12/schema
title: canonical_observation_panel
type: object
additionalProperties: true
properties:
  artifact_id:
    type: string
  created_at:
    type: string
    format: date-time
  run_id:
    type: string
  cycle_id:
    type: string
  as_of_time:
    type: string
    format: date-time
  pipeline_version:
    type: string
  lineage_id:
    type: string
  records:
    type: array
    items:
      type: object
      additionalProperties: true
      properties:
        decision_time:
          type: string
          format: date-time
        entity_id:
          type: string
        variable_id:
          type: string
        value: {}
        source_modality:
          type: string
        event_time:
          type:
          - string
          - 'null'
        reference_time:
          type:
          - string
          - 'null'
        published_at:
          type:
          - string
          - 'null'
        available_at:
          type: string
          format: date-time
        ingested_at:
          type:
          - string
          - 'null'
        quality_state:
          type: string
        missingness_state:
          type: string
        record_lineage_id:
          type: string
      required:
      - decision_time
      - entity_id
      - variable_id
      - source_modality
      - available_at
      - quality_state
      - missingness_state
      - record_lineage_id
required:
- artifact_id
- created_at
- run_id
- cycle_id
- as_of_time
- pipeline_version
- lineage_id
- records
