$schema: https://json-schema.org/draft/2020-12/schema
title: drift_safety_report
type: object
additionalProperties: true
properties:
  artifact_id:
    type: string
  created_at:
    type: string
    format: date-time
  run_id:
    type: string
  cycle_id:
    type: string
  as_of_time:
    type: string
    format: date-time
  pipeline_version:
    type: string
  lineage_id:
    type: string
  records:
    type: array
    items:
      type: object
      additionalProperties: true
      properties:
        feature_or_representation_id:
          type:
          - string
          - number
          - 'null'
        drift_type:
          type:
          - string
          - number
          - 'null'
        severity:
          type:
          - string
          - number
          - 'null'
        gate_decision:
          type:
          - string
          - number
          - 'null'
      required:
      - feature_or_representation_id
      - drift_type
      - severity
      - gate_decision
required:
- artifact_id
- created_at
- run_id
- cycle_id
- as_of_time
- pipeline_version
- lineage_id
- records
