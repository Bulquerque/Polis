$schema: https://json-schema.org/draft/2020-12/schema
title: structural_selection_policy
type: object
properties:
  artifact_id:
    type: string
    minLength: 1
  artifact_name:
    type: string
    minLength: 1
  schema_version:
    type: string
    minLength: 1
  producer_phase:
    type: string
  producer_module_id:
    type: string
  run_id:
    type: string
  cycle_id:
    type: string
  as_of_time:
    type: string
    format: date-time
  created_at:
    type: string
    format: date-time
  content_hash:
    type: string
    pattern: ^[0-9a-f]{64}$
  record_count:
    type: integer
    minimum: 0
  grain:
    type: array
    items:
      type: string
  lineage_id:
    type: string
  execution_status:
    type: string
  quality_status:
    type: string
  metadata:
    type: object
  alias_of:
    type:
    - string
    - 'null'
  records:
    type: array
    items:
      type: object
      properties:
        min_coverage:
          type: number
          minimum: 0
          maximum: 1
        max_missingness:
          type: number
          minimum: 0
          maximum: 1
        min_variance:
          type: number
          minimum: 0
        min_pair_overlap:
          type: integer
          minimum: 3
        duplicate_abs_pearson:
          type: number
          minimum: 0
          maximum: 1
        duplicate_abs_spearman:
          type: number
          minimum: 0
          maximum: 1
        nonlinear_dependence_threshold:
          type: number
          minimum: 0
          maximum: 1
        max_pair_samples:
          type: integer
          minimum: 10
        mutual_info_neighbors:
          type: integer
          minimum: 1
        random_state:
          type: integer
        min_selected_features:
          type: integer
          minimum: 1
        prefer_primary_parameterization:
          type: boolean
      required:
      - min_coverage
      - max_missingness
      - min_variance
      - min_pair_overlap
      - duplicate_abs_pearson
      - duplicate_abs_spearman
      - nonlinear_dependence_threshold
      - max_pair_samples
      - mutual_info_neighbors
      - random_state
      - min_selected_features
      - prefer_primary_parameterization
      additionalProperties: false
required:
- artifact_id
- artifact_name
- schema_version
- producer_phase
- producer_module_id
- run_id
- cycle_id
- as_of_time
- created_at
- content_hash
- record_count
- grain
- lineage_id
- execution_status
- quality_status
- metadata
- alias_of
- records
additionalProperties: false
