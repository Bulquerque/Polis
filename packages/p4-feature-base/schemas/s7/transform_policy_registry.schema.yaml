$schema: https://json-schema.org/draft/2020-12/schema
title: transform_policy_registry
type: object
properties:
  artifact_id:
    type: string
    minLength: 1
  artifact_name:
    type: string
    minLength: 1
  schema_version:
    type: string
    minLength: 1
  producer_phase:
    type: string
  producer_module_id:
    type: string
  run_id:
    type: string
  cycle_id:
    type: string
  as_of_time:
    type: string
    format: date-time
  created_at:
    type: string
    format: date-time
  content_hash:
    type: string
    pattern: ^[0-9a-f]{64}$
  record_count:
    type: integer
    minimum: 0
  grain:
    type: array
    items:
      type: string
  lineage_id:
    type: string
  execution_status:
    type: string
  quality_status:
    type: string
  metadata:
    type: object
  alias_of:
    type:
    - string
    - 'null'
  records:
    type: array
    items:
      type: object
      properties:
        feature_id:
          type: string
        horizon_group:
          type: string
        transform_type:
          enum:
          - identity
          - signed_log1p
          - standard_zscore
          - robust_zscore
          - winsorized_robust_zscore
        window_type:
          enum:
          - expanding
          - rolling
        lookback_timestamps:
          type:
          - integer
          - 'null'
          minimum: 1
        min_observations:
          type: integer
          minimum: 2
        refit_every_n_timestamps:
          type: integer
          minimum: 1
        lower_quantile:
          type: number
          minimum: 0
          maximum: 1
        upper_quantile:
          type: number
          minimum: 0
          maximum: 1
        epsilon:
          type: number
          exclusiveMinimum: 0
      required:
      - feature_id
      - horizon_group
      - transform_type
      - window_type
      - lookback_timestamps
      - min_observations
      - refit_every_n_timestamps
      - lower_quantile
      - upper_quantile
      - epsilon
      additionalProperties: false
required:
- artifact_id
- artifact_name
- schema_version
- producer_phase
- producer_module_id
- run_id
- cycle_id
- as_of_time
- created_at
- content_hash
- record_count
- grain
- lineage_id
- execution_status
- quality_status
- metadata
- alias_of
- records
additionalProperties: false
