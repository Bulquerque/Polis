$schema: https://json-schema.org/draft/2020-12/schema
title: feature_diversity_redundancy_report
type: object
properties:
  artifact_id:
    type: string
    minLength: 1
  artifact_name:
    type: string
    minLength: 1
  schema_version:
    type: string
    minLength: 1
  producer_phase:
    type: string
  producer_module_id:
    type: string
  run_id:
    type: string
  cycle_id:
    type: string
  as_of_time:
    type: string
    format: date-time
  created_at:
    type: string
    format: date-time
  content_hash:
    type: string
    pattern: ^[0-9a-f]{64}$
  record_count:
    type: integer
    minimum: 0
  grain:
    type: array
    items:
      type: string
  lineage_id:
    type: string
  execution_status:
    type: string
  quality_status:
    type: string
  metadata:
    type: object
    properties:
      clusters:
        type: object
        additionalProperties:
          type: object
          required:
          - horizon_group
          - members
          properties:
            horizon_group:
              type: string
            members:
              type: array
              minItems: 2
              items:
                type: string
              uniqueItems: true
          additionalProperties: false
      matrix_id:
        type: string
    required:
    - clusters
    - matrix_id
    additionalProperties: false
  alias_of:
    type:
    - string
    - 'null'
  records:
    type: array
    items:
      type: object
      properties:
        horizon_group:
          type: string
        feature_id_a:
          type: string
        feature_id_b:
          type: string
        overlap_count:
          type: integer
        observed_jaccard:
          type:
          - number
          - 'null'
        pearson:
          type:
          - number
          - 'null'
        spearman:
          type:
          - number
          - 'null'
        mutual_information:
          type:
          - number
          - 'null'
        distance_correlation:
          type:
          - number
          - 'null'
        classification:
          type: string
        redundancy_cluster_id:
          type:
          - string
          - 'null'
      required:
      - horizon_group
      - feature_id_a
      - feature_id_b
      - overlap_count
      - observed_jaccard
      - pearson
      - spearman
      - mutual_information
      - distance_correlation
      - classification
      - redundancy_cluster_id
      additionalProperties: false
required:
- artifact_id
- artifact_name
- schema_version
- producer_phase
- producer_module_id
- run_id
- cycle_id
- as_of_time
- created_at
- content_hash
- record_count
- grain
- lineage_id
- execution_status
- quality_status
- metadata
- alias_of
- records
additionalProperties: false
