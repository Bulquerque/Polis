$schema: https://json-schema.org/draft/2020-12/schema
title: encoder_hyperparameter_search_plan
type: object
properties:
  artifact_id:
    type: string
  artifact_name:
    type: string
  schema_version:
    type: string
  producer_phase:
    type: string
  producer_module_id:
    type: string
  run_id:
    type: string
  cycle_id:
    type: string
  as_of_time:
    type: string
    format: date-time
  created_at:
    type: string
    format: date-time
  content_hash:
    type: string
    pattern: ^[0-9a-f]{64}$
  record_count:
    type: integer
    minimum: 0
  grain:
    type: array
    items:
      type: string
  lineage_id:
    type: string
  execution_status:
    type: string
  quality_status:
    type: string
  metadata:
    type: object
  alias_of:
    type:
    - string
    - 'null'
  records:
    type: array
    items:
      type: object
      properties:
        config_id:
          type: string
        bottleneck_ratio:
          type: number
        corruption_rate:
          type: number
        modality_dropout:
          type: number
      required:
      - config_id
      - bottleneck_ratio
      - corruption_rate
      - modality_dropout
      additionalProperties: false
required:
- artifact_id
- artifact_name
- schema_version
- producer_phase
- producer_module_id
- run_id
- cycle_id
- as_of_time
- created_at
- content_hash
- record_count
- grain
- lineage_id
- execution_status
- quality_status
- metadata
- alias_of
- records
additionalProperties: false
