$schema: https://json-schema.org/draft/2020-12/schema
title: underlying_feature_factors_pca
type: object
properties:
  artifact_id:
    type: string
  artifact_name:
    type: string
  schema_version:
    type: string
  producer_phase:
    type: string
  producer_module_id:
    type: string
  run_id:
    type: string
  cycle_id:
    type: string
  as_of_time:
    type: string
    format: date-time
  created_at:
    type: string
    format: date-time
  content_hash:
    type: string
    pattern: ^[0-9a-f]{64}$
  record_count:
    type: integer
    minimum: 0
  grain:
    type: array
    items:
      type: string
  lineage_id:
    type: string
  execution_status:
    type: string
  quality_status:
    type: string
  metadata:
    type: object
  alias_of:
    type:
    - string
    - 'null'
  records:
    type: array
    items:
      type: object
      properties:
        decision_time:
          type: string
          format: date-time
        entity_id:
          type: string
        family_id:
          type: string
        horizon_group:
          type: string
        representation_type:
          enum:
          - PCA
          - SPARSE_PCA
        component_values:
          type: array
          items:
            type: number
        fit_state_id:
          type: string
        fold_id:
          type: string
        lineage_id:
          type: string
      required:
      - decision_time
      - entity_id
      - family_id
      - horizon_group
      - representation_type
      - component_values
      - fit_state_id
      - fold_id
      - lineage_id
      additionalProperties: false
required:
- artifact_id
- artifact_name
- schema_version
- producer_phase
- producer_module_id
- run_id
- cycle_id
- as_of_time
- created_at
- content_hash
- record_count
- grain
- lineage_id
- execution_status
- quality_status
- metadata
- alias_of
- records
additionalProperties: false
