$schema: https://json-schema.org/draft/2020-12/schema
title: representation_quality_report
type: object
properties:
  artifact_id:
    type: string
  artifact_name:
    type: string
  schema_version:
    type: string
  producer_phase:
    type: string
  producer_module_id:
    type: string
  run_id:
    type: string
  cycle_id:
    type: string
  as_of_time:
    type: string
    format: date-time
  created_at:
    type: string
    format: date-time
  content_hash:
    type: string
    pattern: ^[0-9a-f]{64}$
  record_count:
    type: integer
    minimum: 0
  grain:
    type: array
    items:
      type: string
  lineage_id:
    type: string
  execution_status:
    type: string
  quality_status:
    type: string
  metadata:
    type: object
  alias_of:
    type:
    - string
    - 'null'
  records:
    type: array
    items:
      type: object
      properties:
        representation_id:
          type: string
        family_id:
          type: string
        horizon_group:
          type: string
        representation_type:
          type: string
        fold_id:
          type: string
        reconstruction_rmse:
          type: number
        explained_variance_sum:
          type:
          - number
          - 'null'
        loading_sparsity:
          type: number
        converged:
          type: boolean
        quality_state:
          type: string
      required:
      - representation_id
      - family_id
      - horizon_group
      - representation_type
      - fold_id
      - reconstruction_rmse
      - explained_variance_sum
      - loading_sparsity
      - converged
      - quality_state
      additionalProperties: false
required:
- artifact_id
- artifact_name
- schema_version
- producer_phase
- producer_module_id
- run_id
- cycle_id
- as_of_time
- created_at
- content_hash
- record_count
- grain
- lineage_id
- execution_status
- quality_status
- metadata
- alias_of
- records
additionalProperties: false
