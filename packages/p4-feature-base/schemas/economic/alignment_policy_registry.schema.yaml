$defs:
  AlignmentDirection:
    enum:
    - BACKWARD
    title: AlignmentDirection
    type: string
  AlignmentPolicyRecord:
    additionalProperties: false
    properties:
      horizon_group:
        $ref: '#/$defs/HorizonGroup'
      max_age_seconds:
        minimum: 0
        title: Max Age Seconds
        type: integer
      emit_missing_records:
        default: true
        title: Emit Missing Records
        type: boolean
    required:
    - horizon_group
    - max_age_seconds
    title: AlignmentPolicyRecord
    type: object
  AnchorMode:
    enum:
    - UNION_OBSERVED_TIMES
    title: AnchorMode
    type: string
  BroadcastRule:
    additionalProperties: false
    properties:
      feature_id:
        minLength: 1
        title: Feature Id
        type: string
      source_entity_id:
        minLength: 1
        title: Source Entity Id
        type: string
      target_scope:
        pattern: ^ALL_LOCAL_ENTITIES$
        title: Target Scope
        type: string
      excluded_target_entity_ids:
        default: []
        items:
          type: string
        title: Excluded Target Entity Ids
        type: array
    required:
    - feature_id
    - source_entity_id
    - target_scope
    title: BroadcastRule
    type: object
  HorizonGroup:
    enum:
    - INTRADAY
    - SHORT
    - MEDIUM
    - LONG
    - CROSS_HORIZON
    title: HorizonGroup
    type: string
additionalProperties: false
properties:
  artifact_id:
    minLength: 1
    title: Artifact Id
    type: string
  schema_version:
    minLength: 1
    title: Schema Version
    type: string
  pipeline_version:
    minLength: 1
    title: Pipeline Version
    type: string
  run_id:
    minLength: 1
    title: Run Id
    type: string
  cycle_id:
    minLength: 1
    title: Cycle Id
    type: string
  as_of_time:
    format: date-time
    title: As Of Time
    type: string
  lineage_id:
    minLength: 1
    title: Lineage Id
    type: string
  direction:
    $ref: '#/$defs/AlignmentDirection'
    default: BACKWARD
  anchor_mode:
    $ref: '#/$defs/AnchorMode'
    default: UNION_OBSERVED_TIMES
  max_output_records:
    exclusiveMinimum: 0
    maximum: 10000000
    title: Max Output Records
    type: integer
  global_entity_ids:
    default: []
    items:
      type: string
    title: Global Entity Ids
    type: array
  policies:
    items:
      $ref: '#/$defs/AlignmentPolicyRecord'
    title: Policies
    type: array
  broadcast_rules:
    default: []
    items:
      $ref: '#/$defs/BroadcastRule'
    title: Broadcast Rules
    type: array
required:
- artifact_id
- schema_version
- pipeline_version
- run_id
- cycle_id
- as_of_time
- lineage_id
- max_output_records
- policies
title: alignment_policy_registry
type: object
$schema: https://json-schema.org/draft/2020-12/schema
