$defs:
  ExecutionStatus:
    enum:
    - PRODUCED
    - DEGRADED
    - SKIPPED_NOT_AUTHORIZED
    - UNAVAILABLE_UPSTREAM
    - FAILED_NONBLOCKING
    - BLOCKED
    title: ExecutionStatus
    type: string
  FeatureKind:
    enum:
    - PERSPECTIVE
    - CONFLICT
    - INTERACTION
    title: FeatureKind
    type: string
  HorizonFeatureRecord:
    additionalProperties: false
    properties:
      decision_time:
        format: date-time
        title: Decision Time
        type: string
      entity_id:
        minLength: 1
        title: Entity Id
        type: string
      feature_id:
        minLength: 1
        title: Feature Id
        type: string
      feature_kind:
        $ref: '#/$defs/FeatureKind'
      phenomenon_id:
        minLength: 1
        title: Phenomenon Id
        type: string
      horizon_group:
        $ref: '#/$defs/HorizonGroup'
      value:
        anyOf:
        - type: number
        - type: 'null'
        title: Value
      unit:
        minLength: 1
        title: Unit
        type: string
      information_age_seconds:
        anyOf:
        - type: number
        - type: 'null'
        title: Information Age Seconds
      is_observed:
        title: Is Observed
        type: boolean
      quality_state:
        $ref: '#/$defs/QualityState'
      missingness_state:
        $ref: '#/$defs/MissingnessState'
      source_feature_ids:
        items:
          type: string
        title: Source Feature Ids
        type: array
      record_lineage_id:
        minLength: 1
        title: Record Lineage Id
        type: string
      attributes:
        additionalProperties: true
        title: Attributes
        type: object
    required:
    - decision_time
    - entity_id
    - feature_id
    - feature_kind
    - phenomenon_id
    - horizon_group
    - value
    - unit
    - information_age_seconds
    - is_observed
    - quality_state
    - missingness_state
    - source_feature_ids
    - record_lineage_id
    title: HorizonFeatureRecord
    type: object
  HorizonGroup:
    enum:
    - INTRADAY
    - SHORT
    - MEDIUM
    - LONG
    - CROSS_HORIZON
    title: HorizonGroup
    type: string
  MissingnessState:
    enum:
    - OBSERVED
    - NOT_APPLICABLE
    - NOT_YET_PUBLISHED
    - SOURCE_UNAVAILABLE
    - LATE_ARRIVAL
    - STALE
    - STRUCTURALLY_MISSING
    - QUALITY_BLOCKED
    - UNAVAILABLE_UPSTREAM
    title: MissingnessState
    type: string
  QualityState:
    enum:
    - PASS
    - DEGRADED
    - BLOCKED
    title: QualityState
    type: string
additionalProperties: false
properties:
  artifact_id:
    minLength: 1
    title: Artifact Id
    type: string
  artifact_name:
    default: horizon_feature_panel
    title: Artifact Name
    type: string
  schema_version:
    minLength: 1
    title: Schema Version
    type: string
  pipeline_version:
    minLength: 1
    title: Pipeline Version
    type: string
  phase_id:
    default: P4
    title: Phase Id
    type: string
  subphase_id:
    default: P4.S6
    title: Subphase Id
    type: string
  producer_module_id:
    default: P4.S6.M04
    title: Producer Module Id
    type: string
  run_id:
    minLength: 1
    title: Run Id
    type: string
  cycle_id:
    minLength: 1
    title: Cycle Id
    type: string
  as_of_time:
    format: date-time
    title: As Of Time
    type: string
  created_at:
    format: date-time
    title: Created At
    type: string
  content_hash:
    pattern: ^[a-f0-9]{64}$
    title: Content Hash
    type: string
  lineage_id:
    minLength: 1
    title: Lineage Id
    type: string
  execution_status:
    $ref: '#/$defs/ExecutionStatus'
  quality_status:
    $ref: '#/$defs/QualityState'
  quality_reasons:
    default: []
    items:
      type: string
    title: Quality Reasons
    type: array
  records:
    items:
      $ref: '#/$defs/HorizonFeatureRecord'
    title: Records
    type: array
required:
- artifact_id
- schema_version
- pipeline_version
- run_id
- cycle_id
- as_of_time
- created_at
- content_hash
- lineage_id
- execution_status
- quality_status
- records
title: horizon_feature_panel
type: object
$schema: https://json-schema.org/draft/2020-12/schema
