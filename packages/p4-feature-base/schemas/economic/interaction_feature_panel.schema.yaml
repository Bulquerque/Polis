$defs:
  ExecutionStatus:
    enum:
    - PRODUCED
    - DEGRADED
    - SKIPPED_NOT_AUTHORIZED
    - UNAVAILABLE_UPSTREAM
    - FAILED_NONBLOCKING
    - BLOCKED
    title: ExecutionStatus
    type: string
  HorizonGroup:
    enum:
    - INTRADAY
    - SHORT
    - MEDIUM
    - LONG
    - CROSS_HORIZON
    title: HorizonGroup
    type: string
  InteractionFeatureRecord:
    additionalProperties: false
    properties:
      decision_time:
        format: date-time
        title: Decision Time
        type: string
      entity_id:
        minLength: 1
        title: Entity Id
        type: string
      feature_id:
        minLength: 1
        title: Feature Id
        type: string
      interaction_id:
        minLength: 1
        title: Interaction Id
        type: string
      phenomenon_id:
        minLength: 1
        title: Phenomenon Id
        type: string
      perspective_id:
        minLength: 1
        title: Perspective Id
        type: string
      horizon_group:
        $ref: '#/$defs/HorizonGroup'
      operation:
        $ref: '#/$defs/InteractionOperation'
      value:
        anyOf:
        - type: number
        - type: 'null'
        title: Value
      unit:
        minLength: 1
        title: Unit
        type: string
      parent_feature_ids:
        items:
          type: string
        title: Parent Feature Ids
        type: array
      quality_state:
        $ref: '#/$defs/QualityState'
      missingness_state:
        $ref: '#/$defs/MissingnessState'
      record_lineage_id:
        minLength: 1
        title: Record Lineage Id
        type: string
      attributes:
        additionalProperties: true
        title: Attributes
        type: object
    required:
    - decision_time
    - entity_id
    - feature_id
    - interaction_id
    - phenomenon_id
    - perspective_id
    - horizon_group
    - operation
    - value
    - unit
    - parent_feature_ids
    - quality_state
    - missingness_state
    - record_lineage_id
    title: InteractionFeatureRecord
    type: object
  InteractionOperation:
    enum:
    - SIGN_AGREEMENT
    - SAFE_RATIO
    - NONNEGATIVE_GEOMETRIC_MEAN
    title: InteractionOperation
    type: string
  MissingnessState:
    enum:
    - OBSERVED
    - NOT_APPLICABLE
    - NOT_YET_PUBLISHED
    - SOURCE_UNAVAILABLE
    - LATE_ARRIVAL
    - STALE
    - STRUCTURALLY_MISSING
    - QUALITY_BLOCKED
    - UNAVAILABLE_UPSTREAM
    title: MissingnessState
    type: string
  QualityState:
    enum:
    - PASS
    - DEGRADED
    - BLOCKED
    title: QualityState
    type: string
additionalProperties: false
properties:
  artifact_id:
    minLength: 1
    title: Artifact Id
    type: string
  artifact_name:
    default: interaction_feature_panel
    title: Artifact Name
    type: string
  schema_version:
    minLength: 1
    title: Schema Version
    type: string
  pipeline_version:
    minLength: 1
    title: Pipeline Version
    type: string
  phase_id:
    default: P4
    title: Phase Id
    type: string
  subphase_id:
    default: P4.S6
    title: Subphase Id
    type: string
  producer_module_id:
    default: P4.S6.M03
    title: Producer Module Id
    type: string
  run_id:
    minLength: 1
    title: Run Id
    type: string
  cycle_id:
    minLength: 1
    title: Cycle Id
    type: string
  as_of_time:
    format: date-time
    title: As Of Time
    type: string
  created_at:
    format: date-time
    title: Created At
    type: string
  content_hash:
    pattern: ^[a-f0-9]{64}$
    title: Content Hash
    type: string
  lineage_id:
    minLength: 1
    title: Lineage Id
    type: string
  execution_status:
    $ref: '#/$defs/ExecutionStatus'
  quality_status:
    $ref: '#/$defs/QualityState'
  quality_reasons:
    default: []
    items:
      type: string
    title: Quality Reasons
    type: array
  records:
    items:
      $ref: '#/$defs/InteractionFeatureRecord'
    title: Records
    type: array
required:
- artifact_id
- schema_version
- pipeline_version
- run_id
- cycle_id
- as_of_time
- created_at
- content_hash
- lineage_id
- execution_status
- quality_status
- records
title: interaction_feature_panel
type: object
$schema: https://json-schema.org/draft/2020-12/schema
