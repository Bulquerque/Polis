$defs:
  ConflictMode:
    enum:
    - SIGNED_DIRECTIONAL
    - MAGNITUDE_DISPERSION
    title: ConflictMode
    type: string
  ConflictRecord:
    additionalProperties: false
    properties:
      decision_time:
        format: date-time
        title: Decision Time
        type: string
      entity_id:
        minLength: 1
        title: Entity Id
        type: string
      group_id:
        minLength: 1
        title: Group Id
        type: string
      output_prefix:
        minLength: 1
        title: Output Prefix
        type: string
      phenomenon_id:
        minLength: 1
        title: Phenomenon Id
        type: string
      horizon_group:
        $ref: '#/$defs/HorizonGroup'
      mode:
        $ref: '#/$defs/ConflictMode'
      consensus_score:
        anyOf:
        - type: number
        - type: 'null'
        title: Consensus Score
      conflict_score:
        anyOf:
        - type: number
        - type: 'null'
        title: Conflict Score
      dispersion_score:
        anyOf:
        - type: number
        - type: 'null'
        title: Dispersion Score
      entropy_score:
        anyOf:
        - type: number
        - type: 'null'
        title: Entropy Score
      minority_view_strength:
        anyOf:
        - type: number
        - type: 'null'
        title: Minority View Strength
      available_view_count:
        minimum: 0
        title: Available View Count
        type: integer
      independent_view_count:
        minimum: 0
        title: Independent View Count
        type: integer
      expected_view_count:
        exclusiveMinimum: 0
        title: Expected View Count
        type: integer
      dominant_modality:
        anyOf:
        - type: string
        - type: 'null'
        title: Dominant Modality
      quality_state:
        $ref: '#/$defs/QualityState'
      missingness_state:
        $ref: '#/$defs/MissingnessState'
      record_lineage_id:
        minLength: 1
        title: Record Lineage Id
        type: string
      source_feature_ids:
        items:
          type: string
        title: Source Feature Ids
        type: array
      attributes:
        additionalProperties: true
        title: Attributes
        type: object
    required:
    - decision_time
    - entity_id
    - group_id
    - output_prefix
    - phenomenon_id
    - horizon_group
    - mode
    - consensus_score
    - conflict_score
    - dispersion_score
    - entropy_score
    - minority_view_strength
    - available_view_count
    - independent_view_count
    - expected_view_count
    - dominant_modality
    - quality_state
    - missingness_state
    - record_lineage_id
    - source_feature_ids
    title: ConflictRecord
    type: object
  ExecutionStatus:
    enum:
    - PRODUCED
    - DEGRADED
    - SKIPPED_NOT_AUTHORIZED
    - UNAVAILABLE_UPSTREAM
    - FAILED_NONBLOCKING
    - BLOCKED
    title: ExecutionStatus
    type: string
  HorizonGroup:
    enum:
    - INTRADAY
    - SHORT
    - MEDIUM
    - LONG
    - CROSS_HORIZON
    title: HorizonGroup
    type: string
  MissingnessState:
    enum:
    - OBSERVED
    - NOT_APPLICABLE
    - NOT_YET_PUBLISHED
    - SOURCE_UNAVAILABLE
    - LATE_ARRIVAL
    - STALE
    - STRUCTURALLY_MISSING
    - QUALITY_BLOCKED
    - UNAVAILABLE_UPSTREAM
    title: MissingnessState
    type: string
  QualityState:
    enum:
    - PASS
    - DEGRADED
    - BLOCKED
    title: QualityState
    type: string
additionalProperties: false
properties:
  artifact_id:
    minLength: 1
    title: Artifact Id
    type: string
  artifact_name:
    default: perspective_conflict_panel
    title: Artifact Name
    type: string
  schema_version:
    minLength: 1
    title: Schema Version
    type: string
  pipeline_version:
    minLength: 1
    title: Pipeline Version
    type: string
  phase_id:
    default: P4
    title: Phase Id
    type: string
  subphase_id:
    default: P4.S6
    title: Subphase Id
    type: string
  producer_module_id:
    default: P4.S6.M02
    title: Producer Module Id
    type: string
  run_id:
    minLength: 1
    title: Run Id
    type: string
  cycle_id:
    minLength: 1
    title: Cycle Id
    type: string
  as_of_time:
    format: date-time
    title: As Of Time
    type: string
  created_at:
    format: date-time
    title: Created At
    type: string
  content_hash:
    pattern: ^[a-f0-9]{64}$
    title: Content Hash
    type: string
  lineage_id:
    minLength: 1
    title: Lineage Id
    type: string
  execution_status:
    $ref: '#/$defs/ExecutionStatus'
  quality_status:
    $ref: '#/$defs/QualityState'
  quality_reasons:
    default: []
    items:
      type: string
    title: Quality Reasons
    type: array
  records:
    items:
      $ref: '#/$defs/ConflictRecord'
    title: Records
    type: array
required:
- artifact_id
- schema_version
- pipeline_version
- run_id
- cycle_id
- as_of_time
- created_at
- content_hash
- lineage_id
- execution_status
- quality_status
- records
title: perspective_conflict_panel
type: object
$schema: https://json-schema.org/draft/2020-12/schema
