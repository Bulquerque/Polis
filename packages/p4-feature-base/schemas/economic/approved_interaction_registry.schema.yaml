$defs:
  HorizonGroup:
    enum:
    - INTRADAY
    - SHORT
    - MEDIUM
    - LONG
    - CROSS_HORIZON
    title: HorizonGroup
    type: string
  InteractionOperation:
    enum:
    - SIGN_AGREEMENT
    - SAFE_RATIO
    - NONNEGATIVE_GEOMETRIC_MEAN
    title: InteractionOperation
    type: string
  InteractionSpec:
    additionalProperties: false
    properties:
      interaction_id:
        minLength: 1
        title: Interaction Id
        type: string
      output_feature_id:
        minLength: 1
        title: Output Feature Id
        type: string
      phenomenon_id:
        minLength: 1
        title: Phenomenon Id
        type: string
      perspective_id:
        minLength: 1
        title: Perspective Id
        type: string
      horizon_group:
        $ref: '#/$defs/HorizonGroup'
      operation:
        $ref: '#/$defs/InteractionOperation'
      parent_feature_ids:
        items:
          type: string
        title: Parent Feature Ids
        type: array
      rationale_id:
        minLength: 1
        title: Rationale Id
        type: string
      strong_heredity:
        default: true
        title: Strong Heredity
        type: boolean
      enabled:
        default: true
        title: Enabled
        type: boolean
      parameters:
        additionalProperties: true
        title: Parameters
        type: object
    required:
    - interaction_id
    - output_feature_id
    - phenomenon_id
    - perspective_id
    - horizon_group
    - operation
    - parent_feature_ids
    - rationale_id
    title: InteractionSpec
    type: object
additionalProperties: false
properties:
  artifact_id:
    minLength: 1
    title: Artifact Id
    type: string
  schema_version:
    minLength: 1
    title: Schema Version
    type: string
  pipeline_version:
    minLength: 1
    title: Pipeline Version
    type: string
  run_id:
    minLength: 1
    title: Run Id
    type: string
  cycle_id:
    minLength: 1
    title: Cycle Id
    type: string
  as_of_time:
    format: date-time
    title: As Of Time
    type: string
  lineage_id:
    minLength: 1
    title: Lineage Id
    type: string
  maximum_interactions:
    exclusiveMinimum: 0
    maximum: 500
    title: Maximum Interactions
    type: integer
  records:
    items:
      $ref: '#/$defs/InteractionSpec'
    title: Records
    type: array
required:
- artifact_id
- schema_version
- pipeline_version
- run_id
- cycle_id
- as_of_time
- lineage_id
- maximum_interactions
- records
title: approved_interaction_registry
type: object
$schema: https://json-schema.org/draft/2020-12/schema
