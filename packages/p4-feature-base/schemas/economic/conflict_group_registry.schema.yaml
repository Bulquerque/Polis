$defs:
  ConflictGroupSpec:
    additionalProperties: false
    properties:
      group_id:
        minLength: 1
        title: Group Id
        type: string
      output_prefix:
        minLength: 1
        title: Output Prefix
        type: string
      phenomenon_id:
        minLength: 1
        title: Phenomenon Id
        type: string
      horizon_group:
        $ref: '#/$defs/HorizonGroup'
      mode:
        $ref: '#/$defs/ConflictMode'
      min_views:
        minimum: 2
        title: Min Views
        type: integer
      members:
        items:
          $ref: '#/$defs/ConflictMemberSpec'
        title: Members
        type: array
      enabled:
        default: true
        title: Enabled
        type: boolean
    required:
    - group_id
    - output_prefix
    - phenomenon_id
    - horizon_group
    - mode
    - min_views
    - members
    title: ConflictGroupSpec
    type: object
  ConflictMemberSpec:
    additionalProperties: false
    properties:
      feature_id:
        minLength: 1
        title: Feature Id
        type: string
      direction_multiplier:
        maximum: 1
        minimum: -1
        title: Direction Multiplier
        type: integer
      independence_group:
        minLength: 1
        title: Independence Group
        type: string
      weight:
        exclusiveMinimum: 0
        title: Weight
        type: number
    required:
    - feature_id
    - direction_multiplier
    - independence_group
    - weight
    title: ConflictMemberSpec
    type: object
  ConflictMode:
    enum:
    - SIGNED_DIRECTIONAL
    - MAGNITUDE_DISPERSION
    title: ConflictMode
    type: string
  HorizonGroup:
    enum:
    - INTRADAY
    - SHORT
    - MEDIUM
    - LONG
    - CROSS_HORIZON
    title: HorizonGroup
    type: string
additionalProperties: false
properties:
  artifact_id:
    minLength: 1
    title: Artifact Id
    type: string
  schema_version:
    minLength: 1
    title: Schema Version
    type: string
  pipeline_version:
    minLength: 1
    title: Pipeline Version
    type: string
  run_id:
    minLength: 1
    title: Run Id
    type: string
  cycle_id:
    minLength: 1
    title: Cycle Id
    type: string
  as_of_time:
    format: date-time
    title: As Of Time
    type: string
  lineage_id:
    minLength: 1
    title: Lineage Id
    type: string
  records:
    items:
      $ref: '#/$defs/ConflictGroupSpec'
    title: Records
    type: array
required:
- artifact_id
- schema_version
- pipeline_version
- run_id
- cycle_id
- as_of_time
- lineage_id
- records
title: conflict_group_registry
type: object
$schema: https://json-schema.org/draft/2020-12/schema
