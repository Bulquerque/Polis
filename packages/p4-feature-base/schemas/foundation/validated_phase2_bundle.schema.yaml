$schema: https://json-schema.org/draft/2020-12/schema
title: Validated P2 bundle
type: object
additionalProperties: false
properties:
  artifact_id:
    type: string
    minLength: 1
  artifact_name:
    type: string
    minLength: 1
  schema_id:
    type: string
    minLength: 1
  schema_version:
    type: string
    minLength: 1
  created_at:
    type: string
    format: date-time
  run_id:
    type: string
    minLength: 1
  cycle_id:
    type: string
    minLength: 1
  as_of_time:
    type: string
    format: date-time
  pipeline_version:
    type: string
    minLength: 1
  lineage_id:
    type: string
    minLength: 1
  producer_module_id:
    type: string
    pattern: ^P4\.S1\.M0[1-4]$
  content_hash:
    type: string
    pattern: ^[a-f0-9]{64}$
  status:
    type: string
  records:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        artifact_name:
          type: string
        artifact_id:
          type: string
        schema_id:
          type:
          - string
          - 'null'
        schema_version:
          type:
          - string
          - 'null'
        content_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        legacy_content_hash:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{64}$
        lineage_id:
          type: string
        row_count:
          type: integer
          minimum: 0
        quality_status:
          type: string
        compatibility_status:
          type: string
        warnings:
          type: array
          items:
            type: string
      required:
      - artifact_name
      - artifact_id
      - content_hash
      - lineage_id
      - row_count
      - quality_status
      - compatibility_status
      - warnings
  source_manifest_id:
    type: string
  quality_status:
    type: string
required:
- artifact_id
- artifact_name
- schema_id
- schema_version
- created_at
- run_id
- cycle_id
- as_of_time
- pipeline_version
- lineage_id
- producer_module_id
- content_hash
- status
- records
