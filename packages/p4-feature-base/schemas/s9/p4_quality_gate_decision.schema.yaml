$schema: https://json-schema.org/draft/2020-12/schema
title: p4_quality_gate_decision
type: object
properties:
  artifact_id:
    type: string
  artifact_name:
    const: p4_quality_gate_decision
  schema_version:
    type: string
  producer_phase:
    const: phase_04_feature_base
  producer_module_id:
    type: string
  run_id:
    type: string
  cycle_id:
    type: string
  as_of_time:
    type: string
    format: date-time
  created_at:
    type: string
    format: date-time
  content_hash:
    type: string
    pattern: ^[0-9a-f]{64}$
  record_count:
    type: integer
    minimum: 0
  grain:
    type: array
    items:
      type: string
  lineage_id:
    type: string
  execution_status:
    enum:
    - PRODUCED
    - DEGRADED
    - BLOCKED
    - SKIPPED_NOT_AVAILABLE
    - SKIPPED_NOT_AUTHORIZED
    - UNAVAILABLE_UPSTREAM
    - FAILED_NONBLOCKING
    - NOT_RUN
  quality_status:
    enum:
    - VALIDATED
    - DEGRADED
    - BLOCKED
    - NOT_EVALUATED
  records:
    type: array
    items:
      type: object
      properties:
        gate_scope:
          enum:
          - FAMILY
          - REPRESENTATION
          - HANDOFF
        scope_id:
          type: string
        decision:
          enum:
          - PASS
          - PASS_WITH_DEGRADATION
          - PARTIAL_HANDOFF
          - BLOCK_FAMILY
          - BLOCK_REPRESENTATION
          - BLOCK_HANDOFF
        block_count:
          type: integer
          minimum: 0
        warn_count:
          type: integer
          minimum: 0
        reason_codes:
          type: array
          items:
            type: string
        selected_feature_count:
          type: integer
          minimum: 0
        minimum_required_features:
          type: integer
          minimum: 0
      required:
      - gate_scope
      - scope_id
      - decision
      - block_count
      - warn_count
      - reason_codes
      - selected_feature_count
      - minimum_required_features
      additionalProperties: false
  metadata:
    type: object
    properties: {}
    additionalProperties: true
  alias_of:
    type:
    - string
    - 'null'
required:
- artifact_id
- artifact_name
- schema_version
- producer_phase
- producer_module_id
- run_id
- cycle_id
- as_of_time
- created_at
- content_hash
- record_count
- grain
- lineage_id
- execution_status
- quality_status
- records
- metadata
- alias_of
additionalProperties: false
