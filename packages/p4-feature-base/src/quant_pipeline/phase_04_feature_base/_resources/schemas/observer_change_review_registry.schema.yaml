$schema: https://json-schema.org/draft/2020-12/schema
title: observer_change_review_registry
type: object
additionalProperties: true
properties:
  artifact_id:
    type: string
    minLength: 1
  artifact_name:
    const: observer_change_review_registry
  schema_id:
    type: string
    minLength: 1
  schema_version:
    type: string
    minLength: 1
  created_at:
    type: string
    format: date-time
  run_id:
    type: string
    minLength: 1
  cycle_id:
    type: string
    minLength: 1
  as_of_time:
    type: string
    format: date-time
  decision_time:
    type: string
    format: date-time
  pipeline_version:
    type: string
    minLength: 1
  lineage_id:
    type: string
    minLength: 1
  producer_module_id:
    const: P4.S3.M01
  content_hash:
    type: string
    pattern: ^[a-f0-9]{64}$
  status:
    type: string
  records:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        review_id:
          type: string
        proposal_id:
          type: string
        source_manifest_id:
          type: string
        source_cycle_id:
          type: string
        target_cycle_id:
          type: string
        decision:
          enum:
          - ACCEPT
          - REJECT
          - DEFER
          - DUPLICATE
        reason_code:
          type: string
        reviewed_at:
          type: string
          format: date-time
        lineage_id:
          type: string
      required:
      - review_id
      - proposal_id
      - source_manifest_id
      - source_cycle_id
      - target_cycle_id
      - decision
      - reason_code
      - reviewed_at
      - lineage_id
  review_mode:
    type: string
required:
- artifact_id
- artifact_name
- schema_id
- schema_version
- created_at
- run_id
- cycle_id
- as_of_time
- decision_time
- pipeline_version
- lineage_id
- producer_module_id
- content_hash
- status
- records
