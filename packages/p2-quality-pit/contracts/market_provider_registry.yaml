    country: BR
    venue: B3
    authority_class: EXCHANGE_OFFICIAL
    capabilities:
      cotahist_history: REQUIRED
      instrument_reference: REQUIRED
      market_calendar: REQUIRED
      option_underlying_mapping: REQUIRED
  LONDON_STRATEGIC_EDGE:
    aliases: [LSE_DATA]
