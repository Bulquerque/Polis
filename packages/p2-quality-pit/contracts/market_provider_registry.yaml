    authority_class: THIRD_PARTY_MARKET_DATA
    capabilities:
      us_equities_history: CANDIDATE
      us_options_history: CANDIDATE
      us_option_reference: CANDIDATE
      b3_instrument_reference: UNSUPPORTED
