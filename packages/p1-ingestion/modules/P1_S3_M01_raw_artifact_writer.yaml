module_id: P1.S3.M01
module_name: raw_artifact_writer
phase: phase_01_ingestion
subphase: P1.S3
rc: RC4.1
function: Escrever artefatos raw em storage imutável sem overwrite.
inputs: &id001
- b3_raw_capture_inventory
- non_b3_raw_capture_inventory
outputs: &id002
- raw_file_inventory
- raw_artifact_store
validations:
- no_overwrite
- artifact_path_exists
fail_fast_conditions:
- raw_artifact_writer_schema_violation
- raw_artifact_writer_forbidden_field_detected
