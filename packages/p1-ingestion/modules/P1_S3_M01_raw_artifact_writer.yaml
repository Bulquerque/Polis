  emits_to:
    modules:
    - P1.S3.M02
    - P1.S5.M04
    artifacts: *id002
    phase_outputs:
    - raw_file_inventory
forbidden_connections:
- any_connection_not_listed_in_CONNECTIONS_ALLOWED
- future_phase_output_consumption
- hidden_global_state
notes: []
