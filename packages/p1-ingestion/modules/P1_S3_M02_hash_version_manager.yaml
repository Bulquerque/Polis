module_id: P1.S3.M02
module_name: hash_version_manager
phase: phase_01_ingestion
subphase: P1.S3
rc: RC4.1
function: Calcular hash, tamanho e versão para cada artefato raw.
inputs: &id001
- raw_file_inventory
- raw_artifact_store
outputs: &id002
- versioned_raw_file_inventory
validations:
- hash_present
- file_size_positive
- artifact_id_unique
fail_fast_conditions:
- hash_version_manager_schema_violation
- hash_version_manager_forbidden_field_detected
forbidden_fields:
- target
- future_return
- feature
- prediction
- score
- candidate_id
- portfolio_weight
- trade_decision
- realized_pnl
allowed_connections:
